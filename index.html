        // ── Progress de carga ─────────────────────────────────────────
        let _progRafPending = false;
        function updateLoadingProgressDOM(done, total) {
            const fill = document.getElementById('loadProgressFill');
            const pct_el = document.getElementById('loadProgressPct');
            const wrap = document.getElementById('loadProgressWrap');
            if (!fill || !wrap) return;
            if (total <= 0) return;
            wrap.style.display = 'block';
            const pct = Math.min(100, Math.round((done / total) * 100));
            fill.style.width = pct + '%';
            if (pct_el) pct_el.textContent = `${pct}%`;
        }

        async function cargarFlexPorFecha(targetDate, label, silentRetry = false, loadGen = null, backgroundRefresh = false) {
            if (!backgroundRefresh) window._vistaActual = 'dia';
            if (!backgroundRefresh) {
                _diagLines.length = 0;
                _diagStart = Date.now();
                _diagLog(`▶ cargarFlexPorFecha "${label}" silentRetry=${silentRetry}`);
            }
            const content = document.getElementById('content');
            if (!backgroundRefresh) {
                content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>Cargando entregas de ${label}...<div class="load-progress-wrap" id="loadProgressWrap" style="display:none;"><div class="load-progress-track"><div class="load-progress-fill" id="loadProgressFill"></div><div class="load-progress-pct" id="loadProgressPct">0%</div></div></div></div>`;
            }

            let allOrdersFromAllAccounts = [];
            const shippingIdsVistos = new Set();

            // Objeto de progreso compartido por ambas cuentas
            // En background refresh NO tocamos el DOM (hay contenido cacheado visible)
            const progress = { done: 0, total: 0 };
            const notifyProgress = backgroundRefresh ? () => {} : () => {
                if (_progRafPending) return;
                _progRafPending = true;
                requestAnimationFrame(() => {
                    _progRafPending = false;
                    updateLoadingProgressDOM(progress.done, progress.total);
                });
            };

            // Pre-fetch tokens de ambas cuentas en paralelo antes de las queries
            if (backgroundRefresh) {
                const pad = n => String(n).padStart(2,'0');
                const d = targetDate;
                _diagLog(`── background refresh ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ──`);
            }
            _diagLog('obteniendo tokens...');
            const tokensPreFetch = await Promise.all(CUENTAS.map(c => obtenerTokenCuenta(c)));
            _diagLog(`tokens ok: ${CUENTAS.map((c,i) => c.nombre + (tokensPreFetch[i] ? '✅' : '❌')).join(' ')}`);

            // Cargar AMBAS cuentas en PARALELO (2x más rápido)
            const cuentaResults = await Promise.all(CUENTAS.map(async (cuenta, ci) => {
                try {
                    const token = tokensPreFetch[ci];
                    if (!token) {
                        _diagLog(`❌ sin token para ${cuenta.nombre}`);
                        return [];
                    }
                    const orders = await cargarOrdenesDeCuenta(cuenta, token, targetDate, loadGen, progress, notifyProgress, backgroundRefresh);
                    _diagLog(`[${cuenta.nombre}] cargarOrdenesDeCuenta → ${orders.length} items`);
                    return orders.map(item => ({
                        ...item,
                        cuentaNombre: cuenta.nombre,
                        cuentaColor: cuenta.color
                    }));
                } catch (error) {
                    _diagLog(`❌ error cuenta ${cuenta.nombre}: ${error.message}`);
                    return [];
                }
            }));
            _diagLog(`render: ${cuentaResults.flat().length} items totales`);

            // Guard: si arrancó otra carga, no renderizar
            if (loadGen !== null && loadGeneration !== loadGen) return;

            cuentaResults.flat().forEach(item => {
                const shippingId = item.shipping.id;
                if (!shippingIdsVistos.has(shippingId)) {
                    shippingIdsVistos.add(shippingId);
                    allOrdersFromAllAccounts.push(item);
                }
            });

            if (allOrdersFromAllAccounts.length === 0) {
                // En modo retry silencioso, simplemente retornar sin mostrar error
                if (silentRetry) return;
                
                content.innerHTML = `
                    <div class="error">
                        ⚠️ No hay envíos FLEX para ${label}<br><br>
                        Si este es el primer uso, ejecutá el setup primero para configurar las cuentas.
                        <br><br>
                        <button onclick="window.location.href='setup-flex-seguro.html'" style="margin-top:15px;">
                            ⚙️ Ir a Configuración
                        </button>
                    </div>
                `;
                return;
            }

            // FILTRAR CANCELADAS:
            // - Si fue despachada (date_shipped) → siempre incluir: es reclamable.
            // - Si no fue despachada → solo incluir si la fecha estimada es targetDate.
            const processed = allOrdersFromAllAccounts.filter(({ shipping }) => {
                const state = shipping._state || getOrderState(shipping);
                if (state === 'cancelado') {
                    const fueEnviada = !!shipping.status_history?.date_shipped;
                    return fueEnviada || esEntregaParaFecha(shipping, targetDate);
                }
                return true;
            });

            // Si es background refresh, devolver los datos sin tocar la UI
            if (backgroundRefresh) {
                saveToCache(targetDate, processed);
                return processed;
            }

            allFlexOrders = processed;

            // Guardar en cache
            saveToCache(targetDate, allFlexOrders);

            // En modo retry silencioso, no renderizar si no hay órdenes activas
            if (silentRetry) {
                const activas = allFlexOrders.filter(({shipping}) => shipping._state !== 'cancelado');
                if (activas.length === 0) return;
            }

            renderCargaCompletada(label, targetDate, backgroundRefresh);
        }

        async function cargarOrdenesDeCuenta(cuenta, token, targetDate, loadGen = null, progress = null, notify = null, isBackground = false) {
            let tempOrders = [];

            const cuentaKey = cuenta.nombre.toLowerCase();
            let sellerId = sessionStorage.getItem(`${cuentaKey}_user_id`);

            // Si no tenemos sellerId todavía, intentar extraerlo del token response
            // (ya fue fetcheado en obtenerTokenCuenta — evitamos un round-trip extra)
            if (!sellerId) {
                try {
                    const tokenResponse = await fetch(`${cuenta.proxy}/get-token`);
                    const tokenData = await tokenResponse.json();
                    if (tokenData.user_id) {
                        sellerId = tokenData.user_id;
                        sessionStorage.setItem(`${cuentaKey}_user_id`, sellerId);
                    }
                } catch (error) {
                    console.error(`Error obteniendo user_id para ${cuenta.nombre}:`, error);
                }
            }

            if (!sellerId) {
                console.error(`No se encontró user_id para ${cuenta.nombre}`);
                return [];
            }

            // ── Helper de paginación — paralelo total + retry para no perder órdenes ────
            // maxPages: cap de páginas extra (cada página = 50 órdenes).
            //   filterA (delivery date) → 19 páginas extra = 1000 órdenes
            //   filterB (safety net)    → 4 páginas extra  = 250 órdenes
            async function fetchAllPages(filter, maxPages = 19) {
                // Helper con 1 retry: si falla la primera vez, esperá 200ms y reintentá
                async function fetchPage(offset) {
                    const url = `${cuenta.proxy}/api/orders/search?seller=${sellerId}&offset=${offset}&limit=50&sort=date_desc${filter}`;
                    const opts = { headers: { 'Authorization': `Bearer ${token}` } };
                    const delays = [200, 600];
                    for (let attempt = 0; attempt < 3; attempt++) {
                        try {
                            const r = await fetch(url, opts);
                            if (r.ok) return await r.json();
                        } catch {}
                        if (attempt < delays.length) await new Promise(res => setTimeout(res, delays[attempt]));
                    }
                    console.warn(`[${cuenta.nombre}] página offset=${offset} falló tras 3 intentos`);
                    return { results: [], _failed: true };
                }

                let orders = [];
                try {
                    const firstData = await fetchPage(0);
                    orders.push(...(firstData.results || []));
                    const total = firstData.paging?.total || 0;

                    if (total > 50) {
                        const pages = Math.min(Math.ceil(total / 50) - 1, maxPages);
                        _diagLog(`[${cuenta.nombre}] fetchAllPages: ${total} total → ${pages} páginas extra`);

                        // Máximo 5 páginas simultáneas para no saturar ML desde el Worker
                        const PAGE_CONC = 5;
                        const extra = new Array(pages);
                        let pi = 0;
                        await Promise.all(Array.from({ length: PAGE_CONC }, async () => {
                            while (pi < pages) {
                                const idx = pi++;
                                extra[idx] = await fetchPage((idx + 1) * 50);
                            }
                        }));
                        extra.forEach(d => orders.push(...((d?.results) || [])));

                        const expected = Math.min(total, (pages + 1) * 50);
                        if (orders.length < expected * 0.85) {
                            _diagLog(`⚠️ [${cuenta.nombre}] esperaba ${expected}, tengo ${orders.length} — algunas páginas fallaron`);
                        }
                    }
                } catch (e) {
                    console.error(`fetchAllPages error [${cuenta.nombre}]:`, e);
                }
                return orders;
            }

            // ── ESTRATEGIA SEGÚN ANTIGÜEDAD DE LA FECHA ────────────────────
            //
            // Fechas recientes (≤3 días): estrategia dual con filtro por delivery date
            //   → Query A: shipping.estimated_delivery_time = targetDate (ML server-side)
            //   → Query B: not_delivered recientes
            //
            // Fechas antiguas (>3 días): siempre date_created range
            //   → El filtro estimated_delivery_time no es confiable para el pasado
            //   → ML puede devolver resultados de fechas distintas
            // ────────────────────────────────────────────────────────────────

            const hoyCheck = new Date(); hoyCheck.setHours(0,0,0,0);
            const diasAtras = Math.round((hoyCheck - targetDate) / 86400000);
            const esFechaAntigua = diasAtras > 3;

            let allOrders;

            // Helper compartido para armar el filtro estimated_delivery_time de una fecha
            const pad = n => String(n).padStart(2,'0');
            const td = targetDate;
            const targetDateStr = `${td.getFullYear()}-${pad(td.getMonth()+1)}-${pad(td.getDate())}`;
            const deliveryFrom = encodeURIComponent(`${targetDateStr}T00:00:00.000-03:00`);
            const deliveryTo   = encodeURIComponent(`${targetDateStr}T23:59:59.000-03:00`);
            const filterA = `&shipping.estimated_delivery_time.from=${deliveryFrom}&shipping.estimated_delivery_time.to=${deliveryTo}&order.status=paid`;

            if (esFechaAntigua) {
                // filterA: estimated_delivery_time exacto para el día (órdenes activas).
                // filterC: date_created del mismo día — recupera las delivered que ML quitó del índice.
                const nextDay2 = new Date(targetDate); nextDay2.setDate(nextDay2.getDate() + 1);
                const filterCold = `&order.date_created.from=${encodeURIComponent(targetDate.toISOString().split('.')[0]+'.000-00:00')}&order.date_created.to=${encodeURIComponent(nextDay2.toISOString().split('.')[0]+'.000-00:00')}&order.status=paid`;
                _diagLog(`[${cuenta.nombre}] fecha antigua (${diasAtras}d), usando A+C`);
                const [ordA, ordC] = await Promise.all([fetchAllPages(filterA, 19), fetchAllPages(filterCold, 19)]);
                const seenOld = new Set();
                allOrders = [];
                [...ordA, ...ordC].forEach(o => {
                    const sid = o.shipping?.id;
                    if (!sid || seenOld.has(sid)) return;
                    seenOld.add(sid); allOrders.push(o);
                });
                _diagLog(`[${cuenta.nombre}] antigua A:${ordA.length} C:${ordC.length} → ${allOrders.length} únicos`);
            } else {
                // filterB: días ANTERIORES al día objetivo (viernes → targetDate exclusive).
                // Captura not_delivered y reprogramados de días previos.
                const reprogFrom = calcularDateFrom(targetDate);
                const reprogFromStr = reprogFrom.toISOString().split('.')[0] + '.000-00:00';
                const reprogToStr  = targetDate.toISOString().split('.')[0] + '.000-00:00';
                const filterB = `&order.date_created.from=${encodeURIComponent(reprogFromStr)}&order.date_created.to=${encodeURIComponent(reprogToStr)}&order.status=paid`;

                // filterC: date_created = targetDate (mismo día).
                // SIEMPRE incluida (antes era solo para días no-hoy, pero filterA no filtra
                // server-side en ML — devuelve todos los pedidos — así que la reemplazamos con C).
                // filterB cubre órdenes creadas ANTES de targetDate (reprogramadas).
                // filterC cubre órdenes creadas en targetDate (el caso más común: pedidos de hoy).
                // Juntas B+C reemplazan filterA sin el overhead de 19.000-56.000 resultados.
                const esHoy = targetDate.toDateString() === new Date().toDateString();
                const nextDay = new Date(targetDate); nextDay.setDate(nextDay.getDate() + 1);
                const filterC = `&order.date_created.from=${encodeURIComponent(targetDate.toISOString().split('.')[0]+'.000-00:00')}&order.date_created.to=${encodeURIComponent(nextDay.toISOString().split('.')[0]+'.000-00:00')}&order.status=paid`;

                // filterA (estimated_delivery_time) ignorado por ML como filtro → solo B+C
                // filterB con tope alto (50 págs = 2500 órdenes) para no truncar la ventana
                // ampliada de creación (feriados largos). Los entregados ya cacheados no se re-consultan.
                const [ordersB, ordersC] = await Promise.all([fetchAllPages(filterB, 50), fetchAllPages(filterC, 19)]);

                if (ordersB.length === 0 && ordersC.length === 0) {
                    _diagLog(`⚠️ [${cuenta.nombre}] B+C vacías → fallback filterA`);
                    const ordersA_fb = await fetchAllPages(filterA, 5);
                    const seen2 = new Set();
                    allOrders = ordersA_fb.filter(o => { const sid = o.shipping?.id; if (!sid||seen2.has(sid)) return false; seen2.add(sid); return true; });
                } else {
                    const seen = new Set();
                    allOrders = [];
                    [...ordersB, ...ordersC].forEach(o => {
                        const sid = o.shipping?.id;
                        if (!sid || seen.has(sid)) return;
                        seen.add(sid);
                        allOrders.push(o);
                    });
                }
                _diagLog(`[${cuenta.nombre}] B:${ordersB.length} C:${ordersC.length} → ${allOrders.length} únicos (filterA omitido)`);
            }

            // Agregar órdenes canceladas del día (order.status=cancelled).
            // ML no las devuelve en los filtros de arriba (&order.status=paid).
            // Son las "entregadas pero con orden cancelada" = reclamables.
            {
                const filterCancelled = `&shipping.estimated_delivery_time.from=${deliveryFrom}&shipping.estimated_delivery_time.to=${deliveryTo}&order.status=cancelled`;
                const cancelledOrds = await fetchAllPages(filterCancelled, 1);
                if (cancelledOrds.length > 0) {
                    const existingShipIds = new Set(allOrders.map(o => o.shipping?.id).filter(Boolean));
                    cancelledOrds.forEach(o => {
                        o._orderCancelled = true;
                        if (!existingShipIds.has(o.shipping?.id)) allOrders.push(o);
                    });
                    _diagLog(`[${cuenta.nombre}] +${cancelledOrds.length} órdenes canceladas del día`);
                }
            }

            if (loadGen !== null && loadGeneration !== loadGen) return [];

            // Incluir todas las órdenes con shipping (también canceladas a nivel orden).
            const ordersConShipping = allOrders.filter(o => o.shipping?.id);

            // ── Reusar envíos ENTREGADOS desde caché (no se re-consultan) ──
            const _shipC = _getShipCache();
            const shippingMap = new Map();
            const ordersAFetchear = [];
            ordersConShipping.forEach(o => {
                const cached = _shipC.get(String(o.shipping.id));
                if (cached) shippingMap.set(o.shipping.id, cached);
                else ordersAFetchear.push(o);
            });
            if (shippingMap.size) _diagLog(`[${cuenta.nombre}] ${shippingMap.size} envíos desde caché (entregados) · ${ordersAFetchear.length} a consultar`);

            if (progress) { progress.total += ordersAFetchear.length; if (notify) notify(); }

            // ── BATCH FETCH de shipments ─────────────────────────────────
            // En lugar de N requests individuales, agrupamos en batches de 20
            // y usamos el endpoint /shipments?ids=id1,id2,... (una sola request = 20 shipments)
            // 80 órdenes → 4 requests en lugar de 80. ~20x menos llamadas.
            const BATCH_SIZE = 20;
            const BATCH_CONC = 5; // 5×20=100 envíos en paralelo (más rápido, sin pasar rate limit)

            async function fetchShipmentBatch(ids) {
                const opts = { headers: { 'Authorization': `Bearer ${token}` } };
                let fetchedShipments = [];
                let missingIds = [...ids]; // arrancar asumiendo que todos faltan

                // Intentar batch real primero (?ids=...)
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 10000); // 10s > Worker 8s → Worker devuelve parcial antes de abortar
                    const r = await fetch(`${cuenta.proxy}/api/shipments?ids=${ids.join(',')}`, { ...opts, signal: ctrl.signal });
                    clearTimeout(tid);
                    if (r.ok) {
                        const data = await r.json();
                        if (Array.isArray(data)) {
                            const ok = data.map(d => d.body || d).filter(s => s?.id);
                            if (ok.length > 0) {
                                fetchedShipments = ok;
                                const gotIds = new Set(ok.map(s => String(s.id)));
                                missingIds = ids.filter(id => !gotIds.has(String(id)));
                                if (missingIds.length === 0) return fetchedShipments; // éxito total
                                _diagLog(`⚠️ batch parcial [${cuenta.nombre}]: ${ok.length}/${ids.length} ok → ${missingIds.length} individual`);
                            }
                        }
                    } else {
                        _diagLog(`⚠️ fetchShipmentBatch HTTP ${r.status} [${cuenta.nombre}] → fallback individual`);
                    }
                } catch(e) {
                    _diagLog(`⚠️ fetchShipmentBatch error: ${e.message} [${cuenta.nombre}] → fallback individual`);
                }
                // Fallback: individual solo para los IDs faltantes (con timeout por ítem)
                const results = [...fetchedShipments];
                const CONC = 8;
                let i = 0;
                async function worker() {
                    while (i < missingIds.length) {
                        const id = missingIds[i++];
                        try {
                            const ctrl2 = new AbortController();
                            const tid2 = setTimeout(() => ctrl2.abort(), 8000);
                            const r2 = await fetch(`${cuenta.proxy}/api/shipments/${id}`, { ...opts, signal: ctrl2.signal });
                            clearTimeout(tid2);
                            const s = r2.ok ? await r2.json() : null;
                            if (s?.id) results.push(s);
                        } catch(e) { /* timeout o error → skip */ }
                    }
                }
                await Promise.all(Array.from({ length: CONC }, worker));
                return results;
            }

            // Dividir en batches (solo los que NO están en caché)
            _diagLog(`[${cuenta.nombre}] ${ordersAFetchear.length} shipments a consultar → ${Math.ceil(ordersAFetchear.length/BATCH_SIZE)} batches × ${BATCH_SIZE}, BCONC=${BATCH_CONC}`);
            const batches = [];
            for (let i = 0; i < ordersAFetchear.length; i += BATCH_SIZE) {
                batches.push(ordersAFetchear.slice(i, i + BATCH_SIZE));
            }

            // Procesar batches con concurrencia limitada
            let batchIdx = 0;
            const t0hoy = Date.now();
            async function batchWorker() {
                while (batchIdx < batches.length) {
                    const myIdx = batchIdx;
                    const batch = batches[batchIdx++];
                    const ids = batch.map(o => o.shipping.id);
                    const t0b = Date.now();
                    try {
                        const shipments = await fetchShipmentBatch(ids);
                        shipments.forEach(s => { if (s?.id) shippingMap.set(s.id, s); });
                        _diagLog(`✅ hoy batch ${myIdx+1}/${batches.length} [${cuenta.nombre}] ${shipments.length}/${ids.length} ok · ${Date.now()-t0b}ms`);
                    } catch(e) {
                        _diagLog(`❌ hoy batch ${myIdx+1}/${batches.length} [${cuenta.nombre}] error: ${e.message}`);
                    }
                    if (progress) {
                        progress.done += batch.length;
                        if (notify) notify();
                    }
                }
            }
            await Promise.all(Array.from({ length: BATCH_CONC }, batchWorker));
            // Reintento: recuperar los que quedaron sin envío (timeouts) — sin esto se perdían del conteo
            const _faltantes = ordersAFetchear.filter(o => !shippingMap.get(o.shipping.id)).map(o => o.shipping.id);
            if (_faltantes.length) {
                _diagLog(`[${cuenta.nombre}] retry ${_faltantes.length} envíos faltantes`);
                for (let i = 0; i < _faltantes.length; i += BATCH_SIZE) {
                    try {
                        const sh = await fetchShipmentBatch(_faltantes.slice(i, i + BATCH_SIZE));
                        sh.forEach(s => { if (s?.id) shippingMap.set(s.id, s); });
                    } catch(e) {}
                }
                const _aunFalta = ordersAFetchear.filter(o => !shippingMap.get(o.shipping.id)).length;
                _diagLog(`[${cuenta.nombre}] tras retry: faltan ${_aunFalta}`);
            }
            // Guardar los recién consultados que ya están ENTREGADOS → no se vuelven a pedir
            _addToShipCache([...shippingMap.values()]);
            _diagLog(`[${cuenta.nombre}] hoy fetch total: ${Date.now()-t0hoy}ms · sMap: ${shippingMap.size}`);


            // Construir tempOrders filtrando por fecha y tipo
            const _noShip = ordersConShipping.filter(o => !shippingMap.get(o.shipping.id)).length;
            const _noFlex = ordersConShipping.filter(o => { const s = shippingMap.get(o.shipping.id); return s && s.logistic_type !== 'self_service'; }).length;
            _diagLog(`[${cuenta.nombre}] filtro: ${ordersConShipping.length} órdenes · sin ship:${_noShip} · no-flex:${_noFlex}`);
            const tempOrders2 = [];
            ordersConShipping.forEach(order => {
                const shipping = shippingMap.get(order.shipping.id);
                if (!shipping) return;
                if (shipping.logistic_type !== 'self_service') return;
                // Si vino de filterCancelled (orden cancelada), solo incluir si es reclamación genuina:
                // envío realmente entregado Y fecha estimada coincide con targetDate.
                const esReclamacion = order._orderCancelled &&
                    shipping.status === 'delivered' &&
                    esEntregaParaFecha(shipping, targetDate);
                if (order._orderCancelled && !esReclamacion) return;
                // Cada venta pertenece a su DÍA DE OBLIGACIÓN DE ENTREGA (fecha de
                // compromiso de ML, estable). No importa la estimada que se mueve ni
                // el despacho: si su fecha de obligación es este día, cuenta acá. Punto.
                if (esEntregaParaFecha(shipping, targetDate) || esReclamacion) {
                    if (esReclamacion) shipping._orderCancelled = true;
                    tempOrders2.push({ order, shipping });
                }
            });
            tempOrders = tempOrders2;

            if (loadGen !== null && loadGeneration !== loadGen) return [];

            // Enriquecer datos con tracking detallado (síncrono, datos ya en shipping)
            tempOrders.forEach(({ order, shipping }) => {
                enrichShippingData(null, null, shipping, order.id);
                shipping._state = getOrderState(shipping);
                // Orden cancelada pero envío entregado → se cuenta como entregado normalmente
                shipping._zona = getZonaDetallada(
                    shipping.receiver_address?.neighborhood?.name || '',
                    shipping.receiver_address?.city?.name || '',
                    shipping.receiver_address?.zip_code || ''
                );
                shipping._lejana = esLejana(shipping._zona);
            });

            const uniqueShippings = new Map();
            tempOrders.forEach(({ order, shipping }) => {
                const shippingId = shipping.id;
                if (!uniqueShippings.has(shippingId)) {
                    uniqueShippings.set(shippingId, { orders: [order], shipping });
                } else {
                    uniqueShippings.get(shippingId).orders.push(order);
                }
            });

            return Array.from(uniqueShippings.values());
        }

        // ── Tiempo relativo ──────────────────────────────────────────────────
        function _tiempoRelativo(fechaStr) {
            if (!fechaStr) return '';
            const d = _parseFechaFlexible(fechaStr) || new Date(fechaStr);
            if (isNaN(d)) return fechaStr;
            const diff = Date.now() - d.getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1)  return 'Hace un momento';
            if (mins < 60) return `Hace ${mins} min`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24)  return `Hace ${hrs}h`;
            const dias = Math.floor(hrs / 24);
            if (dias === 1) return 'Ayer';
            if (dias < 7)  return `Hace ${dias} días`;
            return d.toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'2-digit'});
        }

        function _mostrarListaRecibidos(rows) {
            const list = document.getElementById('recibidosList');
            if (!rows.length) { list.innerHTML = '<div style="text-align:center;padding:30px;color:#8b949e;">Sin recibidos aún</div>'; return; }
            const diasN = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            let html = '';
            rows.forEach(row => {
                // Soporta tanto objetos de reclamos como objetos viejos de recibidos
                const recId     = row.id          || '';
                const cuenta    = row.cuenta       || row.cuenta    || '';
                const fechaRaw  = row.fechaRecibido || row.fecha    || row.recibido_en || '';
                const zona      = row.zona         || '';
                const comprador = row.comprador    || '';
                const valor     = row.valor        || 0;
                const tipo      = row.tipo         || '';

                let fechaPrincipal = '', fechaSecundaria = '';
                if (fechaRaw) {
                    try {
                        const d = _fechaSegura(fechaRaw);
                        if (d && !isNaN(d)) {
                            // Fecha absoluta: "Martes 3 de junio"
                            fechaPrincipal = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
                            fechaPrincipal = fechaPrincipal.charAt(0).toUpperCase() + fechaPrincipal.slice(1);
                            const hora = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                            fechaSecundaria = `${hora} · ${_tiempoRelativo(d.toISOString())}`;
                        } else { fechaPrincipal = fechaRaw; }
                    } catch(e) { fechaPrincipal = fechaRaw; }
                }

                const cuentaBadge = cuenta === 'Mikra'
                    ? `<span style="background:#9C27B0;color:white;padding:1px 7px;border-radius:6px;font-size:10px;">Mikra</span>`
                    : cuenta === 'Chaya'
                        ? `<span style="background:#FF6B00;color:white;padding:1px 7px;border-radius:6px;font-size:10px;">Chaya</span>`
                        : '';

                const tipoBadge = tipo === 'driver_devolver'
                    ? `<span style="background:#3b1010;color:#f85149;padding:1px 6px;border-radius:4px;font-size:10px;">⚠️ devolver</span>`
                    : tipo === 'demorado'
                        ? `<span style="background:#2a1f00;color:#e3b341;padding:1px 6px;border-radius:4px;font-size:10px;">⏱️ demorado</span>`
                        : '';

                html += `<div style="background:#21262d;border-radius:10px;padding:10px 14px;margin-bottom:8px;border:1px solid #30363d;">
                    <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;">
                        <span style="color:#00ff88;font-size:16px;flex-shrink:0;">✅</span>
                        <div style="flex:1;min-width:0;">
                            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px;">
                                ${recId ? `<span style="background:#1f3a1f;color:#3fb950;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;font-family:monospace;">${recId}</span>` : ''}
                                ${tipoBadge}
                                ${cuentaBadge}
                                ${valor > 0 ? `<span style="color:#3fb950;font-size:11px;font-weight:700;">$${Math.round(valor).toLocaleString('es-AR')}</span>` : ''}
                            </div>
                            ${zona      ? `<div style="font-size:13px;font-weight:700;color:#e6edf3;">${zona}</div>` : ''}
                            ${comprador ? `<div style="font-size:11px;color:#8b949e;">👤 ${comprador}</div>` : ''}
                        </div>
                    </div>
                    <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px;">
                        <span style="font-size:12px;font-weight:700;color:#FFE600;">${fechaPrincipal}</span>
                        ${fechaSecundaria ? `<span style="font-size:10px;color:#484f58;">${fechaSecundaria}</span>` : ''}

                </div>`;
            });
            list.innerHTML = html;
        }

        function exportarCSV() {
            if (!allFlexOrders || allFlexOrders.length === 0) {
                alert('No hay órdenes cargadas para exportar.');
                return;
            }

            const cols = [
                'orden_id', 'envio_id', 'cuenta', 'estado', 'detalle_estado',
                'shipping_status', 'shipping_substatus',
                'fecha_obligacion', 'fecha_entrega_estimada', 'fecha_despacho', 'fecha_creacion_orden',
                'zona', 'calle', 'numero', 'barrio', 'ciudad', 'provincia', 'cp',
                'link_venta'
            ];

            const rows = allFlexOrders.map(({ order, orders, shipping, cuentaNombre }) => {
                const ord = order || (orders && orders[0]) || {};
                const estado = shipping._state || getOrderState(shipping);
                const detalle = estado === 'reprogramado' ? getReprogramadoDetail(shipping).short : estado;
                const addr = shipping.receiver_address || {};
                const fechaEnt = shipping.shipping_option?.estimated_delivery_time?.date
                              || shipping.shipping_option?.estimated_delivery_final?.date
                              || '';
                const fechaOrd = ord.date_created ? ord.date_created.split('T')[0] : '';
                const dsRaw = shipping.status_history?.date_shipped || '';
                const fechaDesp = dsRaw ? (_fechaSegura(dsRaw) ? `${_fechaSegura(dsRaw).getFullYear()}-${String(_fechaSegura(dsRaw).getMonth()+1).padStart(2,'0')}-${String(_fechaSegura(dsRaw).getDate()).padStart(2,'0')}` : dsRaw.split('T')[0]) : '';
                const orderId = ord.id || '';
                return [
                    orderId,
                    shipping.id || '',
                    cuentaNombre || '',
                    estado,
                    detalle,
                    shipping.status || '',
                    shipping.substatus || '',
                    (_fechaPromesa(shipping) || '').split('T')[0],
                    fechaEnt ? fechaEnt.split('T')[0] : '',
                    fechaDesp,
                    fechaOrd,
                    shipping._zona || '',
                    addr.street_name || '',
                    addr.street_number || '',
                    addr.neighborhood?.name || '',
                    addr.city?.name || '',
                    addr.state?.name || '',
                    addr.zip_code || '',
                    orderId ? `https://www.mercadolibre.com.ar/ventas/${orderId}/detalle` : ''
                ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
            });

            const csv = '﻿' + cols.join(',') + '\n' + rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = currentNavDate
                ? currentNavDate.toISOString().split('T')[0]
                : new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `flex_${fecha}_${allFlexOrders.length}ordenes.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Exportar según la vista actual: en 7 días → 7 días; en el día → ventas del día.
        function exportarInteligente() {
            if (window._vistaActual === 'ne') exportarCSVNoEntregados();
            else exportarCSV();
        }

        // ── Exportar CSV de la vista "últimos 7 días" (sin entregar / a devolver) ──
        function exportarCSVNoEntregados() {
            const items = window._neTodos || [];
            if (!items.length) { alert('No hay paquetes cargados. Abrí "7 días" primero.'); return; }
            const arch = (typeof _getArchivados === 'function') ? _getArchivados() : new Set();
            const hoyX = new Date(); hoyX.setHours(0,0,0,0);
            const cols = ['reclamo_id','estado','tipo','envio_id','orden_id','cuenta','dias_atraso',
                          'fecha_entrega_estimada','fecha_despacho','zona','calle','numero','ciudad','provincia','cp','valor','link_etiqueta','link_venta'];
            const rows = items
                .filter(t => {
                    const e = window._reclamosMap?.get(String(t.shipping.id))?.estado;
                    return e !== 'archivado' && e !== 'entregado' && !arch.has(String(t.shipping.id));
                })
                .map(({ shipping, order, cuentaNombre }) => {
                    const rec  = window._reclamosMap?.get(String(shipping.id));
                    const addr = shipping.receiver_address || {};
                    const fEnt = shipping.shipping_option?.estimated_delivery_time?.date
                              || shipping.shipping_option?.estimated_delivery_final?.date || '';
                    const fDesp = shipping.status_history?.date_shipped || '';
                    let atraso = '';
                    if (fEnt) { const e = new Date(fEnt); e.setHours(0,0,0,0); const d = Math.round((hoyX - e)/86400000); atraso = d > 0 ? d : 0; }
                    const tipo = shipping._canceladaDevolver ? 'a_devolver'
                               : (rec?.estado === 'en_deposito' ? 'en_deposito' : 'sin_entregar');
                    const orderId = order?.id || '';
                    return [
                        rec?.id || '', rec?.estado || 'pendiente', tipo,
                        shipping.id || '', orderId, cuentaNombre || '', atraso,
                        fEnt ? fEnt.split('T')[0] : '', fDesp ? fDesp.split('T')[0] : '',
                        shipping._zonaForce || shipping._zona || '',
                        addr.street_name || '', addr.street_number || '', addr.city?.name || '', addr.state?.name || '', addr.zip_code || '',
                        Math.round(order?.total_amount || 0),
                        `https://etiquetas-proxy.rafaelassir.workers.dev/?id=${shipping.id}&view=1`,
                        orderId ? `https://www.mercadolibre.com.ar/ventas/${orderId}/detalle` : ''
                    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
                });
            if (!rows.length) { alert('No hay paquetes sin resolver para exportar.'); return; }
            const csv = '﻿' + cols.join(',') + '\n' + rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `flex_7dias_${new Date().toISOString().split('T')[0]}_${rows.length}paquetes.csv`;
            a.click();
            URL.revokeObjectURL(url);
            _showNEToast(`⬇️ ${rows.length} paquetes exportados`);
        }

        function getOrderState(shipping) {
            const status = (shipping.status || '').toLowerCase();
            const substatus = (shipping.substatus || '').toLowerCase();
            const history = shipping.status_history || {};
            const tags = shipping.tags || [];
            const tagsLower = tags.map(t => (t || '').toLowerCase());
            
            // Primero: detectar reprogramados (incluye not_delivered con substatus específico)
            if (substatus === 'rescheduled' || substatus === 'rescheduled_by_buyer' ||
                substatus === 'buyer_rescheduled' ||
                substatus === 'delayed' || substatus === 'returning_to_sender' ||
                substatus === 'waiting_for_withdrawal' || substatus === 'receiver_absent' ||
                substatus === 'out_of_delivery_area' || substatus === 'not_delivered_and_returning' ||
                substatus === 'delivery_failed' ||
                tagsLower.includes('rescheduled') || tagsLower.includes('delayed') ||
                tagsLower.includes('return_to_sender')) {
                return 'reprogramado';
            }

            // not_delivered sin substatus de cancelación → reprogramado
            if (status === 'not_delivered' && !substatus.includes('cancel')) {
                return 'reprogramado';
            }
            
            // Cancelados
            if (status === 'cancelled' ||
                substatus === 'cancelled' || substatus === 'buyer_cancelled' || 
                substatus === 'cancelled_by_buyer' || substatus === 'cancelled_manually' ||
                tagsLower.includes('cancelled') ||
                (status === 'not_delivered' && substatus.includes('cancel'))) {
                return 'cancelado';
            }
            
            if (history.date_delivered) {
                return 'entregado';
            }
            
            if (history.date_shipped) {
                return 'en-camino';
            }
            
            // Paquete impreso pero aún no despachado
            if (substatus === 'printed' || substatus === 'ready_for_pickup') {
                return 'impreso';
            }
            
            return 'pendiente';
        }

        function getReprogramadoDetail(shipping) {
            const substatus = (shipping.substatus || '').toLowerCase();
            if (substatus === 'receiver_absent') return { label: '🚫 Comprador ausente', short: 'Comprador ausente' };
            if (substatus === 'buyer_rescheduled' || substatus === 'rescheduled_by_buyer' || substatus === 'rescheduled') return { label: '📅 Reprogramado por comprador', short: 'Reprogram. comprador' };
            if (substatus === 'delayed') return { label: '⏰ Demorado', short: 'Demorado' };
            if (substatus === 'returning_to_sender' || substatus === 'not_delivered_and_returning') return { label: '↩️ Devolviendo al vendedor', short: 'Devolviendo' };
            if (substatus === 'out_of_delivery_area') return { label: '📍 Fuera de zona', short: 'Fuera de zona' };
            if (substatus === 'delivery_failed') return { label: '❌ Entrega fallida', short: 'Entrega fallida' };
            if (substatus === 'waiting_for_withdrawal') return { label: '📦 Esperando retiro', short: 'Esperando retiro' };
            return { label: '🔄 Reprogramado', short: 'Reprogramado' };
        }

        // === TRACKING DETALLADO - Clasifica eventos del historial de ML ===
        function classifyTrackingEvent(event) {
            const label = (event.label || '').toLowerCase();
            const sub = (event.substatus || '').toLowerCase();
            
            if (sub === 'receiver_absent' || label.includes('ausente')) return { icon: 'absent', css: 'highlight-absent' };
            if (sub === 'nearby' || sub === 'almost_there' || label.includes('muy cerca')) return { icon: 'near', css: 'highlight-near' };
            if (sub === 'rescheduled' || label.includes('nuevamente') || label.includes('reintento')) return { icon: 'retry', css: '' };
            if (sub === 'delivered' || label.includes('entregamos')) return { icon: 'delivered', css: '' };
            if (sub === 'in_transit' || sub === 'out_for_delivery' || sub === 'shipped' || label.includes('en camino')) return { icon: 'shipped', css: '' };
            if (sub === 'returning_to_sender' || sub === 'not_delivered_and_returning' || label.includes('devolv')) return { icon: 'absent', css: 'highlight-absent' };
            if (sub === 'delivery_failed' || label.includes('fallid')) return { icon: 'absent', css: 'highlight-absent' };
            return { icon: 'default', css: '' };
        }

        function renderTrackingDetail(shipping) {
            const events = shipping._trackingEvents;
            if (!events || events.length === 0) return '';

            let html = '<div class="tracking-detail">';
            html += '<div style="font-size:11px; color:#888; margin-bottom:6px; font-weight:bold;">📋 HISTORIAL DE RASTREO</div>';
            
            events.forEach(ev => {
                const cls = classifyTrackingEvent(ev);
                html += `<div class="tracking-event ${cls.css}">
                    <div class="track-icon ${cls.icon}"></div>
                    <div class="track-msg">${ev.label}</div>
                </div>`;
            });
            
            html += '</div>';
            return html;
        }

        function renderReputationBadge(shipping) {
            const problems = shipping._problems;
            if (!problems || problems.length === 0) return '';
            
            return problems.map(p => {
                const labelType = p.typeLabel || p.type;
                const timeStr = p.time ? ` · ${p.time} hs` : '';
                if (p.reputationAffected) {
                    return `<span class="reputation-warning">⚠️ Reputación afectada · ${labelType}${timeStr}</span>`;
                } else {
                    return `<span class="reputation-ok">✓ Rep. no afectada · ${labelType}${timeStr}</span>`;
                }
            }).join(' ');
        }

        function enrichShippingData(cuenta, token, shipping, orderId) {
            const subHistory = shipping.substatus_history || [];
            const history = shipping.status_history || {};
            let events = [];

            if (subHistory.length > 0) {
                subHistory.forEach(entry => {
                    const dateStr = entry.date ? formatDateShort(entry.date) : '';
                    const label = SUBSTATUS_LABELS[entry.substatus] || entry.substatus || entry.status || '';
                    if (label) events.push({ label: `${dateStr} | ${label}`, substatus: entry.substatus });
                });
            }

            if (history.date_shipped && !events.some(e => e.substatus === 'in_transit' || e.substatus === 'out_for_delivery')) {
                events.push({ label: `${formatDateShort(history.date_shipped)} | El paquete está en camino.`, substatus: 'shipped' });
            }
            if (history.date_delivered && !events.some(e => e.substatus === 'delivered')) {
                events.push({ label: `${formatDateShort(history.date_delivered)} | Entregamos el paquete.`, substatus: 'delivered' });
            }
            if (history.date_not_delivered) {
                events.push({ label: `${formatDateShort(history.date_not_delivered)} | No se pudo entregar.`, substatus: 'not_delivered' });
            }

            const seen = new Set();
            events = events.filter(e => { if (seen.has(e.label)) return false; seen.add(e.label); return true; });
            if (events.length > 0) shipping._trackingEvents = events;

            const problemSubstatuses = new Set(['delayed', 'delivery_failed', 'receiver_absent', 'lost', 'stolen', 'damaged']);
            if (shipping.status === 'not_delivered' || problemSubstatuses.has(shipping.substatus)) {
                const probSub = shipping.substatus || shipping.status;
                const probEntry = subHistory.find(e => e.substatus === probSub);
                const probTime = probEntry?.date ? formatearSoloHora(probEntry.date) : null;
                shipping._problems = [{
                    type: probSub,
                    typeLabel: PROBLEMA_TRANSLATIONS[probSub] || probSub,
                    reputationAffected: false,
                    time: probTime
                }];
            }
        }

        function aplicarFiltros() {
            let filtered = allFlexOrders;

            if (currentCuentaFilter !== 'all') {
                filtered = filtered.filter(({ cuentaNombre }) => cuentaNombre === currentCuentaFilter);
            }

            // Usar _state cacheado en lugar de recalcular
            if (currentStateFilter === 'cancelado') {
                filtered = filtered.filter(({ shipping }) => shipping._state === 'cancelado');
            } else if (currentStateFilter === 'all') {
                filtered = filtered.filter(({ shipping }) => shipping._state !== 'cancelado');
            } else {
                filtered = filtered.filter(({ shipping }) => shipping._state === currentStateFilter);
            }

            // Usar _zona cacheada
            if (currentZoneFilter !== 'all') {
                filtered = filtered.filter(({ shipping }) => {
                    if (currentZoneFilter === 'CABA')        return esCABA(shipping._zona);
                    if (currentZoneFilter === '__PROV__')    return !esCABA(shipping._zona);
                    if (currentZoneFilter === '__LEJANAS__') return shipping._lejana === true;
                    if (currentZoneFilter === 'CABA') return esCABA(shipping._zona);
                    return shipping._zona === currentZoneFilter;
                });
            }

            // Sorts con Schwartzian transform: extraer la clave UNA vez por elemento,
            // no dentro del comparador (que se ejecuta O(n log n) veces).
            if (currentSort === 'zona') {
                filtered = filtered
                    .map(item => ({ item, key: item.shipping._zona }))
                    .sort((a, b) => a.key.localeCompare(b.key))
                    .map(({ item }) => item);
            } else if (currentSort === 'fecha-entrega') {
                filtered = filtered
                    .map(item => ({ item, key: item.shipping.shipping_option?.estimated_delivery_time?.date || item.shipping.shipping_option?.estimated_delivery_final?.date || '' }))
                    .sort((a, b) => a.key.localeCompare(b.key))
                    .map(({ item }) => item);
            } else if (currentSort === 'hora-entrega') {
                filtered = filtered
                    .map(item => {
                        const h = item.shipping.status_history?.date_delivered || item.shipping.status_history?.date_shipped || item.shipping.date_created || '';
                        return { item, key: h ? new Date(h).getTime() : 0 };
                    })
                    .sort((a, b) => b.key - a.key)
                    .map(({ item }) => item);
            } else if (currentSort === 'estado') {
                const ord = { 'cancelado': 0, 'reprogramado': 1, 'pendiente': 2, 'impreso': 3, 'en-camino': 4, 'entregado': 5 };
                filtered = filtered
                    .map(item => ({ item, key: ord[item.shipping._state] ?? 99 }))
                    .sort((a, b) => a.key - b.key)
                    .map(({ item }) => item);
            } else if (currentSort === 'recientes') {
                filtered = filtered
                    .map(item => ({ item, key: item.shipping.date_created || '' }))
                    .sort((a, b) => b.key.localeCompare(a.key))
                    .map(({ item }) => item);
            }

            displayOrders(currentStateFilter, filtered);
        }

        function displayOrders(filterType, customFiltered = null) {
            const orders = customFiltered || allFlexOrders;

            let ordersForStats = allFlexOrders;
            if (currentCuentaFilter !== 'all') {
                ordersForStats = ordersForStats.filter(({ cuentaNombre }) => cuentaNombre === currentCuentaFilter);
            }

            // Stats en una sola pasada con reduce (antes eran 5 filter separados)
            const stats = ordersForStats.reduce((acc, { shipping, cuentaNombre }) => {
                const s = shipping._state;
                if (s === 'pendiente')      acc.pendiente++;
                else if (s === 'impreso')      acc.impreso++;
                else if (s === 'en-camino')    acc.enCamino++;
                else if (s === 'entregado')    acc.entregado++;
                else if (s === 'cancelado')    acc.cancelado++;
                else if (s === 'reprogramado') acc.reprogramado++;
                return acc;
            }, { pendiente: 0, impreso: 0, enCamino: 0, entregado: 0, cancelado: 0, reprogramado: 0 });
            stats.total = stats.pendiente + stats.impreso + stats.enCamino + stats.entregado + stats.reprogramado;

            // Contadores por cuenta en una pasada
            const cuentaStats = allFlexOrders.reduce((acc, { cuentaNombre, shipping }) => {
                if (shipping._state === 'cancelado') return acc;
                acc.total++;
                if (cuentaNombre === 'Mikra') acc.mikra++;

        // Cache de markers — se construye una vez por carga y solo se filtra al togglear
        let mapMarkersCache = null;
        let mapMarkersCacheKey = null;

        function buildMapMarkersCache() {
            // Hash simple de los datos para detectar cambios
            const key = allFlexOrders.map(o => o.shipping.id + ':' + o.shipping._state).join(',');
            if (mapMarkersCacheKey === key && mapMarkersCache) return; // sin cambios

            mapMarkersCache = [];
            allFlexOrders.forEach(({ shipping, orders: orderList, cuentaNombre, cuentaColor }) => {
                const lat = shipping.receiver_address?.latitude;
                const lng = shipping.receiver_address?.longitude;
                if (!lat || !lng) return;
                if (shipping._state === 'cancelado') return;

                const state = shipping._state;
                const zona  = shipping._zona;

                // Color/emoji según estado
                let markerColor = '#9C27B0', estadoEmoji = '⏳', estadoTexto = 'Pendiente';
                if (state === 'impreso')        { markerColor = '#1E88E5'; estadoEmoji = '🖨️'; estadoTexto = 'Impreso'; }
                else if (state === 'en-camino') { markerColor = '#00d9ff'; estadoEmoji = '🚚'; estadoTexto = 'En camino'; }
                else if (state === 'entregado') { markerColor = '#00ff88'; estadoEmoji = '✅'; estadoTexto = 'Entregado'; }
                else if (state === 'reprogramado') { markerColor = '#FF9800'; estadoEmoji = '🔄'; estadoTexto = getReprogramadoDetail(shipping).short; }

                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background:${markerColor}; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; border:3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">${estadoEmoji}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                const marker = L.marker([lat, lng], { icon: customIcon });

                // Popup lazy — se construye recién al click (mucho más rápido para 250+ markers)
                marker.on('click', function() {
                    if (this._popupBuilt) return;
                    this._popupBuilt = true;
                    const calle  = shipping.receiver_address?.street_name || '';
                    const numero = shipping.receiver_address?.street_number || '';
                    const ciudad = shipping.receiver_address?.city?.name || '';

                    else if (cuentaNombre === 'Chaya') cuentaBadgeHtml = '<span style="background:#FF6B00; color:white; padding:3px 8px; border-radius:10px; font-size:10px; margin-left:5px;">🟠 Chaya</span>';
                    const txtColor = (state === 'en-camino' || state === 'entregado' || state === 'reprogramado') ? '#000' : '#fff';
                    this.bindPopup(`
                        <div style="min-width:200px;">
                            <div style="margin-bottom:8px;">
                                <span style="background:${markerColor}; color:${txtColor}; padding:4px 8px; border-radius:8px; font-size:11px; font-weight:bold;">${estadoEmoji} ${estadoTexto}</span>
                                ${cuentaBadgeHtml}
                            </div>
                            <div style="margin-bottom:6px;"><strong>📍 ${zona}</strong></div>
                            <div style="margin-bottom:6px;">👤 ${comprador}</div>
                            <div style="margin-bottom:8px; font-size:12px; color:#8b949e;">
                                <a href="${orderUrl}" target="_blank" style="color:#58a6ff; text-decoration:none;">#${orderId}</a>
                            </div>
                            <a href="${googleMapsUrl}" target="_blank" style="color:#58a6ff; text-decoration:none; font-size:13px; display:block; margin-top:8px; padding:8px; background:#0d1117; border-radius:8px; text-align:center; border:1px solid #21262d;">
                                🗺️ Abrir en Google Maps<br>
                                <small style="color:#484f58;">${direccionCompleta}</small>
                            </a>
                        </div>
                    `).openPopup();
                });

                mapMarkersCache.push({ marker, state, zona, lejana: shipping._lejana, cuentaNombre, latlng: [lat, lng] });
            });
            mapMarkersCacheKey = key;
        }

        function actualizarMapa() {
            if (!leafletMap || !markersLayer) return;

            buildMapMarkersCache();
            markersLayer.clearLayers();

            const bounds = [];
            mapMarkersCache.forEach(({ marker, state, zona, lejana, cuentaNombre, latlng }) => {
                if (mapStateFilter !== 'all' && state !== mapStateFilter) return;
                if (currentCuentaFilter !== 'all' && cuentaNombre !== currentCuentaFilter) return;
                if (currentZoneFilter !== 'all') {
                    if (currentZoneFilter === 'CABA')        { if (!esCABA(zona)) return; }
                    else if (currentZoneFilter === '__PROV__')    { if (esCABA(zona)) return; }
                    else if (currentZoneFilter === '__LEJANAS__') { if (!lejana) return; }
                    else { if (zona !== currentZoneFilter) return; }
                }
                marker.addTo(markersLayer);
                bounds.push(latlng);
            });

            if (bounds.length > 0) {
                leafletMap.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // ── Auto-refresh ─────────────────────────────────────────────────

        function forzarRecarga() {

            // Limpiar también el cache del día de hoy por si acaso
            const hoy = new Date(); hoy.setHours(0,0,0,0);

        }

        // ── Pull-to-refresh (mobile) ──────────────────────────────────────
        // Swipe hacia abajo desde el tope → recarga datos
        // (skipea cuando hay un modal abierto, swipe horizontal, o está cargando)
        (() => {
            let startY = 0, startX = 0;
            let pulling = false;
            const THRESHOLD = 80; // px mínimos para disparar el refresh

            function isAnyModalOpen() {
                return document.getElementById('mapModal')?.classList.contains('active') ||
                       document.querySelector('.dropdown-menu.show, .modal.show, [data-modal-open="true"]');
            }

            document.addEventListener('touchstart', e => {
                if (isAnyModalOpen()) { pulling = false; return; }
                if (window.scrollY === 0) {
                    startY = e.touches[0].clientY;
                    startX = e.touches[0].clientX;
                    pulling = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', e => {
                if (!pulling) return;
                if (isAnyModalOpen()) { pulling = false; return; }
                const endY = e.changedTouches[0].clientY;
                const endX = e.changedTouches[0].clientX;
                const dy = endY - startY;
                const dx = Math.abs(endX - startX);
                // Solo dispara si el swipe vertical fue claro (vertical >> horizontal)
                if (dy > THRESHOLD && dy > dx * 2) {
                    cargarFlexHoy();
                }
                pulling = false;
            }, { passive: true });
        })();


        // ═══════════════════════════════════════════════
        //  Navegación de días
        // ═══════════════════════════════════════════════
        // Fecha actualmente cargada (Date, medianoche)
        let currentNavDate = null;

        function buildDateNav() {
            const hoy = new Date(); hoy.setHours(0,0,0,0);
            const esFinDeSemana = hoy.getDay() === 0 || hoy.getDay() === 6;
            const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            const container = document.getElementById('dateNavDays');
            if (!container) return;
            container.innerHTML = '';

            // Slots: hasta 3 días hábiles pasados + HOY (si es hábil) + mañana hábil
            const slots = [];

            // Días hábiles pasados (hasta 3, salteando finde)
            let d = new Date(hoy);
            let back = 0;
            while (back < 3) {
                d = new Date(d); d.setDate(d.getDate() - 1);
                if (d.getDay() !== 0 && d.getDay() !== 6) {
                    slots.unshift(new Date(d));
                    back++;
                }
            }

            // HOY: solo agregar si es día hábil
            if (!esFinDeSemana) {
                slots.push(new Date(hoy));
            }

            // Mañana hábil (1 solo)
            let manana = new Date(hoy);
            do { manana.setDate(manana.getDate() + 1); } while (manana.getDay() === 0 || manana.getDay() === 6);
            slots.push(manana);

            slots.forEach(fecha => {
                const btn = document.createElement('button');
                btn.className = 'date-nav-day';
                const isHoy = !esFinDeSemana && fecha.toDateString() === hoy.toDateString();
                const isActive = currentNavDate && fecha.toDateString() === currentNavDate.toDateString();
                if (isActive) btn.classList.add('active');

                const nombre = isHoy ? 'HOY' : dias[fecha.getDay()];
                const numDia = `${fecha.getDate()}/${fecha.getMonth()+1}`;
                btn.innerHTML = `<span class="day-name">${nombre}</span><span class="day-date">${numDia}</span>`;
                btn.onclick = () => cargarDia(fecha);
                container.appendChild(btn);
            });
        }

        async function cargarDia(fecha) {
            currentNavDate = new Date(fecha); currentNavDate.setHours(0,0,0,0);
            buildDateNav();
            // Iniciar comparación GAS inmediatamente (en paralelo con todo lo demás)
            const fechaStr = fecha.toISOString().split('T')[0];
            _pendingComparacion = new Promise(resolve => {
                const cbName = 'preComp_' + Date.now();
                const script = document.createElement('script');
                window[cbName] = (data) => { delete window[cbName]; script.remove(); resolve(data); };
                script.onerror = () => { delete window[cbName]; script.remove(); resolve(null); };
                script.src = `${GAS_TRACKER}?fecha=${fechaStr}&callback=${cbName}`;
                setTimeout(() => { if (window[cbName]) { delete window[cbName]; script.remove(); resolve(null); } }, 8000);
                document.head.appendChild(script);
            });
            const myGen = ++loadGeneration;
            currentStateFilter = 'all'; currentZoneFilter = 'all';
            currentCuentaFilter = 'all'; mostrarCanceladas = false;

            const hoy = new Date(); hoy.setHours(0,0,0,0);
            const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const esHoy = fecha.toDateString() === hoy.toDateString();
            const label = esHoy ? 'HOY' : `${dias[fecha.getDay()]} ${fecha.getDate()}/${fecha.getMonth()+1}`;

            // ── Cache hit: mostrar al instante y refrescar en background ──
            const cached = loadFromCache(currentNavDate);
            if (cached && cached.length > 0) {
                allFlexOrders = cached;
                renderCargaCompletada(label, fecha);
                // Badge de actualización en background
                const badge = document.createElement('div');
                badge.id = 'bgRefreshBadge';
                badge.style.cssText = 'position:fixed;bottom:16px;right:16px;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:20px;padding:6px 14px;font-size:11px;z-index:9999;';
                badge.textContent = '🔄 Actualizando en segundo plano...';
                document.body.appendChild(badge);

                cargarFlexPorFecha(fecha, label, false, myGen, true).then(freshOrders => {
                    const bg = document.getElementById('bgRefreshBadge');
                    if (bg) bg.remove();
                    if (!freshOrders || loadGeneration !== myGen) return;
                    // Solo re-renderizar si hubo cambios
                    const changed = JSON.stringify(freshOrders.map(o => o.shipping.id + o.shipping._state))
                                 !== JSON.stringify(allFlexOrders.map(o => o.shipping.id + o.shipping._state));
                    if (changed) {
                        allFlexOrders = freshOrders;
                        renderCargaCompletada(label, fecha);
                        const toastEl = document.createElement('div');
                        toastEl.style.cssText = 'position:fixed;bottom:16px;right:16px;background:#00897B;color:white;border-radius:20px;padding:6px 14px;font-size:11px;z-index:9999;';
                        toastEl.textContent = '✓ Datos actualizados';
                        document.body.appendChild(toastEl);
                        setTimeout(() => toastEl.remove(), 2500);
                    }
                }).catch(() => { const b = document.getElementById('bgRefreshBadge'); if (b) b.remove(); });
                return;
            }

            // Sin cache: carga normal
            allFlexOrders = [];
            await cargarFlexPorFecha(fecha, label, false, myGen);
        }

        // Extrae el render final de cargarFlexPorFecha para poder llamarlo desde cache
        // ── Guardar envíos del día en Google Sheet (fire & forget) ──
        function guardarEnviosDia(fecha, orders) {
            const ESTADOS_A_GUARDAR = new Set(['en-camino','reprogramado']);
            const fechaStr = fecha.toISOString().split('T')[0];

            // Agrupar por cuenta, solo estados que ya salieron del depósito
            const porCuenta = {};
            orders.forEach(({orders: ol, shipping, cuentaNombre}) => {
                if (!ESTADOS_A_GUARDAR.has(shipping._state)) return;
                if (!porCuenta[cuentaNombre]) porCuenta[cuentaNombre] = [];
                porCuenta[cuentaNombre].push({
                    id:           String(shipping.id),
                    order_id:     String(ol[0]?.id || ''),
                    zona:         shipping._zona || '',
                    destinatario: ol[0]?.buyer?.nickname || '',
                    estado:       shipping._state,
                    calle:        (shipping.receiver_address?.street_name || '') + ' ' + (shipping.receiver_address?.street_number || ''),
                    ciudad:       shipping.receiver_address?.city?.name || '',
                    cp:           shipping.receiver_address?.zip_code || '',
                    fecha_entrega: shipping.shipping_option?.estimated_delivery_time?.date || ''
                });
            });

            Object.entries(porCuenta).forEach(([cuenta, envios]) => {
                if (envios.length === 0) return;
                // Iframe form: funciona sin CORS
                const iframeName = 'gas_' + Date.now() + '_' + cuenta;
                const iframe = document.createElement('iframe');
                iframe.name = iframeName;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = GAS_TRACKER;
                form.target = iframeName;
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'd';
                input.value = JSON.stringify({fecha: fechaStr, cuenta, envios});
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
                setTimeout(() => { form.remove(); iframe.remove(); }, 8000);
            });
        }

        // ── Comparar envíos guardados vs actuales → detecta cancelados ──
        function compararConGuardado(fecha, ordersActuales) {
            const procesar = (data) => {
                if (!data?.cuentas) return;
                const idsActuales = new Set(ordersActuales.map(({shipping}) => String(shipping.id)));
                const cancelados = [];
                Object.entries(data.cuentas).forEach(([cuenta, envios]) => {
                    envios.forEach(e => {
                        if (!idsActuales.has(String(e.id))) {
                            // No mostrar si está archivado (localStorage o reclamos)
                            const sid = String(e.id);
                            const archivadoLocal = _getArchivados().has(sid);
                            const archivadoGAS   = window._reclamosMap?.get(sid)?.estado === 'archivado';
                            if (!archivadoLocal && !archivadoGAS) cancelados.push({...e, cuenta});
                        }
                    });
                });
                if (cancelados.length > 0) mostrarCanceladosADevolver(cancelados);
            };

            // Usar el resultado pre-cargado si está disponible
            if (_pendingComparacion) {
                _pendingComparacion.then(data => { _pendingComparacion = null; procesar(data); });
            }
        }

                            <a href="https://wa.me/?text=${waTexto}" target="_blank" style="background:linear-gradient(135deg,#25D366,#128C7E);color:white;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;">📤 Compartir</a>
                            <button onclick="verEtiqueta('${e.id}', event)" style="background:#1a73e8;color:white;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">🏷️ Ver etiqueta</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            const seccion = document.createElement('div');
            seccion.id = 'seccionADevolver';
            seccion.style.cssText = 'margin-bottom:16px;';
            seccion.innerHTML = `
                <div style="background:linear-gradient(135deg,#2d1515,#1a0d0d);border:2px solid #f85149;border-radius:14px;padding:14px;">
                    <div style="color:#f85149;font-weight:700;font-size:15px;margin-bottom:12px;">
                        ⚠️ ${cancelados.length} paquete${cancelados.length>1?'s':''} — El driver debe devolver
                    </div>
                    ${cards}
                </div>`;
            const content = document.getElementById('content');
            content.insertBefore(seccion, content.firstChild);
        }

        function renderCargaCompletada(label, targetDate, isBackground = false) {
            const zonaCounts = new Map();
            let cabaCount = 0, provinciaCount = 0;
            allFlexOrders.forEach(({ shipping }) => {
                if (shipping._state === 'cancelado') return;
                const zona = shipping._zona;
                zonaCounts.set(zona, (zonaCounts.get(zona) || 0) + 1);
                if (esCABA(zona)) cabaCount++; else provinciaCount++;
            });

            document.getElementById('badgeFecha').textContent = `📅 ${label}`;
            if (currentNavDate) buildDateNav();
            document.getElementById('badgeCaba').textContent = `🏙️ CABA: ${cabaCount}`;
            document.getElementById('badgeProvincia').textContent = `🗺️ Provincia: ${provinciaCount}`;
            document.getElementById('infoBadges').style.display = 'flex';

            const dropdownItems = document.getElementById('dropdownItems');
            const totalSinCanceladas = allFlexOrders.filter(({shipping}) => shipping._state !== 'cancelado').length;
            dropdownItems.innerHTML = `<div class="dropdown-item" onclick="selectZone('all')">Todas las zonas (${totalSinCanceladas})</div>`;
            let cabaTotal = 0;
            Array.from(zonaCounts.entries()).forEach(([zona, count]) => { if (esCABA(zona)) cabaTotal += count; });
            if (cabaTotal > 0) dropdownItems.innerHTML += `<div class="dropdown-item" onclick="selectZone('CABA')">🏙️ CABA - Todos (${cabaTotal})</div>`;
            Array.from(zonaCounts.entries()).sort().forEach(([zona, count]) => {
                dropdownItems.innerHTML += `<div class="dropdown-item" onclick="selectZone('${zona}')">${zona} (${count})</div>`;
            });

            document.getElementById('statsSection').classList.remove('hidden');
            document.getElementById('sortToggleRow').style.display = 'flex';
            document.getElementById('btnMapa').classList.remove('hidden');
            displayOrders('all');

            if (!isBackground) {
                // Guardar en Drive (fire & forget, no bloquea)
                guardarEnviosDia(targetDate, allFlexOrders);
                // Comparar con guardado anterior para detectar cancelados
                compararConGuardado(targetDate, allFlexOrders);
            }

            // Pre-cargar días vecinos en background para clicks instantáneos
            if (currentNavDate) precargarDiasAdyacentes(currentNavDate);
        }

        function navDia(delta) {
            // Si no hay fecha cargada aún, ignorar
            if (!currentNavDate) return;
            const base = new Date(currentNavDate);
            let nueva = new Date(base);
            const step = delta > 0 ? 1 : -1;
            let pasos = Math.abs(delta);
            while (pasos > 0) {
                nueva.setDate(nueva.getDate() + step);
                // Saltar fines de semana
                if (nueva.getDay() !== 0 && nueva.getDay() !== 6) pasos--;
            }
            cargarDia(nueva);
        }

        // ═══════════════════════════════════════════════
        //  Timeline unificado (reemplaza timeline + historial)
        // ═══════════════════════════════════════════════
        function buildUnifiedTimeline(shipping, fechaEntrega) {
            const history = shipping.status_history || {};
            const subHistory = shipping.substatus_history || [];

            let events = [];
            const seen = new Set();

            subHistory.forEach(entry => {
                const sub = entry.substatus || '';
                if (SKIP_SUBSTATUS.has(sub)) return;
                const key = sub + '|' + (entry.date || '');
                if (seen.has(key)) return;
                seen.add(key);
                const meta = SUBSTATUS_MAP[sub] || { t: sub, d: 'c-gray', tc: 't-muted' };
                events.push({ date: entry.date, label: meta.t, dot: meta.d, tc: meta.tc });
            });

            if (history.date_shipped && !events.some(e => e.label.includes('camino'))) {
                events.push({ date: history.date_shipped, label: '🚚 En camino', dot: 'c-blue', tc: 't-blue' });
            }
            if (history.date_delivered && !events.some(e => e.dot === 'c-green')) {
                events.push({ date: history.date_delivered, label: '✅ Entregado', dot: 'c-green', tc: 't-green' });
            }

            events.sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);

            if (events.length === 0 && shipping.date_created) {
                events.push({ date: shipping.date_created, label: '📦 Recibida', dot: 'c-gray', tc: 't-muted' });
            }

            const finalState = shipping._state || getOrderState(shipping);
            const needsPending = finalState === 'pendiente' || finalState === 'en-camino';

            const parts = [];
            events.forEach(ev => {
                const hora = ev.date ? formatearSoloHora(ev.date, fechaEntrega) : null;
                parts.push(`<div class="utl-item"><div class="utl-dot ${ev.dot}"></div><span class="utl-time ${ev.tc}">${hora || ''}</span><span class="utl-label">${ev.label}</span></div>`);
            });

            if (needsPending) {
                parts.push(`<div class="utl-item"><div class="utl-dot c-pending"></div><span class="utl-time t-muted"></span><span class="utl-label" style="color:#484f58;">Entrega pendiente</span></div>`);
            }

            return parts.join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildDateNav();
            actualizarLabelDiaAnterior();
            const hoy = new Date(); hoy.setHours(0,0,0,0);
            currentNavDate = hoy;
            buildDateNav();
            // Pre-calentar tokens de ambas cuentas en paralelo antes del primer fetch de datos
            Promise.all(CUENTAS.map(c => obtenerTokenCuenta(c)));
            // Sincronizar recibidos pendientes que no se pudieron guardar antes
            _procesarColaRecibidos().catch(() => {});
            cargarFlexHoy();
        });

        // Pre-carga especulativa: tras renderizar un día, cargar en background
        // los días laboral anterior y siguiente para que el nav sea instantáneo
        function precargarDiasAdyacentes(fechaBase) {
            const adyacentes = [];
            // día anterior hábil
            let prev = new Date(fechaBase);
            do { prev.setDate(prev.getDate() - 1); } while (prev.getDay() === 0 || prev.getDay() === 6);
            // día siguiente hábil
            let next = new Date(fechaBase);
            do { next.setDate(next.getDate() + 1); } while (next.getDay() === 0 || next.getDay() === 6);

            [prev, next].forEach(fecha => {
                fecha.setHours(0,0,0,0);
                if (!loadFromCache(fecha)) {
                    // Cargar en background sin tocar el DOM
                    setTimeout(() => {
                        cargarFlexPorFecha(fecha, '', true, null, true).catch(() => {});
                    }, 30000); // esperar 30s para no competir con ML rate-limit del load principal
                }
            });
        }
    </script>
