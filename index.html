<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envíos FLEX - Mikra + Chaya</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Envíos Flex">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- jsQR — lector de QR via cámara -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            padding: 8px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #FFE600;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        .info-badges {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .info-badge {
            background: #161b22;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            border: 1.5px solid #30363d;
            backdrop-filter: blur(8px);
        }

        .info-badge.fecha {
            background: linear-gradient(135deg, #FF6B00, #e85d04);
            border-color: transparent;
        }

        .info-badge.caba {
            background: linear-gradient(135deg, #9C27B0, #7b1fa2);
            border-color: transparent;
        }

        .info-badge.provincia {
            background: linear-gradient(135deg, #00897B, #00695c);
            border-color: transparent;
        }

        .top-buttons {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tools-panel {
            display: none;
            animation: slideDown 0.25s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tools-panel.open {
            display: block;
        }

        /* ── PIN modal ── */
        @keyframes pinShake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-6px); }
            80%      { transform: translateX(6px); }
        }
        .pin-key {
            background: #21262d;
            border: 1.5px solid #30363d;
            color: #e6edf3;
            font-size: 22px;
            font-weight: 700;
            border-radius: 12px;
            width: 72px;
            height: 56px;
            cursor: pointer;
            touch-action: manipulation;
            transition: background .12s;
            font-family: inherit;
        }
        .pin-key:active { background: #3d444d; }

        /* ── NE drawer ── */
        #neMasDrawer {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #161b22;
            border-radius: 20px 20px 0 0;
            padding: 8px 16px 28px;
            z-index: 5000;
            border-top: 1px solid #30363d;
            animation: slideUp .22s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        #neMasOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 4999;
        }
        .ne-drawer-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: #e6edf3;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
            margin-bottom: 8px;
            text-align: left;
        }
        .ne-drawer-btn:active { background: #2d333b; }

        button {
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
            touch-action: manipulation;
            min-height: 44px;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        button.btn-warning {
            background: linear-gradient(135deg, #FF9800, #e68900);
        }

        .filter-section {
            background: #161b22;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 1px solid #21262d;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-row label {
            color: #FFE600;
            font-weight: 700;
            font-size: 13px;
        }

        .search-select-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input-select {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: #0d1117;
            border: 1.5px solid #30363d;
            border-radius: 10px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }

        .search-input-select:focus {
            outline: none;
            border-color: #FFE600;
            box-shadow: 0 0 0 3px rgba(255, 230, 0, 0.15);
        }

        .dropdown-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #484f58;
            pointer-events: none;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #161b22;
            border: 1.5px solid #FFE600;
            border-radius: 12px;
            margin-top: 5px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .dropdown-menu.active {
            display: block;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-search {
            position: sticky;
            top: 0;
            background: #161b22;
            padding: 10px;
            border-bottom: 1px solid #21262d;
        }

        .dropdown-search input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1.5px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
            min-height: 44px;
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .dropdown-item:hover, .dropdown-item:active {
            background: #21262d;
        }

        .dropdown-item.selected {
            background: #3483FA;
        }

        .stats-bar {
            background: #161b22;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #21262d;
            overflow: visible;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .stat-item {
            text-align: center;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-item:hover {
            background: #21262d;
        }

        .stat-item:active {
            transform: scale(0.95);
        }

        .stat-item.active {
            background: linear-gradient(135deg, #3483FA, #2563eb);
            border-color: rgba(52, 131, 250, 0.4);
            box-shadow: 0 4px 12px rgba(52, 131, 250, 0.2);
        }

        /* Filtro rápido por cuenta */
        .cuenta-filter {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .cuenta-btn {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            background: #21262d;
            border: 2px solid transparent;
            color: #8b949e;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 40px;
            touch-action: manipulation;
        }

        .cuenta-btn:hover { filter: brightness(1.1); }
        .cuenta-btn:active { transform: scale(0.95); }

        .cuenta-btn.all.active {
            border-color: #FFE600;
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
        }

        .cuenta-btn.mikra-btn.active {
            background: linear-gradient(135deg, #9C27B0, #7b1fa2);
            border-color: #ce93d8;
            color: white;
        }

        .cuenta-btn.chaya-btn.active {
            background: linear-gradient(135deg, #FF6B00, #e85d04);
            border-color: #ffab40;
            color: white;
        }

        .cuenta-separator {
            color: #30363d;
            font-size: 20px;
            user-select: none;
        }

        .cuenta-btn.canceladas-toggle {
            background: #1c1215;
            border: 2px solid #3d1a1a;
            color: #f85149;
        }

        .cuenta-btn.canceladas-toggle:hover {
            border-color: #f85149;
        }

        .cuenta-btn.canceladas-toggle.active {
            background: #f85149;
            border-color: #ff7b72;
            color: white;
            box-shadow: 0 4px 12px rgba(248, 81, 73, 0.3);
        }

        .cuenta-btn.canceladas-toggle span {
            background: #f85149;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 4px;
        }

        .cuenta-btn.canceladas-toggle.active span {
            background: rgba(255,255,255,0.25);
        }

        .cuenta-count {
            background: rgba(255,255,255,0.15);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 4px;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 3px;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 10px;
            color: #8b949e;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .progress-bar-container {
            background: #0d1117;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            display: flex;
            position: relative;
        }

        .progress-segment {
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .progress-segment:active {
            opacity: 0.7;
        }

        .progress-segment.pendiente { background: linear-gradient(90deg, #9C27B0, #8e24aa); }
        .progress-segment.impreso { background: linear-gradient(90deg, #1565C0, #1E88E5); }
        .progress-segment.en-camino { background: linear-gradient(90deg, #00d9ff, #00b8d4); color: #000; }
        .progress-segment.entregado { background: linear-gradient(90deg, #00ff88, #00e676); color: #000; }
        .progress-segment.cancelado { background: linear-gradient(90deg, #f85149, #da3633); }

        .progress-segment.reprogramado { background: linear-gradient(90deg, #FF9800, #f57c00); color: #000; }

        .sort-controls {
            background: #0d1117;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            border: 1px solid #21262d;
        }

        .sort-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-family: inherit;
            background: #21262d;
            border-radius: 10px;
            min-height: 38px;
        }

        .sort-btn.active {
            background: #FFE600;
            color: #000;
            font-weight: 700;
        }

        .envio-card {
            background: #161b22;
            border-left: 4px solid;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            border: 1px solid #21262d;
            border-left-width: 4px;
        }

        .envio-card:hover {
            background: #1c2128;
        }

        .envio-card.pendiente { border-left-color: #9C27B0; }
        .envio-card.impreso { border-left-color: #1E88E5; }
        .envio-card.en-camino { border-left-color: #00d9ff; }
        .envio-card.entregado { border-left-color: #00ff88; }
        .envio-card.cancelado { border-left-color: #f85149; opacity: 0.7; }

        .envio-card.reprogramado { border-left-color: #FF9800; }

        .envio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .estado-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        .estado-badge.pendiente { background: linear-gradient(135deg, #9C27B0, #7b1fa2); }
        .estado-badge.impreso { background: linear-gradient(135deg, #1E88E5, #1565C0); }
        .estado-badge.en-camino { background: linear-gradient(135deg, #00d9ff, #00b8d4); color: #000; }
        .estado-badge.entregado { background: linear-gradient(135deg, #00ff88, #00e676); color: #000; }
        .estado-badge.cancelado { background: linear-gradient(135deg, #f85149, #da3633); }

        .estado-badge.reprogramado { background: linear-gradient(135deg, #FF9800, #f57c00); color: #000; }

        .envio-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .info-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .info-label {
            color: #8b949e;
            font-size: 10px;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #e6edf3;
            font-size: 13px;
            font-weight: 500;
        }

        .zona-highlight {
            font-size: 14px;
            font-weight: 700;
            color: #FFE600;
        }

        .direccion-link, .order-link {
            color: #58a6ff;
            text-decoration: none;
            transition: all 0.2s;
        }

        .direccion-link:hover, .order-link:hover {
            color: #FFE600;
        }

        .timeline {
            background: #0d1117;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #21262d;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            position: relative;
        }

        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 25px;
            width: 2px;
            height: calc(100% - 8px);
            background: #21262d;
        }

        .timeline-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            z-index: 1;
            transition: all 0.3s;
        }

        .timeline-dot.done {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .timeline-dot.pending {
            background: #21262d;
            border: 2px solid #30363d;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-label {
            color: #8b949e;
            font-size: 12px;
        }

        .timeline-time {
            color: #00ff88;
            font-weight: 700;
            font-size: 13px;
        }

        .timeline-time.pending {
            color: #484f58;
        }

        /* TRACKING DETALLADO */
        .tracking-detail {
            background: #0d1117;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
            border-left: 3px solid #58a6ff;
            border: 1px solid #21262d;
            border-left: 3px solid #58a6ff;
        }

        .tracking-event {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 4px 0;
            font-size: 12px;
            color: #8b949e;
        }

        .tracking-event .track-icon {
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 4px;
        }

        .tracking-event .track-icon.shipped { background: #00d9ff; box-shadow: 0 0 6px rgba(0,217,255,0.3); }
        .tracking-event .track-icon.near { background: #FFE600; box-shadow: 0 0 6px rgba(255,230,0,0.3); }
        .tracking-event .track-icon.absent { background: #f85149; box-shadow: 0 0 6px rgba(248,81,73,0.3); }
        .tracking-event .track-icon.retry { background: #FF9800; box-shadow: 0 0 6px rgba(255,152,0,0.3); }
        .tracking-event .track-icon.delivered { background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.3); }
        .tracking-event .track-icon.default { background: #484f58; }

        .tracking-event .track-time {
            color: #484f58;
            font-size: 11px;
            min-width: 40px;
        }

        .tracking-event .track-msg {
            flex: 1;
        }

        .tracking-event.highlight-absent {
            color: #f85149;
            font-weight: 700;
        }

        .tracking-event.highlight-near {
            color: #FFE600;
        }

        .driver-info {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #0d2137;
            color: #58a6ff;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .reputation-warning {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f85149;
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            animation: pulse-rep 2s infinite;
        }

        @keyframes pulse-rep {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .reputation-ok {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #0d2d15;
            color: #56d364;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            font-size: 15px;
            color: #FFE600;
            font-weight: 500;
        }

        .loading-spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #21262d;
            border-top-color: #FFE600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Barra de progreso de carga */
        .load-progress-wrap {
            margin: 16px auto 0;
            max-width: 320px;
        }
        .load-progress-track {
            background: #21262d;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            margin-bottom: 6px;
            position: relative;
        }
        .load-progress-fill {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #FFE600, #ff9800);
            transition: width 0.2s ease-out;
            width: 0%;
        }
        .load-progress-pct {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
            color: #e6edf3;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            white-space: nowrap;
        }
        .load-progress-text {
            font-size: 11px;
            color: #484f58;
            font-weight: 400;
        }

        .error {
            background: linear-gradient(135deg, #f85149, #da3633);
            color: white;
            padding: 20px;
            border-radius: 14px;
            margin: 15px 0;
            text-align: center;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #484f58;
            font-size: 15px;
        }

        .fecha-hoy {
            color: #ff6b00;
            font-weight: 700;
        }

        .items-count {
            background: #FFE600;
            color: #000;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
        }

        .cuenta-badge {
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 6px;
        }

        .cuenta-badge.mikra {
            background: linear-gradient(135deg, #9C27B0, #7b1fa2);
        }

        .cuenta-badge.chaya {
            background: linear-gradient(135deg, #FF6B00, #e85d04);
        }

        /* VISTA SIMPLE */
        .envio-card-simple {
            background: #161b22;
            border-left: 4px solid;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid #21262d;
            border-left-width: 4px;
        }

        .envio-card-simple:active {
            transform: scale(0.99);
            background: #1c2128;
        }

        .envio-card-simple.pendiente { border-left-color: #9C27B0; }
        .envio-card-simple.impreso { border-left-color: #1E88E5; }
        .envio-card-simple.en-camino { border-left-color: #00d9ff; }
        .envio-card-simple.entregado { border-left-color: #00ff88; }
        .envio-card-simple.cancelado { border-left-color: #f85149; opacity: 0.7; }

        .envio-card-simple.reprogramado { border-left-color: #FF9800; }

        .simple-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .simple-zona {
            flex: 1;
            font-size: 15px;
            font-weight: 700;
            color: #FFE600;
            letter-spacing: -0.3px;
        }

        /* ── NE mini-cards (colapsables — paquetes sin entregar normales) ─── */
        .ne-mini-card {
            background: #161b22;
            border-left: 3px solid #484f58;
            border-radius: 10px;
            margin-bottom: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.15s;
        }
        .ne-mini-card:active { background: #1c2128; }
        .ne-mini-cancelada { border-left-color: #f85149 !important; background: #160f0f; }
        .ne-mini-deposito  { border-left-color: #ffa040 !important; background: #130e00; }
        /* Cabecera: zona grande en su propia línea */
        .ne-mini-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px 4px;
            min-height: 30px;
        }
        .ne-mini-ic {
            font-size: 16px;
            flex-shrink: 0;
            line-height: 1;
        }
        .ne-mini-zona {
            flex: 1;
            font-size: 15px;
            font-weight: 800;
            color: #e6edf3;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ne-mini-chev {
            color: #6e7681;
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.2s;
            line-height: 1;
        }
        /* Sub-línea: #ID · valor · fecha (datos secundarios) */
        .ne-mini-sub {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            padding: 0 12px 10px 33px;
        }
        .ne-mini-acc-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            display: inline-block;
        }
        .ne-mini-det {
            padding: 8px 12px 10px;
            border-top: 1px solid #21262d;
        }
        .ne-mini-addr {
            display: block;
            font-size: 13px;
            color: #00b4d8;
            margin: 2px 0 6px;
            text-decoration: none;
        }
        .ne-mini-buy {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ne-mini-btns {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .ne-mini-btns button {
            flex: 1 1 calc(33.33% - 7px);
            min-height: 42px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            font-family: inherit;
            border: 1px solid #30363d;
            cursor: pointer;
            padding: 8px 6px;
            touch-action: manipulation;
        }

        /* ── Tarjetas grandes para A devolver / En depósito ─────────────── */
        .ne-big-card {
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .ne-big-card-devolver {
            background: #1a0808;
            border: 1.5px solid #7b1a1a;
        }
        .ne-big-card-deposito {
            background: #130e00;
            border: 1.5px solid #5a3a00;
        }
        .ne-big-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            gap: 8px;
        }
        .ne-big-hdr-devolver { background: linear-gradient(90deg,#3b0a0a,#1a0808); border-bottom: 1px solid #7b1a1a; }
        .ne-big-hdr-deposito  { background: linear-gradient(90deg,#2a1800,#130e00); border-bottom: 1px solid #5a3a00; }
        .ne-big-zona {
            font-size: 15px;
            font-weight: 800;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .ne-big-zona-devolver { color: #ff6b6b; }
        .ne-big-zona-deposito { color: #ffb347; }
        .ne-big-body {
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .ne-big-addr {
            font-size: 13px;
            color: #00b4d8;
            text-decoration: none;
            display: block;
        }
        .ne-big-meta {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ne-big-val-devolver { color: #ff6b6b; font-size: 16px; font-weight: 800; }
        .ne-big-val-deposito { color: #ffa040; font-size: 16px; font-weight: 800; }
        .ne-big-val-tachado  { text-decoration: line-through; opacity: 0.45; font-size: 14px; }
        .ne-big-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 0 14px 12px;
        }
        .ne-big-btn {
            flex: 1;
            min-width: 80px;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            text-align: center;
            border: none;
            touch-action: manipulation;
        }

        /* ── Cajones por día (SIN ENTREGAR colapsable) ──────────────────── */
        .ne-dia-drawer {
            background: #0f1318;
            border: 1px solid #21262d;
            border-radius: 10px;
            margin-bottom: 6px;
            overflow: hidden;
        }
        .ne-dia-hdr {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: #161b22;
            border: none;
            padding: 11px 12px;
            cursor: pointer;
            font-family: inherit;
            color: #e6edf3;
            touch-action: manipulation;
            min-height: 46px;
        }
        .ne-dia-hdr:active { background: #1c2128; }
        .ne-dia-chev {
            color: #8b949e;
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.2s;
            line-height: 1;
        }
        .ne-dia-label {
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }
        .ne-dia-atraso {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .ne-dia-spacer { flex: 1; }
        .ne-dia-val {
            font-size: 13px;
            font-weight: 800;
            color: #3fb950;
            white-space: nowrap;
        }
        .ne-dia-count {
            background: #21262d;
            color: #8b949e;
            font-size: 12px;
            font-weight: 800;
            min-width: 24px;
            height: 24px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 7px;
            flex-shrink: 0;
        }
        .ne-dia-body {
            padding: 8px 8px 4px;
            border-top: 1px solid #21262d;
        }

        /* ── Banners de sección (A devolver / En depósito / Sin entregar) ── */
        .ne-sec {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 11px;
            margin: 16px 0 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .ne-sec:first-child { margin-top: 0; }
        .ne-sec .ne-sec-count {
            margin-left: auto;
            font-size: 12px;
            font-weight: 700;
            opacity: 0.9;
        }
        .ne-sec-chev {
            font-size: 17px;
            line-height: 1;
            flex-shrink: 0;
            transition: transform 0.2s;
            opacity: 0.8;
        }
        .ne-sec-devolver { background: linear-gradient(90deg,#3b0a0a,#160808); color: #ff7a7a; border: 1px solid #7b1a1a; }
        .ne-sec-deposito { background: linear-gradient(90deg,#2c1a00,#130d00); color: #ffb347; border: 1px solid #5a3a00; }
        .ne-sec-entregar { background: linear-gradient(90deg,#16240a,#0c1106); color: #9ccc4a; border: 1px solid #2a3a00; }

        /* ── Láser de escaneo QR ────────────────────────────────────────── */
        .qr-laser {
            position: absolute;
            left: 6px;
            right: 6px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, #FFE600, transparent);
            box-shadow: 0 0 12px 2px rgba(255,230,0,0.7);
            animation: qrLaserMove 2s ease-in-out infinite;
        }
        @keyframes qrLaserMove {
            0%   { top: 6px; }
            50%  { top: calc(100% - 9px); }
            100% { top: 6px; }
        }
        .ne-mini-btns button {
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            font-family: inherit;
        }
        .ne-section-hdr {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 6px;
        }
        .ne-section-hdr-line { flex: 1; height: 1px; background: #21262d; }
        .ne-section-hdr-pill {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        /* ── fin NE mini-cards ───────────────────────────────────────────── */

        .simple-estado {
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
        }

        .simple-estado.pendiente { background: linear-gradient(135deg, #9C27B0, #7b1fa2); }
        .simple-estado.impreso { background: linear-gradient(135deg, #1E88E5, #1565C0); }
        .simple-estado.en-camino { background: linear-gradient(135deg, #00d9ff, #00b8d4); color: #000; }
        .simple-estado.entregado { background: linear-gradient(135deg, #00ff88, #00e676); color: #000; }
        .simple-estado.cancelado { background: linear-gradient(135deg, #f85149, #da3633); }

        .simple-estado.reprogramado { background: linear-gradient(135deg, #FF9800, #f57c00); color: #000; }

        .simple-details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #21262d;
            display: none;
            animation: expandIn 0.2s ease-out;
        }

        @keyframes expandIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .simple-details.expanded {
            display: block;
        }

        /* MAPA MODAL */
        .map-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 4, 9, 0.95);
            z-index: 9999;
            overflow: auto;
            backdrop-filter: blur(8px);
        }

        .map-modal.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        .map-container {
            position: relative;
            max-width: 1000px;
            margin: 12px auto;
            background: #0d1117;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #21262d;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .map-header h2 {
            color: #FFE600;
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .map-close-btn {
            background: #f85149;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            min-height: 44px;
        }

        .map-filters {
            background: #161b22;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border: 1px solid #21262d;
        }

        .map-filter-btn {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            background: #21262d;
            border: 2px solid transparent;
            cursor: pointer;
            color: #8b949e;
            min-height: 40px;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .map-filter-btn:active { transform: scale(0.95); }

        .map-filter-btn.active-pendiente {
            background: #9C27B0;
            border-color: #ce93d8;
            color: white;
        }

        .map-filter-btn.active-encamino {
            background: #00d9ff;
            color: #000;
            border-color: #66eeff;
        }

        .map-filter-btn.active-reprogramado {
            background: #FF9800;
            color: #000;
            border-color: #ffcc80;
        }

        .map-filter-btn.active-entregado {
            background: #00ff88;
            color: #000;
            border-color: #66ffaa;
        }

        #mapFrame a {
            transition: all 0.2s;
        }

        #mapFrame a:hover {
            color: #FFE600 !important;
        }

        #mapFrame {
            width: 100%;
            height: 70vh;
            border-radius: 12px;
            background: #0d1117;
        }

        .leaflet-popup-content-wrapper {
            background: #161b22;
            color: #e6edf3;
            border-radius: 12px;
            border: 1px solid #21262d;
        }

        .leaflet-popup-tip {
            background: #161b22;
        }

        .leaflet-popup-content {
            margin: 10px;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #e6edf3;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .stats-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 3px;
            }
            
            .stat-item {
                padding: 5px 1px;
            }

            .stat-number {
                font-size: 16px;
            }

            .stat-label {
                font-size: 8px;
            }
            
            .envio-info {
                grid-template-columns: 1fr;
            }

            .cuenta-filter {
                gap: 5px;
            }

            .cuenta-btn {
                padding: 6px 12px;
                font-size: 11px;
                min-height: 36px;
            }

            .map-container {
                margin: 8px;
                padding: 12px;
            }

            #mapFrame {
                height: 65vh;
            }

            .sort-controls {
                gap: 4px;
            }

            .sort-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-height: 34px;
            }

            .simple-zona {
                font-size: 14px;
            }

            .simple-estado {
                font-size: 11px;
                padding: 5px 10px;
            }

            .envio-card-simple {
                padding: 12px 14px;
            }

            .filter-section {
                padding: 10px;
            }

            .search-select-wrapper {
                min-width: 0;
                flex: 1;
            }
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        /* ── Geo-stats inline (top bar) — chips de colores ── */
        #geoInline {
            display: flex;
            gap: 4px;
            align-items: center;
            flex: 1;
            min-width: 0;
        }
        .geo-chip {
            flex: 1;
            text-align: center;
            padding: 5px 4px 6px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
            min-width: 0;
        }
        .geo-chip .geo-num {
            font-size: 19px;
            font-weight: 800;
            display: block;
            line-height: 1;
            margin-bottom: 2px;
        }
        .geo-chip.caba { background: rgba(21,101,192,0.15); border-color: rgba(21,101,192,0.35); color: #64b5f6; }
        .geo-chip.prov { background: rgba(230,81,0,0.12);  border-color: rgba(230,81,0,0.3);   color: #ffab76; }
        .geo-chip.lej  { background: rgba(249,168,37,0.12); border-color: rgba(249,168,37,0.3); color: #ffd54f; }
        .geo-chip.geo-active {
            box-shadow: 0 0 0 1.5px currentColor;
            filter: brightness(1.25);
        }
        .geo-chip { cursor: pointer; transition: all 0.15s; user-select: none; -webkit-user-select: none; }
        .geo-chip:active { transform: scale(0.94); }

        /* ── Stat icon row ── */
        .stat-icon {
            font-size: 12px;
            line-height: 1;
            margin-bottom: 1px;
            display: block;
            min-height: 14px;
        }

        /* ── Sort toggle ── */
        .sort-toggle-btn {
            width: 100%;
            background: transparent;
            border: 1px solid #21262d;
            border-radius: 10px;
            color: #484f58;
            font-size: 11px;
            font-family: inherit;
            font-weight: 600;
            padding: 5px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: unset;
            height: 30px;
            margin-bottom: 6px;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .sort-toggle-btn:hover { border-color: #484f58; color: #8b949e; filter: none; transform: none; }
        .sort-toggle-btn .sort-active-label {
            font-size: 10px;
            color: #FFE600;
            font-weight: 700;
        }

        /* ── Map filter buttons — radio style ── */
        .map-filter-btn.active-selected {
            background: #FFE600 !important;
            color: #000 !important;
            border-color: #FFE600 !important;
            box-shadow: 0 2px 10px rgba(255,230,0,0.3);
        }

        /* ── Navegación de días ── */
        .date-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 14px;
            padding: 8px 10px;
            margin-bottom: 10px;
        }
        .date-nav-arrow {
            background: #21262d;
            border: none;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 16px;
            padding: 0;
            width: 36px;
            height: 36px;
            min-height: unset;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .date-nav-arrow:hover { background: #30363d; filter: none; transform: none; }
        .date-nav-arrow:active { background: #FFE600; color: #000; transform: scale(0.94); }
        .date-nav-days {
            display: flex;
            gap: 5px;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            justify-content: center;
        }
        .date-nav-days::-webkit-scrollbar { display: none; }
        .date-nav-day {
            flex-shrink: 0;
            background: transparent;
            border: 1.5px solid #30363d;
            border-radius: 10px;
            color: #8b949e;
            font-size: 11px;
            font-weight: 700;
            font-family: inherit;
            padding: 5px 10px;
            min-height: unset;
            height: 36px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            touch-action: manipulation;
        }
        .date-nav-day:hover { border-color: #484f58; color: #e6edf3; background: #21262d; filter: none; transform: none; }
        .date-nav-day.active { background: #FFE600; border-color: #FFE600; color: #000; box-shadow: 0 2px 10px rgba(255,230,0,0.25); }
        .date-nav-day .day-name { font-size: 10px; font-weight: 700; }
        .date-nav-day .day-date { font-size: 9px; opacity: 0.7; }
        .date-nav-input-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .date-nav-input-btn {
            background: #21262d;
            border: 1.5px solid #30363d;
            border-radius: 8px;
            color: #8b949e;
            font-size: 16px;
            width: 36px;
            height: 36px;
            min-height: unset;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .date-nav-input-btn:hover { border-color: #484f58; color: #e6edf3; filter: none; transform: none; }
        .date-nav-input-hidden {
            position: absolute;
            top: 0; left: 0;
            width: 36px; height: 36px;
            opacity: 0;
            cursor: pointer;
        }

        /* ── Cards rediseñadas ── */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;

<body>

    <script>
        // CONFIGURACIÓN - AMBAS CUENTAS ACTIVAS
        const GAS_ETIQUETAS = 'https://script.google.com/macros/s/AKfycbyV__2aEwhFGhLgB-Da9POE_kRi-0hXOp6qTly-S6wGqfoyIECmJIy3KecsS6jSJg49/exec';
        const GAS_TRACKER   = 'https://script.google.com/macros/s/AKfycbx5zxPsDvTtzFVz9qN6gjSXf2Wr3rYo6qbe20tESHQGCMT6lrocOsBi8ZRPmH3mZagNKg/exec';
        const GAS_RECLAMOS  = 'https://script.google.com/macros/s/AKfycbx5zxPsDvTtzFVz9qN6gjSXf2Wr3rYo6qbe20tESHQGCMT6lrocOsBi8ZRPmH3mZagNKg/exec';

        // ── Helper genérico para llamar GAS_RECLAMOS via GET + JSONP fallback ──
        function _gasReclamo(params) {
            return new Promise(resolve => {
                const qs  = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
                const url = GAS_RECLAMOS + '?' + qs;
                // Intentar fetch primero
                fetch(url, { signal: AbortSignal.timeout(8000) })
                    .then(r => r.ok ? r.json() : null)
                    .then(d => resolve(d))
                    .catch(() => {
                        // Fallback JSONP
                        const cb = '_gr' + Date.now();
                        const sc = document.createElement('script');
                        const t  = setTimeout(() => { cleanup(); resolve(null); }, 10000);
                        function cleanup() { clearTimeout(t); delete window[cb]; sc.remove(); }
                        window[cb] = d => { cleanup(); resolve(d); };
                        sc.onerror = () => { cleanup(); resolve(null); };
                        sc.src = url + '&callback=' + cb;
                        document.head.appendChild(sc);
                    });
            });
        }

        // Mapa global: shippingId → { id, estado, ... } — se llena al cargar NE
        window._reclamosMap = window._reclamosMap || new Map();

        let etiquetasSet = null;

        function cargarEtiquetas() {
            const callbackName = 'etiquetasCallback_' + Date.now();
            const script = document.createElement('script');
            window[callbackName] = function(ids) {
                etiquetasSet = new Set(ids.map(String));
                document.querySelectorAll('[data-eid]').forEach(btn => {
                    btn.style.display = etiquetasSet.has(btn.dataset.eid) ? '' : 'none';
                });
                delete window[callbackName];
                script.remove();
            };
            script.src = `${GAS_ETIQUETAS}?action=list&callback=${callbackName}`;
            script.onerror = () => { etiquetasSet = null; script.remove(); };
            document.head.appendChild(script);
        }

        function verEtiqueta(shippingId, event) {
            if (event) event.stopPropagation();
            const btn = event?.currentTarget || event?.target;
            if (btn) {
                btn._origText = btn.innerHTML;
                btn.innerHTML = '⏳ Cargando...';
                btn.disabled  = true;
                btn.style.opacity = '0.65';
            }
            const restore = () => { if (btn) { btn.innerHTML = btn._origText || '🏷️ Ver etiqueta'; btn.disabled = false; btn.style.opacity = '1'; } };
            fetch(`https://etiquetas-proxy.rafaelassir.workers.dev/?id=${shippingId}`)
                .then(r => r.json())
                .then(data => {
                    restore();
                    if (data && data.pdf) {
                        const binary = atob(data.pdf);
                        const bytes  = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes], { type: 'application/pdf' });
                        window.open(URL.createObjectURL(blob), '_blank');
                    } else {
                        alert(data?.error || 'No se encontró etiqueta para el envío ' + shippingId);
                    }
                })
                .catch(e => { restore(); alert('Error cargando etiqueta: ' + e.message); });
        }

        // ── Archivados helpers (scope global para que el drawer siempre los vea) ──
        function _getArchivados() {
            try { return new Set(JSON.parse(localStorage.getItem('_neArchivados') || '[]')); }
            catch(e) { return new Set(); }
        }
        function _saveArchivados(set) {
            try { localStorage.setItem('_neArchivados', JSON.stringify([...set])); } catch(e) {}
        }
        // Botón de emergencia siempre disponible en consola: _desarchivarTodoGlobal()
        window._desarchivarTodoGlobal = function() {
            localStorage.removeItem('_neArchivados');
            alert('✅ Archivados borrados. Recargá la página.');
        };

        // ══ QR Scanner (cámara en vivo con fallback a foto) ════════════════
        let _qrStream = null, _qrRaf = null;

        function abrirEscaner() {
            const modal = document.getElementById('qrModal');
            if (!modal) return;
            modal.style.display = 'flex';
            // Resetear modo manual
            const mw = document.getElementById('qrModoManualWrap');
            if (mw) { mw.style.display = 'none'; }
            const mi = document.getElementById('qrModoManualInput');
            if (mi) mi.value = '';
            const ms = document.getElementById('qrManualStatus');
            if (ms) ms.textContent = '';
            document.getElementById('qrStatus').textContent = 'Iniciando cámara...';
            document.getElementById('qrLiveWrap').style.display  = 'none';
            document.getElementById('qrPhotoWrap').style.display = 'none';
            if (!navigator.mediaDevices?.getUserMedia) {
                _mostrarFallbackFoto();
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } })
                .then(stream => {
                    _qrStream = stream;
                    const video = document.getElementById('qrVideo');
                    video.srcObject = stream;
                    video.play();
                    document.getElementById('qrLiveWrap').style.display = 'block';
                    document.getElementById('qrStatus').textContent = 'Buscando QR...';
                    _tickQR(video);
                })
                .catch(() => _mostrarFallbackFoto());
        }

        function _buscarManual(valor) {
            const v = String(valor || '').trim().replace(/\D/g, '');
            if (v.length < 4) {
                document.getElementById('qrManualStatus').textContent = '⚠️ Ingresá al menos 4 dígitos';
                return;
            }
            document.getElementById('qrManualStatus').textContent = '🔍 Buscando...';

            // Si tiene 10+ dígitos es ID completo → procesar directo
            if (v.length >= 10) {
                _cerrarCamaraManual();
                _procesarQREscaneado(v);
                return;
            }

            // Buscar por coincidencia parcial en shipping ID y order ID
            const todos = window._neTodos || [];
            const coincidencias = todos.filter(t =>
                String(t.shipping.id).includes(v) ||
                String(t.order?.id || '').includes(v)
            );

            // También buscar en reclamos (paquetes ya recibidos/archivados)
            const enReclamos = [];
            window._reclamosMap?.forEach((rec, sid) => {
                if (sid.includes(v) || String(rec.orderId || '').includes(v)) {
                    if (!coincidencias.find(t => String(t.shipping.id) === sid)) {
                        enReclamos.push(rec);
                    }
                }
            });

            const statusEl = document.getElementById('qrManualStatus');

            if (coincidencias.length === 0 && enReclamos.length === 0) {
                // Buscar en GAS como último recurso
                _gasReclamo({ action: 'search_reclamos', q: v }).then(d => {
                    if (d?.records?.length === 1) {
                        // Un solo resultado → abrir directo
                        _cerrarCamaraManual();
                        _procesarQREscaneado(d.records[0].shippingId);
                    } else if (d?.records?.length > 1) {
                        statusEl.innerHTML = '<div style="color:#8b949e;font-size:11px;margin-bottom:4px;">Elegí el paquete:</div>' +
                            d.records.slice(0,6).map(r =>
                                `<button onclick="_cerrarCamaraManual();_procesarQREscaneado('${r.shippingId}')"
                                    style="display:block;width:100%;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:12px;text-align:left;cursor:pointer;margin-bottom:4px;">
                                    📦 ${r.id} · ${r.comprador} · ${r.zona}</button>`
                            ).join('');
                    } else {
                        statusEl.textContent = '❌ No encontrado. Verificá el número.';
                    }
                });
                return;
            }

            // Un solo resultado total → abrir directo
            const totalResultados = coincidencias.length + enReclamos.length;
            if (totalResultados === 1) {
                _cerrarCamaraManual();
                if (coincidencias.length === 1) {
                    _procesarQREscaneado(String(coincidencias[0].shipping.id));
                } else {
                    _procesarQREscaneado(enReclamos[0].shippingId);
                }
                return;
            }

            // Múltiples coincidencias → mostrar lista
            const items = [
                ...coincidencias.map(t => ({
                    sid: String(t.shipping.id),
                    label: (t.shipping._zona || t.shipping.receiver_address?.city?.name || ''),
                    sub: t.order?.buyer?.nickname || '',
                })),
                ...enReclamos.map(r => ({
                    sid: r.shippingId,
                    label: r.zona || r.comprador,
                    sub: r.id + ' · ' + r.estado,
                })),
            ];
            statusEl.innerHTML = '<div style="color:#8b949e;font-size:11px;margin-bottom:4px;">Elegí el paquete:</div>' +
                items.slice(0,6).map(it =>
                    `<button onclick="_cerrarCamaraManual();_procesarQREscaneado('${it.sid}')"
                        style="display:block;width:100%;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:12px;text-align:left;cursor:pointer;margin-bottom:4px;">
                        📦 ${it.label} <span style="color:#8b949e;font-size:10px;">· ${it.sub}</span>
                    </button>`
                ).join('');
        }

        // Detener cámara sin cerrar el modal
        function _cerrarCamaraManual() {
            if (_qrStream) { _qrStream.getTracks().forEach(t => t.stop()); _qrStream = null; }
            if (_qrRaf)    { clearTimeout(_qrRaf); cancelAnimationFrame(_qrRaf); _qrRaf = null; }
            cerrarEscaner(); // cierra todo
        }

        // Activar modo manual: apaga cámara, muestra teclado
        function _activarModoManual() {
            if (_qrStream) { _qrStream.getTracks().forEach(t => t.stop()); _qrStream = null; }
            if (_qrRaf)    { clearTimeout(_qrRaf); cancelAnimationFrame(_qrRaf); _qrRaf = null; }
            document.getElementById('qrLiveWrap').style.display  = 'none';
            document.getElementById('qrPhotoWrap').style.display = 'none';
            document.getElementById('qrStatus').textContent = '';

        function _tickQR(video) {
            if (video.readyState >= 2 && video.videoWidth > 0) {
                const canvas = document.getElementById('qrCanvas');
                // Reducir resolución para que jsQR procese más rápido (max 600px)
                const MAX = 600;
                const scale = Math.min(1, MAX / Math.max(video.videoWidth, video.videoHeight));
                canvas.width  = Math.round(video.videoWidth  * scale);
                canvas.height = Math.round(video.videoHeight * scale);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
                // Intentar con y sin inversión para mayor detección
                const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
                if (code) { cerrarEscaner(); _procesarQREscaneado(code.data); return; }
            }
            // 150ms entre frames — balance entre velocidad y CPU móvil
            _qrRaf = setTimeout(() => _tickQR(video), 150);
        }

        function cerrarEscaner() {
            if (_qrStream) { _qrStream.getTracks().forEach(t => t.stop()); _qrStream = null; }
            if (_qrRaf)    { clearTimeout(_qrRaf); cancelAnimationFrame(_qrRaf); _qrRaf = null; }
            const modal = document.getElementById('qrModal');
            if (modal) modal.style.display = 'none';
            document.getElementById('qrFileInput').value = '';
        }

        function _dispararCamara() {

        function _onQRFileSelected(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            document.getElementById('qrStatus').textContent = 'Leyendo QR...';
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = function() {
                const canvas = document.getElementById('qrCanvas');
                const MAX = 1200;
                let w = img.naturalWidth, h = img.naturalHeight;
                if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                URL.revokeObjectURL(url);
                const imgData = ctx.getImageData(0, 0, w, h);
                const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
                if (code) { cerrarEscaner(); _procesarQREscaneado(code.data); }
                else { document.getElementById('qrStatus').textContent = '⚠️ No se encontró QR. Intentá de nuevo más cerca.'; }
            };
            img.onerror = function() { URL.revokeObjectURL(url); document.getElementById('qrStatus').textContent = '❌ Error al leer la imagen.'; };
            img.src = url;
        }

        async function _procesarQREscaneado(qrText) {
            let shippingId = '';
            // Primero: buscar número de 10+ dígitos en el texto raw
            const mDirect = String(qrText).match(/\b(\d{10,})\b/);
            if (mDirect) {
                shippingId = mDirect[1];
            } else {
                // Si no hay número directo, intentar parsear como JSON
                try {
                    const d = JSON.parse(qrText);
                    if (d && typeof d === 'object') shippingId = String(d.id || d.shipment_id || '');
                } catch(e) {}
            }
            if (!shippingId) { alert('QR no reconocido:\n' + String(qrText).substring(0, 120)); return; }

            // Mostrar panel de carga inmediatamente (feedback visual rápido)
            _mostrarInfoEscaneado({ shippingId, cargando: true });

            // Intentar encontrar en lista ya cargada
            let item = (window._neTodos || []).find(t => String(t.shipping.id) === shippingId);
            let cuentaNombre = item?.cuentaNombre || '';

            // Si no está en la lista, buscar en ML directamente (envío + orden)
            if (!item) {
                try {
                    const tokens = await Promise.all(CUENTAS.map(c => obtenerTokenCuenta(c).catch(()=>null)));
                    let shipping = null, order = {}, foundCuenta = null;
                    // Probar cada cuenta hasta encontrar el envío
                    for (let i = 0; i < CUENTAS.length; i++) {
                        if (!tokens[i]) continue;
                        try {
                            const r = await fetch(`${CUENTAS[i].proxy}/api/shipments/${shippingId}`,
                                { headers: { Authorization: `Bearer ${tokens[i]}` } });
                            if (r.ok) {
                                const d = await r.json();
                                if (d && d.id) { shipping = d; foundCuenta = CUENTAS[i]; break; }
                            }
                        } catch(e) {}
                    }
                    if (shipping && foundCuenta) {
                        cuentaNombre = foundCuenta.nombre;
                        // Buscar la orden para obtener el comprador
                        const orderId = shipping.order_id;
                        if (orderId) {
                            try {
                                const ro = await fetch(`${foundCuenta.proxy}/api/orders/${orderId}`,
                                    { headers: { Authorization: `Bearer ${tokens[CUENTAS.indexOf(foundCuenta)]}` } });
                                if (ro.ok) order = await ro.json();
                            } catch(e) {}
                        }
                        item = { shipping, order, cuentaNombre };
                    }
                } catch(e) {}
            }

            let zona = '', calle = '', numero = '', comprador = '';
            if (item?.shipping?.receiver_address) {
                const addr   = item.shipping.receiver_address;
                const barrio = addr.neighborhood?.name || '';
                const ciudad = addr.city?.name || '';
                const zip    = addr.zip_code || '';
                zona       = typeof getZonaDetallada === 'function' ? getZonaDetallada(barrio, ciudad, zip) : (barrio || ciudad);
                calle      = addr.street_name   || '';
                numero     = addr.street_number || '';
                comprador  = item.order?.buyer?.nickname || '';
            }

            // Buscar datos del reclamo en el sheet (local primero, luego GAS)
            let rec = window._reclamosMap?.get(String(shippingId));
            if (!rec) {
                const d = await _gasReclamo({ action: 'search_reclamos', q: shippingId }).catch(() => null);
                rec = d?.records?.find(r => r.shippingId === String(shippingId));
                if (rec) window._reclamosMap?.set(String(shippingId), rec);
            }

            // Mostrar panel de info con opciones (NO ir directo al PIN)
            _mostrarInfoEscaneado({
                shippingId,
                zona:        zona || rec?.zona || '',
                calle, numero, comprador: comprador || rec?.comprador || '',
                cuentaNombre: cuentaNombre || rec?.cuenta || '',
                valor:       item?.order?.total_amount || rec?.valor || 0,
                rec,
            });
        }

        async function _guardarRecibido(shippingId, cuentaNombre, zona) {
            const item = (window._neTodos || []).find(t => String(t.shipping.id) === String(shippingId));
            const comprador = item?.order?.buyer?.nickname || '';

            // 1. Actualizar UI de inmediato
            window._neRecibidosIds = window._neRecibidosIds || new Set();
            window._neRecibidosIds.add(String(shippingId));
            _showNEToast('⏳ Guardando recepción...');

            // 2. Respaldo en localStorage ANTES de intentar GAS
            const pendingKey = 'rcv_' + shippingId;
            try { localStorage.setItem(pendingKey, JSON.stringify({ shippingId, cuentaNombre, zona, comprador, ts: Date.now() })); } catch(e) {}

            // 3. Intentar guardar en GAS (fetch con reintentos → JSONP como último recurso)
            const ok = await _enviarRecibidoGAS(shippingId, cuentaNombre, zona, comprador);

            if (ok) {
                try { localStorage.removeItem(pendingKey); } catch(e) {}
                _showNEToast('✅ Guardado: ' + zona);
            } else {
                _showNEToast('⚠️ Sin conexión — guardado localmente\nSe sincronizará al reabrir');
            }

            // 4. Marcar como recibido en la hoja de reclamos (en background, no bloquea)
            _gasReclamo({ action: 'update_reclamo', shippingId: String(shippingId), estado: 'recibido' })
                .catch(() => {}); // silencioso si falla

            setTimeout(() => cargarNoEntregados(), 900);
        }

        async function _enviarRecibidoGAS(shippingId, cuentaNombre, zona, comprador) {
            const url = GAS_TRACKER
                + '?action=recibir'
                + '&id='        + encodeURIComponent(shippingId)
                + '&cuenta='    + encodeURIComponent(cuentaNombre)
                + '&zona='      + encodeURIComponent(zona)
                + '&comprador=' + encodeURIComponent(comprador);
            // fetch con 3 reintentos
            for (let i = 0; i < 3; i++) {
                try {
                    const ctrl = new AbortController();
                    const tid  = setTimeout(() => ctrl.abort(), 10000);
                    const r = await fetch(url, { signal: ctrl.signal });
                    clearTimeout(tid);
                    if (r.ok) return true;
                } catch(e) {
                    if (i < 2) await new Promise(res => setTimeout(res, 1500 * (i + 1)));
                }
            }
            // Fallback: JSONP (por si CORS falla o viene de file://)
            return new Promise(resolve => {
                const cb = '_rcv' + Date.now();
                const sc = document.createElement('script');
                const timer = setTimeout(() => { cleanup(); resolve(false); }, 12000);
                function cleanup() { clearTimeout(timer); delete window[cb]; if (sc.parentNode) sc.remove(); }
                window[cb] = () => { cleanup(); resolve(true); };
                sc.onerror = () => { cleanup(); resolve(false); };
                sc.src = url + '&callback=' + cb;
                document.head.appendChild(sc);
            });
        }

        async function _procesarColaRecibidos() {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k?.startsWith('rcv_')) keys.push(k);
            }
            if (!keys.length) return;
            let synced = 0;
            for (const key of [...keys]) {
                try {
                    const d = JSON.parse(localStorage.getItem(key));
                    if (!d?.shippingId) { localStorage.removeItem(key); continue; }
                    if (Date.now() - (d.ts || 0) > 86400000) { localStorage.removeItem(key); continue; }
                    const ok = await _enviarRecibidoGAS(d.shippingId, d.cuentaNombre, d.zona, d.comprador);
                    if (ok) { localStorage.removeItem(key); synced++; }
                } catch(e) {}
            }
            if (synced > 0) _showNEToast(`✅ ${synced} recibo${synced > 1 ? 's' : ''} sincronizado${synced > 1 ? 's' : ''}`);
        }

        function _recibirManual(shippingId, cuentaNombre, event) {
            if (event) event.stopPropagation();
            const item = (window._neTodos || []).find(t => String(t.shipping.id) === String(shippingId));
            const barrio = item?.shipping.receiver_address?.neighborhood?.name || '';
            const ciudad = item?.shipping.receiver_address?.city?.name || '';
            const zip    = item?.shipping.receiver_address?.zip_code || '';
            const zona   = typeof getZonaDetallada === 'function' ? getZonaDetallada(barrio, ciudad, zip) : (barrio || ciudad || shippingId);
            const calle  = item?.shipping.receiver_address?.street_name || '';
            const numero = item?.shipping.receiver_address?.street_number || '';
            const comprador = item?.order?.buyer?.nickname || '';
            _mostrarPIN(
                `📍 <strong>${zona}</strong><br>🏠 ${calle} ${numero}<br>👤 ${comprador}<br><span style="color:#8b949e;font-size:11px;">${cuentaNombre} · #${item?.order?.id||''}</span>`,
                () => _guardarRecibido(shippingId, cuentaNombre, zona)
            );
        }

            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; }, 2200);

            // Si hoy es domingo (0), retroceder al viernes (2 días)
            if (diaSemana === 0) {
                diasAtras = 2;
            }
            // Si hoy es lunes (1), retroceder al viernes (3 días)

        async function obtenerTokenCuenta(cuenta) {
            const cached = tokenCache[cuenta.nombre];
            if (cached && Date.now() < cached.expires) return cached.token;
            try {
                const response = await fetch(`${cuenta.proxy}/get-token`);
                const data = await response.json();
                if (data.access_token) {
                    tokenCache[cuenta.nombre] = { token: data.access_token, expires: Date.now() + 4 * 60 * 1000 };
                    // Cachear user_id en sessionStorage para evitar fetch doble en cargarOrdenesDeCuenta
                    if (data.user_id) {
                        sessionStorage.setItem(`${cuenta.nombre.toLowerCase()}_user_id`, data.user_id);
                    }
                    return data.access_token;
                }
                if (data.error === 'no_token') console.error(`Token no configurado para ${cuenta.nombre}`);
                return null;
            } catch (error) {
                console.error(`Error obteniendo token de ${cuenta.nombre}:`, error);
                return null;

        function formatearFecha(fechaISO) {
            if (!fechaISO) return '❌';
            
            const fecha = new Date(fechaISO);
            const hoy = new Date();
            
            hoy.setHours(0, 0, 0, 0);
            fecha.setHours(0, 0, 0, 0);
            
            const diffDias = Math.floor((fecha - hoy) / (1000 * 60 * 60 * 24));
            
            if (diffDias === 0) return 'Hoy';
            if (diffDias === -1) return 'Ayer';
            if (diffDias === 1) return 'Mañana';
            
            const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const dia = dias[fecha.getDay()];
            const fechaFormato = fecha.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
            
            return `${dia} ${fechaFormato}`;
        }

        function formatearSoloHora(fechaISO, fechaEsperada = null) {
            if (!fechaISO) return null;
            const fecha = new Date(fechaISO);
            if (fechaEsperada) {
                const esperada = new Date(fechaEsperada); esperada.setHours(0,0,0,0);
                const actual = new Date(fechaISO); actual.setHours(0,0,0,0);
                if (esperada.getTime() !== actual.getTime()) {
                    const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                    return `${_fmtHora.format(fecha)} (${dias[fecha.getDay()]})`;
                }
            }
            return _fmtHora.format(fecha);
        }

        // Es la fecha que ML fija como compromiso al vender (no la "estimada"
        // que se va moviendo). Cada venta pertenece SIEMPRE a este día.
        // Prioridad: límite (obligación) → final → estimada.
        function _fechaPromesa(shipping) {
            const so = shipping?.shipping_option || {};
            return so.estimated_delivery_limit?.date
                || so.estimated_delivery_final?.date
                || so.estimated_delivery_time?.date
                || '';
        }

        function esEntregaParaFecha(shipping, targetDate) {
            const fechaEntrega = _fechaPromesa(shipping);
            if (!fechaEntrega) return false;
            const entrega = new Date(fechaEntrega);
            entrega.setHours(0, 0, 0, 0);
            return entrega.getTime() === targetDate.getTime();
        }

        // Señal real de "escaneado ese día" = status_history.date_shipped === targetDate.
        // Captura paquetes que ML les puso fecha estimada distinta pero salieron ese día.
        function esDespachadoEnFecha(shipping, targetDate) {
            const ds = shipping.status_history?.date_shipped;
            if (!ds) return false;
            const d = new Date(ds); d.setHours(0, 0, 0, 0);

        //  CACHE POR DÍA (sessionStorage)
        //  - Días pasados: 60 min TTL
