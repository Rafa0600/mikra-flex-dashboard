        // ══════════════════════════════════════════════════════
        const CACHE_PREFIX = 'flex_v1_';
        const CACHE_TTL_TODAY   = 5  * 60 * 1000;
        const CACHE_TTL_PAST    = 60 * 60 * 1000;
        const CACHE_TTL_OLD     =  8 * 60 * 60 * 1000; // días con >24h de antigüedad no cambian

        // ── Formatters de fecha/hora reutilizables (evita recrearlos N veces) ──
        const _fmtHora = new Intl.DateTimeFormat('es-AR', {
            timeZone: 'America/Argentina/Buenos_Aires',
            hour: '2-digit', minute: '2-digit', hour12: false
        });
        const _fmtFechaCorta = new Intl.DateTimeFormat('es-AR', {
            timeZone: 'America/Argentina/Buenos_Aires',
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false
        });
        const _fmtDia = new Intl.DateTimeFormat('es-AR', { weekday: 'short' });
        const _fmtDiaMes = new Intl.DateTimeFormat('es-AR', { day: '2-digit', month: '2-digit' });

        function _cacheKey(date) {
            return CACHE_PREFIX + date.toISOString().split('T')[0];
        }

        function loadFromCache(date) {
            try {
                const raw = sessionStorage.getItem(_cacheKey(date));
                if (!raw) return null;
                const { ts, orders } = JSON.parse(raw);
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const isToday = date.toDateString() === hoy.toDateString();
                const ageMs = Date.now() - ts;
                const isOld = !isToday && (hoy - date) > 86400000; // más de 1 día atrás
                const ttl = isToday ? CACHE_TTL_TODAY : isOld ? CACHE_TTL_OLD : CACHE_TTL_PAST;
                if (ageMs > ttl) { sessionStorage.removeItem(_cacheKey(date)); return null; }
                return orders;
            } catch { return null; }
        }

        function saveToCache(date, orders) {
            try {
                // Guardar solo los campos necesarios para renderizar (no el objeto entero)
                sessionStorage.setItem(_cacheKey(date), JSON.stringify({ ts: Date.now(), orders }));
            } catch (e) {
                // sessionStorage lleno → limpiar caches viejos
                try {
                    const keys = Object.keys(sessionStorage).filter(k => k.startsWith(CACHE_PREFIX));
                    keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => sessionStorage.removeItem(k));
                    sessionStorage.setItem(_cacheKey(date), JSON.stringify({ ts: Date.now(), orders }));
                } catch {}
            }
        }

        function invalidateCache(date) {
            try { sessionStorage.removeItem(_cacheKey(date)); } catch {}
        }

        // ── Caché de envíos ENTREGADOS (estado final → no cambia) ───────────
        // Evita re-consultar al Worker shipments ya entregados. Gran ahorro de
        // queries en el refresco en segundo plano y al revisitar días.
        const _SHIP_CACHE_KEY = 'flex_ship_v1';
        const _SHIP_CACHE_TTL = 24 * 60 * 60 * 1000; // 24 h (entregados no cambian)
        let _shipCacheMem = null;
        function _getShipCache() {
            if (_shipCacheMem) return _shipCacheMem;
            try {
                const raw = localStorage.getItem(_SHIP_CACHE_KEY);
                if (raw) {
                    const p = JSON.parse(raw);
                    if (p?.data && Date.now() - p.ts < _SHIP_CACHE_TTL) {
                        _shipCacheMem = new Map(p.data);
                        return _shipCacheMem;
                    }
                }
            } catch {}
            _shipCacheMem = new Map();
            return _shipCacheMem;
        }
        function _esEnvioFinal(s) {
            return !!(s && s.logistic_type === 'self_service' &&
                (s.status === 'delivered' || s.status_history?.date_delivered));
        }
        function _addToShipCache(shipments) {
            const finales = shipments.filter(_esEnvioFinal);
            if (!finales.length) return;
            const c = _getShipCache();
            finales.forEach(s => c.set(String(s.id), {
                id: s.id, status: s.status, substatus: s.substatus,
                logistic_type: s.logistic_type, status_history: s.status_history,
                shipping_option: s.shipping_option, receiver_address: s.receiver_address,
            }));
            try {
                const arr = [...c].slice(-6000); // cap para cubrir toda la ventana sin inflar localStorage
                _shipCacheMem = new Map(arr);
                localStorage.setItem(_SHIP_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: arr }));
            } catch {}
        }

        // ── Rango de fechas inteligente ─────────────────────────────
        // Las ventas creadas días antes (viernes, fin de semana largo, feriado)
        // recién se despachan/escanean hoy. Para no perderlas, la ventana de
        // búsqueda por fecha de CREACIÓN retrocede AMPLIO: mínimo 10 días
        // calendario, y si hay un viernes más atrás dentro de los 16, hasta ahí.
        // Ej: martes 16 con feriado lunes 15 → toma ventas desde el viernes 12 y antes.
        function calcularDateFrom(targetDate) {
            const base = new Date(targetDate);
            base.setHours(0,0,0,0);
            let d = new Date(base);
            let calDays = 0;
            while (true) {
                d.setDate(d.getDate() - 1);
                calDays++;
                if (calDays >= 10 && d.getDay() === 5) break; // mín 10 días, cortar en un viernes
                if (calDays >= 16) break; // tope de seguridad (feriados largos)
            }
            return d;
        }

        async function cargarNoEntregados() {
            window._vistaActual = 'ne';
            const myGen = ++loadGeneration;
            const content = document.getElementById('content');
            _diagLines.length = 0;
            _diagStart = Date.now();
            _diagLog('▶ cargarNoEntregados inicio');

            document.getElementById('statsSection').classList.add('hidden');
            document.getElementById('sortToggleRow').style.display = 'none';
            document.getElementById('sortSection').style.display = 'none';
            document.getElementById('btnMapa').classList.add('hidden');

            const hoy = new Date(); hoy.setHours(0,0,0,0);
            // Rango de entrega: últimos 7 días (fecha estimada de entrega, no de creación)
            const pad = n => String(n).padStart(2,'0');
            const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            const desde = new Date(hoy); desde.setDate(desde.getDate() - 7);
            const deliveryFrom = encodeURIComponent(`${fmt(desde)}T00:00:00.000-03:00`);
            const deliveryTo   = encodeURIComponent(`${fmt(hoy)}T23:59:59.000-03:00`);

            // Progreso compartido
            const prog = { done: 0, total: 0 };
            let rafPend = false;
            function notifyProg() {
                if (rafPend) return; rafPend = true;
                requestAnimationFrame(() => {
                    rafPend = false;
                    const fill = document.getElementById('neProgressFill');
                    const wrap = document.getElementById('neProgressWrap');
                    const txt  = document.getElementById('neProgressText');
                    if (!fill || !wrap || prog.total <= 0) return;
                    wrap.style.display = 'block';
                    const pct = Math.min(100, Math.round(prog.done / prog.total * 100));
                    fill.style.width = pct + '%';
                    if (txt) txt.textContent = `${pct}%`;
                });
            }

            // ── Caché: mostrar datos previos de inmediato mientras carga ML ────────
            const neCache = _loadNECache();
            window._neEsFresco = false;
            if (neCache) {
                // Cargar reclamos cache para tener #IDs y los huérfanos (+7 días) de inmediato
                if (!window._reclamosMap?.size) {
                    const rc = _loadReclamosCacheAny();
                    if (rc) window._reclamosMap = rc;
                }
                let itemsCache = neCache.items;
                const huerfCache = _construirHuerfanos(itemsCache);
                if (huerfCache.length) itemsCache = [...huerfCache, ...itemsCache];
                window._neTodos = itemsCache;
                _renderNEItems(itemsCache, { fromCache: true, cacheAgeMin: neCache.ageMin });
                _syncReclamosEnBackground(neCache.items);
            } else {
                // Sin caché NE: cargar reclamos del localStorage y mostrar cancelados/depósito de inmediato
                const reclamosRapidos = _loadReclamosCacheAny();
                if (reclamosRapidos && reclamosRapidos.size > 0) {
                    _mostrarReclamosRapido(reclamosRapidos, content);
                } else {
                    content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>🚫 Buscando viajes sin entregar (7 días)...
                        <div class="load-progress-wrap" id="neProgressWrap" style="display:none;">
                            <div class="load-progress-track">
                                <div class="load-progress-fill" id="neProgressFill"></div>
                                <div class="load-progress-pct" id="neProgressText">0%</div>
                            </div>
                        </div></div>`;
                }
            }

            const shippingIdsVistos = new Set();
            const CONC = 35;

            // Arrancar la carga de IDs recibidos SIN bloquear el fetch de ML
            // (es una llamada a GAS que puede tardar hasta 6s; la resolvemos al final)
            const recibidosPromise = cargarRecibidosIds();

            // Sólo esperamos los tokens para empezar a pegarle a ML de inmediato
            const tokens = await Promise.all(CUENTAS.map(c => obtenerTokenCuenta(c)));

            const cuentaResults = await Promise.all(CUENTAS.map(async (cuenta, ci) => {
                try {
                    const token = tokens[ci];
                    if (!token) return [];
                    const cuentaKey = cuenta.nombre.toLowerCase();
                    let sellerId = sessionStorage.getItem(`${cuentaKey}_user_id`);
                    if (!sellerId) {
                        const td = await fetch(`${cuenta.proxy}/get-token`).then(r=>r.json()).catch(()=>({}));
                        if (td.user_id) { sellerId = td.user_id; sessionStorage.setItem(`${cuentaKey}_user_id`, sellerId); }
                    }
                    if (!sellerId) return [];
                    _diagLog(`[${cuenta.nombre}] sellerId=${sellerId}`);

                    // Query A: delivery date range (ML filtra server-side → mucho menos volumen)
                    // Query B: date_created últimos 10 días para capturar not_delivered que ya fallaron
                    //          (su estimated_delivery ya pasó hace más de 7 días en algún caso)
                    const filterA = `&shipping.estimated_delivery_time.from=${deliveryFrom}&shipping.estimated_delivery_time.to=${deliveryTo}&order.status=paid`;
                    const desde10 = new Date(hoy); desde10.setDate(desde10.getDate()-10);
                    const filterB = `&order.date_created.from=${encodeURIComponent(desde10.toISOString().split('.')[0]+'.000-00:00')}&order.date_created.to=${encodeURIComponent(new Date(hoy.getTime()+86400000).toISOString().split('.')[0]+'.000-00:00')}&order.status=paid`;

                    async function fetchPaged(filter) {
                        let orders = [];
                        const fd = await fetch(`${cuenta.proxy}/api/orders/search?seller=${sellerId}&offset=0&limit=50&sort=date_desc${filter}`,
                            { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).catch(()=>({results:[],paging:{}}));
                        orders.push(...(fd.results||[]));
                        const total = fd.paging?.total || 0;
                        if (total > 50) {
                            // 19 páginas extra = 1000 órdenes — todas en paralelo
                            const pages = Math.min(Math.ceil(total/50)-1, 19);
                            const extra = await Promise.all(Array.from({length:pages},(_,i)=>
                                fetch(`${cuenta.proxy}/api/orders/search?seller=${sellerId}&offset=${(i+1)*50}&limit=50&sort=date_desc${filter}`,
                                    {headers:{'Authorization':`Bearer ${token}`}}).then(r=>r.json()).catch(()=>({results:[]}))
                            ));
                            extra.forEach(d=>orders.push(...(d.results||[])));
                        }
                        return orders;
                    }

                    const filterC = `&shipping.estimated_delivery_time.from=${deliveryFrom}&shipping.estimated_delivery_time.to=${deliveryTo}&order.status=cancelled`;

                    // Las tres queries en paralelo
                    const [ordersA, ordersB, ordersC] = await Promise.all([fetchPaged(filterA), fetchPaged(filterB), fetchPaged(filterC)]);

                    // Deduplicar A+B (sin canceladas)
                    const seen = new Set();
                    const combined = [];
                    [...ordersA, ...ordersB].forEach(o => {
                        const sid = o.shipping?.id;
                        if (!sid || seen.has(sid) || o.status === 'cancelled') return;
                        seen.add(sid);
                        combined.push(o);
                    });
                    // Canceladas separadas
                    const canceladas = [];
                    ordersC.forEach(o => {
                        const sid = o.shipping?.id;
                        if (!sid || seen.has(sid)) return;
                        seen.add(sid);
                        o._canceladaDevolver = true;
                        canceladas.push(o);
                    });

                    _diagLog(`[${cuenta.nombre}] órdenes: A=${ordersA.length} B=${ordersB.length} C=${ordersC.length} → ${combined.length} activos + ${canceladas.length} cancelados`);

                    const todosParaFetch = [...combined, ...canceladas];
                    // prog.total se ajusta después de saber cuántos hay que fetchear realmente

                    // Batch fetch shipments — el Worker hace fan-out interno (1 request → 20 paralelos en edge)
                    // BCONC=4: evita rate limit de ML (Worker manda 4×20=80 requests simultáneos máx)
                    const BSIZ = 20, BCONC = 6;
                    const sMap = new Map();
                    // Saltar shipments que ya sabemos que están entregados (cache local)
                    const delivCache = _getDeliveredCache();
                    const skipped = todosParaFetch.filter(o => delivCache.has(String(o.shipping.id)));
                    const toFetch  = todosParaFetch.filter(o => !delivCache.has(String(o.shipping.id)));
                    _diagLog(`[${cuenta.nombre}] ${todosParaFetch.length} total · ${skipped.length} en cache (saltados) · ${toFetch.length} a fetchear`);
                    prog.total += toFetch.length; notifyProg();

                    const bats = [];
                    for (let i = 0; i < toFetch.length; i += BSIZ)
                        bats.push(toFetch.slice(i, i + BSIZ));
                    _diagLog(`[${cuenta.nombre}] ${toFetch.length} shipments → ${bats.length} batches × ${BSIZ}, BCONC=${BCONC}`);
                    let bi = 0;
                    async function bw() {
                        while (bi < bats.length) {
                            const batIdx = bi;
                            const bat = bats[bi++];
                            const ids = bat.map(o => o.shipping.id);
                            const t0 = Date.now();
                            try {
                                const ctrl = new AbortController();
                                const tid  = setTimeout(() => {
                                    _diagLog(`⚠️ TIMEOUT batch ${batIdx+1}/${bats.length} [${cuenta.nombre}] (15s)`);
                                    ctrl.abort();
                                }, 15000);
                                const r = await fetch(
                                    `${cuenta.proxy}/api/shipments?ids=${ids.join(',')}`,
                                    { headers: { Authorization: `Bearer ${token}` }, signal: ctrl.signal }
                                );
                                clearTimeout(tid);
                                const ms = Date.now() - t0;
                                if (r.ok) {
                                    const data = await r.json();
                                    const got = (Array.isArray(data) ? data : []).filter(s => s?.id);
                                    got.forEach(s => sMap.set(s.id, s));
                                    _diagLog(`✅ batch ${batIdx+1}/${bats.length} [${cuenta.nombre}] ${got.length}/${ids.length} ok · ${ms}ms`);
                                } else {
                                    _diagLog(`⚠️ batch ${batIdx+1} HTTP ${r.status} → fallback individual [${cuenta.nombre}]`);
                                    await Promise.all(ids.map(id =>
                                        fetch(`${cuenta.proxy}/api/shipments/${id}`, { headers: { Authorization: `Bearer ${token}` } })
                                            .then(r2 => r2.ok ? r2.json() : null).catch(() => null)
                                            .then(s => { if (s?.id) sMap.set(s.id, s); })
                                    ));
                                }
                            } catch(e) {
                                _diagLog(`❌ batch ${batIdx+1} error: ${e.message} [${cuenta.nombre}]`);
                            }
                            prog.done += bat.length; notifyProg();
                        }
                    }
                    const t0fetch = Date.now();
                    await Promise.all(Array.from({ length: BCONC }, bw));
                    _diagLog(`[${cuenta.nombre}] fetch total: ${Date.now()-t0fetch}ms · encontrados en sMap: ${sMap.size}`);

                    // Guardar en cache los shipments que NO son NE (entregados, tipo incorrecto, etc.)
                    // → próxima carga los saltamos directamente
                    // IMPORTANTE: NO cachear envíos que el driver debe devolver:
                    //   status=cancelled + date_shipped + !date_delivered = "debe devolver"
                    const nuevosEntregados = toFetch
                        .map(o => sMap.get(o.shipping.id))
                        .filter(s => {
                            if (!s) return false;
                            if (s.logistic_type !== 'self_service') return true; // no es Flex → ignorar
                            if (s.status === 'delivered') return true;           // entregado ✓
                            if (s.status_history?.date_delivered) return true;   // confirmación de entrega ✓
                            // Cancelado pero NUNCA despachado → driver nunca lo tuvo → safe
                            if (s.status === 'cancelled' && !s.status_history?.date_shipped) return true;
                            // Cancelado + despachado + sin entrega = "driver debe devolver" → NO cachear
                            return false;
                        })
                        .map(s => String(s.id));
                    if (nuevosEntregados.length) {
                        _addToDeliveredCache(nuevosEntregados);
                        _diagLog(`[${cuenta.nombre}] +${nuevosEntregados.length} IDs agregados al cache de entregados`);
                    }

                    const results = [];
                    combined.forEach(order => {
                        const shipping = sMap.get(order.shipping.id);
                        if (shipping
                            && shipping.logistic_type === 'self_service'
                            && shipping.status_history?.date_shipped
                            && !shipping.status_history?.date_delivered
                            && (shipping.status === 'shipped' || shipping.status === 'not_delivered')
                        ) {
                            results.push({ order, shipping, cuentaNombre: cuenta.nombre, cuentaColor: cuenta.color });
                        }
                    });
                    // Canceladas donde el driver ya había retirado el paquete pero NO lo entregó
                    // (si tiene date_delivered = el comprador lo recibió y está haciendo devolución → ignorar)
                    canceladas.forEach(order => {
                        const shipping = sMap.get(order.shipping.id);
                        if (shipping
                            && shipping.logistic_type === 'self_service'
                            && shipping.status_history?.date_shipped
                            && !shipping.status_history?.date_delivered
                        ) {
                            shipping._canceladaDevolver = true;
                            results.push({ order, shipping, cuentaNombre: cuenta.nombre, cuentaColor: cuenta.color });
                        }
                    });
                    return results;
                } catch (e) {
                    console.error(`cargarNoEntregados ${cuenta.nombre}:`, e);
                    return [];
                }
            }));

            if (loadGeneration !== myGen) return;

            // Ahora sí resolvemos los recibidos (ya cargó en paralelo mientras pegábamos a ML)
            const recibidosIds = await recibidosPromise;
            if (loadGeneration !== myGen) return;

            const todos = [];
            cuentaResults.flat().forEach(item => {
                const sid = item.shipping.id;
                if (shippingIdsVistos.has(sid)) return;
                if (recibidosIds.has(String(sid))) return;   // ya fue recibido → excluir
                shippingIdsVistos.add(sid);
                // Filtrar por ventana de 7 días usando la fecha de OBLIGACIÓN de entrega
                const fechaEntItem = _fechaPromesa(item.shipping);
                if (fechaEntItem) {
                    const entItem = new Date(fechaEntItem); entItem.setHours(0,0,0,0);
                    if (entItem.getTime() === hoy.getTime()) {
                        // Obligación para HOY: el en-camino normal todavía está a tiempo → excluir.
                        // PERO si es reprogramado / no-entregado / con problema, SÍ se muestra.
                        const sub = (item.shipping.substatus || '').toLowerCase();
                        const esProblema = item.shipping.status === 'not_delivered' ||
                            sub.includes('reschedul') || sub.includes('delay') ||
                            sub.includes('absent') || sub.includes('returning') ||
                            sub.includes('failed') || sub.includes('out_of_delivery_area') ||
                            sub === 'stolen' || sub === 'lost' || sub === 'damaged';
                        if (!esProblema) return;
                    }
                    if (entItem.getTime() < desde.getTime()) return;   // más viejo que 7d → excluir
                } else if (item.shipping._canceladaDevolver) {
                    // Canceladas sin fecha estimada (ML la borra): usar date_shipped como referencia
                    const dateShipped = item.shipping.status_history?.date_shipped;
                    if (!dateShipped) return;
                    const shippedDate = new Date(dateShipped); shippedDate.setHours(0,0,0,0);
                    if (shippedDate.getTime() < desde.getTime()) return;
                }
                todos.push(item);
            });

            // Garantizar fecha en todos los items (cancelados sin fecha estimada → date_shipped)
            todos.forEach(_asegurarFecha);

            // Ordenar de más viejo a más nuevo (fecha de obligación ascendente)
            todos.sort((a, b) => _fechaPromesa(a.shipping).localeCompare(_fechaPromesa(b.shipping)));

            // Exponer todos globalmente para que el escáner pueda encontrar items
            window._neTodos = todos;

            // Guardar en caché localStorage y renderizar (datos frescos de ML)
            _saveNECache(todos);
            window._neEsFresco = true;
            _renderNEItems(todos);

            // Auto-registro en Google Sheets (en background, no bloquea el render)
            _syncReclamosEnBackground(todos);

        }

        function _compararEnviosFlexConActivos(todosActivos) {
            // Solo mostrar lo que ya tiene #ID en el sheet de reclamos
            // (los nuevos desaparecidos se detectan día a día con compararConGuardado)
            const EXCLUIR    = new Set(['recibido', 'archivado', 'entregado']);
            const idsActivos = new Set(todosActivos.map(t => String(t.shipping.id)));
            const archivados = _getArchivados();
            const recibidos  = window._neRecibidosIds || new Set();
            const cancelados = [];

            window._reclamosMap?.forEach((rec, sid) => {
                if (rec.tipo !== 'driver_devolver') return;
                if (EXCLUIR.has(rec.estado)) return;
                if (archivados.has(sid)) return;
                if (idsActivos.has(sid)) return;   // sigue activo en ML → no mostrar acá
                if (recibidos.has(sid)) return;    // ya entregado → no mostrar
                cancelados.push({
                    id: sid, order_id: rec.orderId || '', zona: rec.zona || '',
                    calle: '', ciudad: '', destinatario: rec.comprador || '',
                    cuenta: rec.cuenta || '', fecha_entrega: '',
                    _reclamoId: rec.id, _valor: rec.valor || 0, _estado: rec.estado || '',
                    tipo: rec.tipo,
                });
            });

            if (cancelados.length > 0) mostrarCanceladosADevolver(cancelados);
        }

        // ── Cache local de reclamos (localStorage) ───────────────────────────
        function _saveReclamosCache(map) {
            try {
                const arr = [];
                map.forEach((v, k) => arr.push([k, v]));
                localStorage.setItem('_reclamosCache', JSON.stringify({ ts: Date.now(), data: arr }));
            } catch(e) {}
        }
        function _loadReclamosCache() {
            try {
                const raw = localStorage.getItem('_reclamosCache');
                if (!raw) return null;
                const p = JSON.parse(raw);
                if (!p?.data || Date.now() - p.ts > 30 * 60 * 1000) return null; // max 30 min
                return new Map(p.data);
            } catch(e) { return null; }
        }
        function _loadReclamosCacheAny() {
            // Igual que _loadReclamosCache pero sin límite de tiempo — para pre-render rápido
            try {
                const raw = localStorage.getItem('_reclamosCache');
                if (!raw) return null;
                const p = JSON.parse(raw);
                if (!p?.data) return null;
                return new Map(p.data);
            } catch(e) { return null; }
        }

        async function _syncReclamosEnBackground(todos) {
            try {
                // 0. Cargar desde caché local instantáneamente (antes del fetch)
                if (!window._reclamosMap?.size) {
                    const cached = _loadReclamosCache();
                    if (cached) {
                        window._reclamosMap = cached;
                        _aplicarReclamosAlDOM(); // muestra #IDs y estados visualmente
                    }
                }

                // 1. Traer todos los reclamos existentes del sheet
                const res = await _gasReclamo({ action: 'get_reclamos' });
                if (res?.records) {
                    window._reclamosMap = new Map(res.records.map(r => [r.shippingId, r]));
                    _saveReclamosCache(window._reclamosMap);
                    // Sincronizar localStorage: quitar archivados que el sheet ya no tiene como archivado
                    const localArch = _getArchivados();
                    let changed = false;
                    localArch.forEach(sid => {
                        const rec = window._reclamosMap.get(sid);
                        if (!rec || rec.estado !== 'archivado') { localArch.delete(sid); changed = true; }
                    });
                    if (changed) _saveArchivados(localArch);
                }

                // 2. Identificar items que necesitan registrarse
                const hoySync = new Date(); hoySync.setHours(0,0,0,0);
                const nuevos = todos.filter(t => {
                    const sid = String(t.shipping.id);
                    if (window._reclamosMap.has(sid)) return false; // ya registrado
                    if (t.shipping._canceladaDevolver) return true;  // driver debe devolver → siempre
                    // Demorados: recién al 2º día HÁBIL de atraso (no cuenta sáb/dom).
                    // Ej: reprogramado viernes → no asigna sáb/dom/lun; recién el martes.
                    const fechaEnt = t.shipping.shipping_option?.estimated_delivery_time?.date
                                  || t.shipping.shipping_option?.estimated_delivery_final?.date;
                    if (!fechaEnt) return false;
                    const entrega  = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                    return _diasHabilesEntre(entrega, hoySync) >= 2;
                });

                // 3. Registrar cada uno (secuencial para no saturar GAS)
                for (const item of nuevos) {
                    const sid  = String(item.shipping.id);
                    const fechaEnt2 = item.shipping.shipping_option?.estimated_delivery_time?.date
                                   || item.shipping.shipping_option?.estimated_delivery_final?.date;
                    const entrega2  = fechaEnt2 ? new Date(fechaEnt2) : null;
                    entrega2?.setHours(0,0,0,0);
                    const habiles2  = entrega2 ? _diasHabilesEntre(entrega2, hoySync) : 0;
                    const tipo = item.shipping._canceladaDevolver ? 'driver_devolver' : 'demorado';
                    const data = await _gasReclamo({
                        action:     'add_reclamo',
                        shippingId: sid,
                        fechaEstimada: fechaEnt2 ? new Date(fechaEnt2).toISOString().split('T')[0] : '',
                        orderId:    String(item.order?.id || ''),
                        comprador:  item.order?.buyer?.nickname || '',
                        zona:       item.shipping._zona || (typeof getZonaDetallada === 'function'
                            ? getZonaDetallada(
                                item.shipping.receiver_address?.neighborhood?.name || '',
                                item.shipping.receiver_address?.city?.name || '',
                                item.shipping.receiver_address?.zip_code || '')
                            : item.shipping.receiver_address?.city?.name || ''),
                        cuenta:     item.cuentaNombre || '',
                        tipo,
                        valor:      Math.round(item.order?.total_amount || 0),
                        notas:      tipo === 'demorado' ? `${habiles2}d hábiles de atraso` : '',
                    });
                    if (data?.ok && data?.record) {
                        window._reclamosMap.set(sid, data.record);
                        // Actualizar el badge #ID en el DOM si la tarjeta ya está visible
                        const el = document.getElementById('recid-' + sid);
                        if (el) {
                            el.textContent = data.record.id;
                            el.style.display = 'inline';
                        }
                    }
                }

                // 3.5 Inyectar reclamos "huérfanos": reclamos pendientes que ML ya
                //     no devuelve (p.ej. pasaron +7 días) pero siguen sin resolver.
                //     Se muestran HASTA que se marquen recibido o archivado.
                const huerfanos = _construirHuerfanos(window._neTodos || todos);
                if (huerfanos.length) {
                    const base = window._neTodos || todos;
                    window._neTodos = [...huerfanos, ...base];
                    _renderNEItems(window._neTodos, { fromCache: !window._neEsFresco });
                }

                // 4. Reflejar en DOM
                _aplicarReclamosAlDOM();

                // 5. Chequeo automático: ¿algún huérfano ya fue ENTREGADO al cliente?
                //    (ML ya no lo lista; verificamos su estado real y lo archivamos solo)
                _verificarEntregadosAuto(huerfanos);

            } catch(e) {
                console.warn('[reclamos] sync error:', e.message);
            }
        }

        // Parsea fechas en formato ISO o con barras, resolviendo la ambigüedad
        // día/mes (Argentina dd/MM vs US MM/dd). Como estos paquetes están
        // SIEMPRE vencidos, se elige la interpretación que cae en el pasado.
        function _parseFechaFlexible(s) {
            if (!s) return null;
            s = String(s).trim();
            // ISO puro (yyyy-mm-dd...) → sin ambigüedad
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
                const d = new Date(s);
                return isNaN(d) ? null : d;
            }
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2}))?/);
            if (m) {
                const a = +m[1], b = +m[2], y = +m[3], hh = +(m[4] || 12), mm = +(m[5] || 0);
                const limite = Date.now() + 2 * 86400000; // tolerancia 2 días
                const dDM = new Date(y, b - 1, a, hh, mm);   // interpretar como dd/MM (argentino)
                const dMD = (a >= 1 && a <= 12) ? new Date(y, a - 1, b, hh, mm) : null; // como MM/dd (US)
                const dmOk = !isNaN(dDM);
                const mdOk = dMD && !isNaN(dMD);
                // Preferimos dd/MM (argentino); pero si cae en futuro y MM/dd es pasado, usamos MM/dd
                if (dmOk && dDM.getTime() > limite && mdOk && dMD.getTime() <= limite) return dMD;
                if (dmOk) return dDM;
                if (mdOk) return dMD;
            }
            const d2 = new Date(s);
            return isNaN(d2) ? null : d2;
        }

        // Corrige fechas futuras: un paquete vencido / a devolver NO puede tener
        // fecha futura. Si la tiene, casi siempre es un día/mes invertido (US vs AR)
        // → se intercambian y, si eso lo vuelve pasado, se usa esa fecha.
        function _corregirFechaFutura(item) {
            const so = item.shipping?.shipping_option;
            const cur = so?.estimated_delivery_time?.date || so?.estimated_delivery_final?.date;
            if (!cur) return;
            const d = new Date(cur);
            const limite = Date.now() + 2 * 86400000;
            if (isNaN(d) || d.getTime() <= limite) return;   // ya es pasada/hoy → ok
            // Intentar primero date_shipped real (ML)
            const ds = item.shipping.status_history?.date_shipped;
            if (ds) { const dd = new Date(ds); if (!isNaN(dd) && dd.getTime() <= limite) { so.estimated_delivery_time = { date: dd.toISOString() }; delete so.estimated_delivery_final; return; } }
            // Intercambiar día/mes (sólo si el día actual es válido como mes ≤ 12)
            if (d.getDate() <= 12) {
                const sw = new Date(d.getFullYear(), d.getDate() - 1, d.getMonth() + 1, 12, 0);
                if (!isNaN(sw) && sw.getTime() <= limite) {
                    so.estimated_delivery_time = { date: sw.toISOString() };
                    delete so.estimated_delivery_final;
                }
            }
        }

        // Cuenta días hábiles (lun–vie) entre dos fechas, sin contar la inicial.
        // Ej: viernes → martes = 2 (lunes y martes); viernes → lunes = 1.
        function _diasHabilesEntre(d1, d2) {
            const cur = new Date(d1); cur.setHours(0, 0, 0, 0);
            const end = new Date(d2); end.setHours(0, 0, 0, 0);
            let count = 0;
            while (cur < end) {
                cur.setDate(cur.getDate() + 1);
                const dow = cur.getDay();
                if (dow !== 0 && dow !== 6) count++;
            }
            return count;
        }

        // Parsea una fecha y corrige día/mes invertido si cae en el futuro → Date|null
        function _fechaSegura(s) {
            let d = _parseFechaFlexible(s);
            if (!d || isNaN(d)) return null;
            const lim = Date.now() + 2 * 86400000;
            if (d.getTime() > lim && d.getDate() <= 12) {
                const sw = new Date(d.getFullYear(), d.getDate() - 1, d.getMonth() + 1, d.getHours(), d.getMinutes());
                if (!isNaN(sw) && sw.getTime() <= lim) d = sw;
            }
            return d;
        }

        // Garantiza que un item tenga fecha estimada: usa date_shipped y, como
        // último recurso, la fecha del reclamo (fechaEstimada / fechaAlta del sheet).
        function _asegurarFecha(item) {
            const so = item.shipping.shipping_option || (item.shipping.shipping_option = {});
            if (so.estimated_delivery_time?.date || so.estimated_delivery_final?.date) return;
            const ds = item.shipping.status_history?.date_shipped;
            if (ds) { so.estimated_delivery_time = { date: ds }; return; }
            const rec = window._reclamosMap?.get(String(item.shipping.id));
            const f = _parseFechaFlexible(rec?.fechaEstimada || rec?.fechaAlta);
            if (f) so.estimated_delivery_time = { date: f.toISOString() };
        }

        // Construye items sintéticos a partir de reclamos sin resolver que NO
        // están ya en la lista de ML (para que sigan visibles hasta archivar).
        function _construirHuerfanos(todosActuales) {
            if (!window._reclamosMap) return [];
            const EXCLUIR   = new Set(['recibido', 'archivado', 'entregado']);
            const presentes = new Set((todosActuales || []).map(t => String(t.shipping.id)));
            const arch      = _getArchivados();
            const recibidos = window._neRecibidosIds || new Set();
            const out = [];
            window._reclamosMap.forEach((rec, sid) => {
                const s = String(sid);
                if (EXCLUIR.has(rec.estado)) return;
                if (presentes.has(s) || arch.has(s) || recibidos.has(s)) return;
                // Fecha del reclamo (ya guardada en el sheet) → nunca "sin fecha"
                const fRec = _parseFechaFlexible(rec.fechaEstimada || rec.fechaAlta);
                const shipOpt = fRec ? { estimated_delivery_time: { date: fRec.toISOString() } } : {};
                out.push({
                    shipping: {
                        id: s,
                        status: 'not_delivered',
                        substatus: '',
                        logistic_type: 'self_service',
                        _canceladaDevolver: rec.tipo === 'driver_devolver',
                        _zonaForce: rec.zona || '',
                        _esHuerfano: true,
                        receiver_address: {},
                        shipping_option: shipOpt,
                        status_history: {},
                    },
                    order: { id: rec.orderId || '', total_amount: rec.valor || 0, buyer: { nickname: rec.comprador || '' } },
                    cuentaNombre: rec.cuenta || '',
                });
            });
            return out;
        }

        // Verifica en ML si algún huérfano ya fue ENTREGADO al cliente.
        // Si sí → lo marca 'entregado' (se archiva solo, sin descontar).
        async function _verificarEntregadosAuto(huerfanos) {
            if (!huerfanos || !huerfanos.length || typeof CUENTAS === 'undefined') return;
            const entregados = [];
            for (const h of huerfanos) {
                try {
                    const cuenta = CUENTAS.find(c => c.nombre === h.cuentaNombre) || CUENTAS[0];
                    if (!cuenta) continue;
                    const token = await obtenerTokenCuenta(cuenta).catch(() => null);
                    if (!token) continue;
                    const r = await fetch(`${cuenta.proxy}/api/shipments/${h.shipping.id}`,
                        { headers: { Authorization: `Bearer ${token}` } });
                    if (!r.ok) continue;
                    const s = await r.json();
                    const fueEntregado = s?.status === 'delivered' || !!s?.status_history?.date_delivered;
                    if (fueEntregado) {
                        const sid = String(h.shipping.id);
                        entregados.push(sid);
                        const rec = window._reclamosMap?.get(sid);
                        if (rec) rec.estado = 'entregado';
                        _gasReclamo({ action: 'update_reclamo', shippingId: sid, estado: 'entregado' }).catch(() => {});
                    }
                } catch(e) {}
            }
            if (entregados.length) {
                _saveReclamosCache(window._reclamosMap);
                window._neTodos = (window._neTodos || []).filter(t => !entregados.includes(String(t.shipping.id)));
                _renderNEItems(window._neTodos, { fromCache: !window._neEsFresco });
                _aplicarReclamosAlDOM();
                _showNEToast(`📬 ${entregados.length} ya entregado${entregados.length > 1 ? 's' : ''} → archivado solo`);
            }
        }

        function _aplicarReclamosAlDOM() {
            window._reclamosMap?.forEach((rec, sid) => {
                // Ocultar si está archivado
                if (rec.estado === 'archivado') {
                    const card = document.querySelector(`.ne-mini-card[data-sid="${sid}"]`);
                    if (card) card.remove();
                    return;
                }
                // Badge #ID
                const el = document.getElementById('recid-' + sid);
                if (el) {
                    if (!el.textContent || el.dataset.lastId !== rec.id) {
                        el.textContent = rec.id;
                        el.style.display = 'inline';
                        el.dataset.lastId = rec.id;
                    }
                }
                // Visual en_deposito: borde ámbar + ícono 📦
                const card = document.querySelector(`.ne-mini-card[data-sid="${sid}"]`);
                if (card && rec.estado === 'en_deposito') {
                    card.style.borderLeftColor = '#ffa040';
                    card.classList.add('ne-mini-deposito');
                    card.classList.remove('ne-mini-cancelada');
                    const icon = card.querySelector('.ne-devolver-icon');
                    if (icon) icon.textContent = '📦';
                }
                // Monto: tachado si descontado
                const valEl = document.getElementById('recval-' + sid);
                if (valEl) {
                    if (rec.estado === 'descontado' || rec.estado === 'en_deposito') {
                        valEl.style.color = '#555';
                        valEl.style.textDecoration = 'line-through';
                        if (!valEl.textContent.includes('✅')) valEl.textContent += ' ✅';
                    } else {
                        valEl.style.color = '#3fb950';
                        valEl.style.textDecoration = '';
                    }
                }
            });
        }

                if (!groups.has(gKey)) groups.set(gKey, { label: gLabel, atraso: gAtraso, color: gColor, items: [] });

            // ── Función de render con filtro ──────────────────────────────
            window._neCurrentFilter = 'all';
            function renderNECards(filterKey) {

                // ── Funciones globales para compartir ─────────────────────
                window._compartirDevolver = function(idx, event) {
                    if (event) event.stopPropagation();
