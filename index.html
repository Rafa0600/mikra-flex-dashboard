<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envíos FLEX - Mikra + Chaya</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Envíos Flex">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            padding: 8px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #FFE600;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        .info-badges {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .info-badge {
            background: #161b22;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            border: 1.5px solid #30363d;
            backdrop-filter: blur(8px);
        }

        .info-badge.fecha {
            background: linear-gradient(135deg, #FF6B00, #e85d04);
            border-color: transparent;
        }

        .info-badge.caba {
            background: linear-gradient(135deg, #9C27B0, #7b1fa2);
            border-color: transparent;
        }

        .info-badge.provincia {
            background: linear-gradient(135deg, #00897B, #00695c);
            border-color: transparent;
        }

        .top-buttons {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tools-panel {
            display: none;
            animation: slideDown 0.25s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tools-panel.open {
            display: block;
        }

        /* ── PIN modal ── */
        @keyframes pinShake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-6px); }
            80%      { transform: translateX(6px); }
        }
        .pin-key {
            background: #21262d;
            border: 1.5px solid #30363d;
            color: #e6edf3;
            font-size: 22px;
            font-weight: 700;
            border-radius: 12px;
            width: 72px;
            height: 56px;
            cursor: pointer;
            touch-action: manipulation;
            transition: background .12s;
            font-family: inherit;
        }
        .pin-key:active { background: #3d444d; }

        /* ── NE drawer ── */
        #neMasDrawer {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #161b22;
            border-radius: 20px 20px 0 0;
            padding: 8px 16px 28px;
            z-index: 5000;
            border-top: 1px solid #30363d;
            animation: slideUp .22s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        #neMasOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 4999;
        }
        .ne-drawer-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: #e6edf3;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
            margin-bottom: 8px;
            text-align: left;
        }
        .ne-drawer-btn:active { background: #2d333b; }

        button {
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
            touch-action: manipulation;
            min-height: 44px;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        button.btn-warning {
            background: linear-gradient(135deg, #FF9800, #e68900);
        }

        .filter-section {
            background: #161b22;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 1px solid #21262d;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-row label {
            color: #FFE600;
            font-weight: 700;
            font-size: 13px;
        }

        .search-select-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input-select {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: #0d1117;
            border: 1.5px solid #30363d;
            border-radius: 10px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }

        .search-input-select:focus {
            outline: none;
            border-color: #FFE600;
            box-shadow: 0 0 0 3px rgba(255, 230, 0, 0.15);
        }

        .dropdown-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #484f58;
            pointer-events: none;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #161b22;
            border: 1.5px solid #FFE600;
            border-radius: 12px;
            margin-top: 5px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .dropdown-menu.active {
            display: block;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-search {
            position: sticky;
            top: 0;
            background: #161b22;
            padding: 10px;
            border-bottom: 1px solid #21262d;
        }

        .dropdown-search input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1.5px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
            min-height: 44px;
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .dropdown-item:hover, .dropdown-item:active {
            background: #21262d;
        }

        .dropdown-item.selected {
            background: #3483FA;
        }

        .stats-bar {
            background: #161b22;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #21262d;
            overflow: visible;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .stat-item {
            text-align: center;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-item:hover {
            background: #21262d;
        }

        .stat-item:active {
            transform: scale(0.95);
        }

        .stat-item.active {
            background: linear-gradient(135deg, #3483FA, #2563eb);
            border-color: rgba(52, 131, 250, 0.4);
            box-shadow: 0 4px 12px rgba(52, 131, 250, 0.2);
        }

        /* Filtro rápido por cuenta */
        .cuenta-filter {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .cuenta-btn {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            background: #21262d;
            border: 2px solid transparent;
            color: #8b949e;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 40px;
            touch-action: manipulation;
        }

        .cuenta-btn:hover { filter: brightness(1.1); }
        .cuenta-btn:active { transform: scale(0.95); }

        .cuenta-btn.all.active {
            border-color: #FFE600;
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
        }

        .cuenta-btn.mikra-btn.active {
            background: linear-gradient(135deg, #9C27B0, #7b1fa2);
            border-color: #ce93d8;
            color: white;
        }

        .cuenta-btn.chaya-btn.active {
            background: linear-gradient(135deg, #FF6B00, #e85d04);
            border-color: #ffab40;
            color: white;
        }

        .cuenta-separator {
            color: #30363d;
            font-size: 20px;
            user-select: none;
        }

        .cuenta-btn.canceladas-toggle {
            background: #1c1215;
            border: 2px solid #3d1a1a;
            color: #f85149;
        }

        .cuenta-btn.canceladas-toggle:hover {
            border-color: #f85149;
        }

        .cuenta-btn.canceladas-toggle.active {
            background: #f85149;
            border-color: #ff7b72;
            color: white;
            box-shadow: 0 4px 12px rgba(248, 81, 73, 0.3);
        }

        .cuenta-btn.canceladas-toggle span {
            background: #f85149;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 4px;
        }

        .cuenta-btn.canceladas-toggle.active span {
            background: rgba(255,255,255,0.25);
        }

        .cuenta-count {
            background: rgba(255,255,255,0.15);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 4px;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 3px;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 10px;
            color: #8b949e;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .progress-bar-container {
            background: #0d1117;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            display: flex;
            position: relative;
        }

        .progress-segment {
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .progress-segment:active {
            opacity: 0.7;
        }

        .progress-segment.pendiente { background: linear-gradient(90deg, #9C27B0, #8e24aa); }
        .progress-segment.impreso { background: linear-gradient(90deg, #1565C0, #1E88E5); }
        .progress-segment.en-camino { background: linear-gradient(90deg, #00d9ff, #00b8d4); color: #000; }
        .progress-segment.entregado { background: linear-gradient(90deg, #00ff88, #00e676); color: #000; }
        .progress-segment.cancelado { background: linear-gradient(90deg, #f85149, #da3633); }

        .progress-segment.reprogramado { background: linear-gradient(90deg, #FF9800, #f57c00); color: #000; }

        .sort-controls {
            background: #0d1117;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            border: 1px solid #21262d;
        }

        .sort-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-family: inherit;
            background: #21262d;
            border-radius: 10px;
            min-height: 38px;
        }

        .sort-btn.active {
            background: #FFE600;
            color: #000;
            font-weight: 700;
        }

        .envio-card {
            background: #161b22;
            border-left: 4px solid;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            border: 1px solid #21262d;
            border-left-width: 4px;
        }

        .envio-card:hover {
            background: #1c2128;
        }

        .envio-card.pendiente { border-left-color: #9C27B0; }
        .envio-card.impreso { border-left-color: #1E88E5; }
        .envio-card.en-camino { border-left-color: #00d9ff; }
        .envio-card.entregado { border-left-color: #00ff88; }
        .envio-card.cancelado { border-left-color: #f85149; opacity: 0.7; }

        .envio-card.reprogramado { border-left-color: #FF9800; }

        .envio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .estado-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        .estado-badge.pendiente { background: linear-gradient(135deg, #9C27B0, #7b1fa2); }
        .estado-badge.impreso { background: linear-gradient(135deg, #1E88E5, #1565C0); }
        .estado-badge.en-camino { background: linear-gradient(135deg, #00d9ff, #00b8d4); color: #000; }
        .estado-badge.entregado { background: linear-gradient(135deg, #00ff88, #00e676); color: #000; }
        .estado-badge.cancelado { background: linear-gradient(135deg, #f85149, #da3633); }

        .estado-badge.reprogramado { background: linear-gradient(135deg, #FF9800, #f57c00); color: #000; }

        .envio-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .info-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .info-label {
            color: #8b949e;
            font-size: 10px;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #e6edf3;
            font-size: 13px;
            font-weight: 500;
        }

        .zona-highlight {
            font-size: 14px;
            font-weight: 700;
            color: #FFE600;
        }

        .direccion-link, .order-link {
            color: #58a6ff;
            text-decoration: none;
            transition: all 0.2s;
        }

        .direccion-link:hover, .order-link:hover {
            color: #FFE600;
        }

        .timeline {
            background: #0d1117;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #21262d;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            position: relative;
        }

        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 25px;
            width: 2px;
            height: calc(100% - 8px);
            background: #21262d;
        }

        .timeline-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            z-index: 1;
            transition: all 0.3s;
        }

        .timeline-dot.done {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .timeline-dot.pending {
            background: #21262d;
            border: 2px solid #30363d;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-label {
            color: #8b949e;
            font-size: 12px;
        }

        .timeline-time {
            color: #00ff88;
            font-weight: 700;
            font-size: 13px;
        }

        .timeline-time.pending {
            color: #484f58;
        }

        /* TRACKING DETALLADO */
        .tracking-detail {
            background: #0d1117;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
            border-left: 3px solid #58a6ff;
            border: 1px solid #21262d;
            border-left: 3px solid #58a6ff;
        }

        .tracking-event {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 4px 0;
            font-size: 12px;
            color: #8b949e;
        }

        .tracking-event .track-icon {
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 4px;
        }

        .tracking-event .track-icon.shipped { background: #00d9ff; box-shadow: 0 0 6px rgba(0,217,255,0.3); }
        .tracking-event .track-icon.near { background: #FFE600; box-shadow: 0 0 6px rgba(255,230,0,0.3); }
        .tracking-event .track-icon.absent { background: #f85149; box-shadow: 0 0 6px rgba(248,81,73,0.3); }
        .tracking-event .track-icon.retry { background: #FF9800; box-shadow: 0 0 6px rgba(255,152,0,0.3); }
        .tracking-event .track-icon.delivered { background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.3); }
        .tracking-event .track-icon.default { background: #484f58; }

        .tracking-event .track-time {
            color: #484f58;
            font-size: 11px;
            min-width: 40px;
        }

        .tracking-event .track-msg {
            flex: 1;
        }

        .tracking-event.highlight-absent {
            color: #f85149;
            font-weight: 700;
        }

        .tracking-event.highlight-near {
            color: #FFE600;
        }

        .driver-info {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #0d2137;
            color: #58a6ff;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .reputation-warning {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f85149;
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            animation: pulse-rep 2s infinite;
        }

        @keyframes pulse-rep {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .reputation-ok {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #0d2d15;
            color: #56d364;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            font-size: 15px;
            color: #FFE600;
            font-weight: 500;
        }

        .loading-spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #21262d;
            border-top-color: #FFE600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Barra de progreso de carga */
        .load-progress-wrap {
            margin: 16px auto 0;
            max-width: 320px;
        }
        .load-progress-track {
            background: #21262d;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            margin-bottom: 6px;
            position: relative;
        }
        .load-progress-fill {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #FFE600, #ff9800);
            transition: width 0.2s ease-out;
            width: 0%;
        }
        .load-progress-pct {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
            color: #e6edf3;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            white-space: nowrap;
        }
        .load-progress-text {
            font-size: 11px;
            color: #484f58;
            font-weight: 400;
        }

        .error {
            background: linear-gradient(135deg, #f85149, #da3633);
            color: white;
            padding: 20px;
            border-radius: 14px;
            margin: 15px 0;
            text-align: center;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #484f58;
            font-size: 15px;
        }

        .fecha-hoy {
            color: #ff6b00;
            font-weight: 700;
        }

        .items-count {
            background: #FFE600;
            color: #000;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
        }

            color: #000;

        }

        .map-filter-btn.active-reprogramado {
            background: #FF9800;
            color: #000;

        /* Scrollbar personalizado */

        ::-webkit-scrollbar-track { background: #0d1117; }

        /* ── Geo-stats inline (top bar) — chips de colores ── */
        #geoInline {
            display: flex;
            gap: 4px;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .geo-chip.prov { background: rgba(230,81,0,0.12);  border-color: rgba(230,81,0,0.3);   color: #ffab76; }

        .geo-chip { cursor: pointer; transition: all 0.15s; user-select: none; -webkit-user-select: none; }
        .geo-chip:active { transform: scale(0.94); }

        /* ── Stat icon row ── */
        .stat-icon {
            font-size: 12px;

            margin-bottom: 1px;

        /* ── Sort toggle ── */

            width: 100%;

        /* ── Map filter buttons — radio style ── */

        /* ── Navegación de días ── */
        .date-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 14px;
            padding: 8px 10px;
            margin-bottom: 10px;
        }
        .date-nav-arrow {
            background: #21262d;
            border: none;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 16px;

            height: 36px;

            justify-content: center;

        .date-nav-arrow:hover { background: #30363d; filter: none; transform: none; }
        .date-nav-arrow:active { background: #FFE600; color: #000; transform: scale(0.94); }
        .date-nav-days {
            display: flex;
            gap: 5px;
            flex: 1;

            -ms-overflow-style: none;
            justify-content: center;

        .date-nav-days::-webkit-scrollbar { display: none; }

            flex-shrink: 0;
            background: transparent;
            border: 1.5px solid #30363d;
            border-radius: 10px;
            color: #8b949e;
            font-size: 11px;
            font-weight: 700;
            font-family: inherit;

            min-height: unset;

            align-items: center;
            justify-content: center;
            line-height: 1.2;
            touch-action: manipulation;
        }
        .date-nav-day:hover { border-color: #484f58; color: #e6edf3; background: #21262d; filter: none; transform: none; }
        .date-nav-day.active { background: #FFE600; border-color: #FFE600; color: #000; box-shadow: 0 2px 10px rgba(255,230,0,0.25); }
        .date-nav-day .day-name { font-size: 10px; font-weight: 700; }
        .date-nav-day .day-date { font-size: 9px; opacity: 0.7; }
        .date-nav-input-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .date-nav-input-btn {
            background: #21262d;
            border: 1.5px solid #30363d;
            border-radius: 8px;
            color: #8b949e;
            font-size: 16px;
            width: 36px;
            height: 36px;
            min-height: unset;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .date-nav-input-btn:hover { border-color: #484f58; color: #e6edf3; filter: none; transform: none; }
        .date-nav-input-hidden {
            position: absolute;
            top: 0; left: 0;
            width: 36px; height: 36px;
            opacity: 0;
            cursor: pointer;
        }

        /* ── Cards rediseñadas ── */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .card-meta-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .card-address-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 12px;
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #21262d;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .card-address-row a { color: #58a6ff; text-decoration: none; }
        .card-address-row a:hover { color: #FFE600; }
        .card-sep { color: #30363d; flex-shrink: 0; user-select: none; }
        .card-comprador { color: #8b949e; }
        .card-comprador strong { color: #e6edf3; }

        /* Timeline unificado */
        .unified-timeline { display: flex; flex-direction: column; }
        .utl-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 4px 0;
            position: relative;
            font-size: 12px;
        }
        .utl-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 6px; top: 18px;
            width: 2px; bottom: -4px;
            background: #21262d;
        }
        .utl-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            flex-shrink: 0; margin-top: 1px; z-index: 1;
        }
        .utl-dot.c-green  { background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.35); }
        .utl-dot.c-blue   { background: #00d9ff; box-shadow: 0 0 6px rgba(0,217,255,0.35); }
        .utl-dot.c-yellow { background: #FFE600; box-shadow: 0 0 6px rgba(255,230,0,0.35); }
        .utl-dot.c-red    { background: #f85149; box-shadow: 0 0 6px rgba(248,81,73,0.35); }
        .utl-dot.c-orange { background: #FF9800; box-shadow: 0 0 6px rgba(255,152,0,0.35); }
        .utl-dot.c-gray   { background: #484f58; }
        .utl-dot.c-pending { background: #21262d; border: 2px solid #30363d; }
        .utl-time { font-weight: 700; font-size: 11px; min-width: 52px; white-space: nowrap; }
        .utl-time.t-green  { color: #00ff88; }
        .utl-time.t-blue   { color: #00d9ff; }
        .utl-time.t-yellow { color: #FFE600; }
        .utl-time.t-red    { color: #f85149; }
        .utl-time.t-orange { color: #FF9800; }
        .utl-time.t-muted  { color: #484f58; font-weight: 400; }
        .utl-label { color: #8b949e; flex: 1; line-height: 1.4; }
        .utl-label strong { color: #e6edf3; font-weight: 600; }
    </style>

            document.getElementById('qrStatus').textContent = 'Iniciando cámara...';
            document.getElementById('qrLiveWrap').style.display  = 'none';
            document.getElementById('qrPhotoWrap').style.display = 'none';
            if (!navigator.mediaDevices?.getUserMedia) {
                _mostrarFallbackFoto();
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } })
                .then(stream => {
                    _qrStream = stream;
                    const video = document.getElementById('qrVideo');
                    video.srcObject = stream;
                    video.play();
                    document.getElementById('qrLiveWrap').style.display = 'block';
                    document.getElementById('qrStatus').textContent = 'Buscando QR...';
                    _tickQR(video);
                })
                .catch(() => _mostrarFallbackFoto());

        function _mostrarFallbackFoto() {
            document.getElementById('qrLiveWrap').style.display  = 'none';
            document.getElementById('qrPhotoWrap').style.display = 'block';
            document.getElementById('qrStatus').textContent = '';
        }

        function _tickQR(video) {
            if (video.readyState >= 2 && video.videoWidth > 0) {
                const canvas = document.getElementById('qrCanvas');
                canvas.width  = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx  = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
                if (code) { cerrarEscaner(); _procesarQREscaneado(code.data); return; }
            }
            _qrRaf = requestAnimationFrame(() => _tickQR(video));
        }

        function cerrarEscaner() {
            if (_qrStream) { _qrStream.getTracks().forEach(t => t.stop()); _qrStream = null; }
            if (_qrRaf)    { cancelAnimationFrame(_qrRaf); _qrRaf = null; }
            const modal = document.getElementById('qrModal');
            if (modal) modal.style.display = 'none';
            document.getElementById('qrFileInput').value = '';
        }

        function _onQRFileSelected(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            document.getElementById('qrStatus').textContent = 'Leyendo QR...';
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = function() {
                const canvas = document.getElementById('qrCanvas');
                const MAX = 1200;
                let w = img.naturalWidth, h = img.naturalHeight;
                if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                URL.revokeObjectURL(url);
                const imgData = ctx.getImageData(0, 0, w, h);
                const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
                if (code) { cerrarEscaner(); _procesarQREscaneado(code.data); }
                else { document.getElementById('qrStatus').textContent = '⚠️ No se encontró QR. Intentá de nuevo más cerca.'; }
            };
            img.onerror = function() { URL.revokeObjectURL(url); document.getElementById('qrStatus').textContent = '❌ Error al leer la imagen.'; };
            img.src = url;
        }

            const hoy = new Date();

            let diasAtras = 1; // Por defecto ayer
            
            // Si hoy es domingo (0), retroceder al viernes (2 días)
            if (diaSemana === 0) {
                diasAtras = 2;
            }
            // Si hoy es lunes (1), retroceder al viernes (3 días)

        async function obtenerTokenCuenta(cuenta) {
            const cached = tokenCache[cuenta.nombre];
            if (cached && Date.now() < cached.expires) return cached.token;
            try {
                const response = await fetch(`${cuenta.proxy}/get-token`);
                const data = await response.json();
                if (data.access_token) {
                    tokenCache[cuenta.nombre] = { token: data.access_token, expires: Date.now() + 4 * 60 * 1000 };
                    // Cachear user_id en sessionStorage para evitar fetch doble en cargarOrdenesDeCuenta
                    if (data.user_id) {
                        sessionStorage.setItem(`${cuenta.nombre.toLowerCase()}_user_id`, data.user_id);
                    }
                    return data.access_token;
                }
                if (data.error === 'no_token') console.error(`Token no configurado para ${cuenta.nombre}`);
                return null;
            } catch (error) {
                console.error(`Error obteniendo token de ${cuenta.nombre}:`, error);
                return null;
            }
        }

        function formatearFecha(fechaISO) {
            if (!fechaISO) return '❌';
            
            const fecha = new Date(fechaISO);
            const hoy = new Date();
            
            hoy.setHours(0, 0, 0, 0);
            fecha.setHours(0, 0, 0, 0);
            
            const diffDias = Math.floor((fecha - hoy) / (1000 * 60 * 60 * 24));
            
            if (diffDias === 0) return 'Hoy';
            if (diffDias === -1) return 'Ayer';
            if (diffDias === 1) return 'Mañana';
            
            const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const dia = dias[fecha.getDay()];
            const fechaFormato = fecha.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
            
            return `${dia} ${fechaFormato}`;
        }

        function formatearSoloHora(fechaISO, fechaEsperada = null) {
            if (!fechaISO) return null;
            const fecha = new Date(fechaISO);
            if (fechaEsperada) {
                const esperada = new Date(fechaEsperada); esperada.setHours(0,0,0,0);
                const actual = new Date(fechaISO); actual.setHours(0,0,0,0);
                if (esperada.getTime() !== actual.getTime()) {
                    const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                    return `${_fmtHora.format(fecha)} (${dias[fecha.getDay()]})`;
                }
            }
            return _fmtHora.format(fecha);
        }

        function esEntregaParaFecha(shipping, targetDate) {
            const fechaEntrega = shipping.shipping_option?.estimated_delivery_time?.date || 
                                shipping.shipping_option?.estimated_delivery_final?.date;
            
            if (!fechaEntrega) return false;
            
            const entrega = new Date(fechaEntrega);
            entrega.setHours(0, 0, 0, 0);
            
            return entrega.getTime() === targetDate.getTime();
        }

        // ══════════════════════════════════════════════════════
        //  CACHE POR DÍA (sessionStorage)
        //  - Días pasados: 60 min TTL
        //  - Hoy: 5 min TTL (se refresca en background)
        // ══════════════════════════════════════════════════════
        const CACHE_PREFIX = 'flex_v1_';
        const CACHE_TTL_TODAY   = 5  * 60 * 1000;
        const CACHE_TTL_PAST    = 60 * 60 * 1000;
        const CACHE_TTL_OLD     =  8 * 60 * 60 * 1000; // días con >24h de antigüedad no cambian

        // ── Formatters de fecha/hora reutilizables (evita recrearlos N veces) ──
        const _fmtHora = new Intl.DateTimeFormat('es-AR', {
            timeZone: 'America/Argentina/Buenos_Aires',
            hour: '2-digit', minute: '2-digit', hour12: false
        });
        const _fmtFechaCorta = new Intl.DateTimeFormat('es-AR', {
            timeZone: 'America/Argentina/Buenos_Aires',
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false
        });
        const _fmtDia = new Intl.DateTimeFormat('es-AR', { weekday: 'short' });
        const _fmtDiaMes = new Intl.DateTimeFormat('es-AR', { day: '2-digit', month: '2-digit' });

        function _cacheKey(date) {
            return CACHE_PREFIX + date.toISOString().split('T')[0];
        }

        function loadFromCache(date) {
            try {
                const raw = sessionStorage.getItem(_cacheKey(date));
                if (!raw) return null;
                const { ts, orders } = JSON.parse(raw);
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const isToday = date.toDateString() === hoy.toDateString();
                const ageMs = Date.now() - ts;
                const isOld = !isToday && (hoy - date) > 86400000; // más de 1 día atrás
                const ttl = isToday ? CACHE_TTL_TODAY : isOld ? CACHE_TTL_OLD : CACHE_TTL_PAST;
                if (ageMs > ttl) { sessionStorage.removeItem(_cacheKey(date)); return null; }
                return orders;
            } catch { return null; }
        }

        function saveToCache(date, orders) {
            try {
                // Guardar solo los campos necesarios para renderizar (no el objeto entero)
                sessionStorage.setItem(_cacheKey(date), JSON.stringify({ ts: Date.now(), orders }));
            } catch (e) {
                // sessionStorage lleno → limpiar caches viejos
                try {
                    const keys = Object.keys(sessionStorage).filter(k => k.startsWith(CACHE_PREFIX));
                    keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => sessionStorage.removeItem(k));
                    sessionStorage.setItem(_cacheKey(date), JSON.stringify({ ts: Date.now(), orders }));
                } catch {}
            }
        }

        function invalidateCache(date) {
            try { sessionStorage.removeItem(_cacheKey(date)); } catch {}
        }

        // ── Rango de fechas inteligente ─────────────────────────────
        // Va hacia atrás hasta encontrar el viernes laboral anterior
        // desde la targetDate (no desde hoy), con mínimo de 3 días
        // y máximo de 8 días de calendario. Así cubre:
        //   lunes normal → viernes (3 días)
        //   martes después de feriado lunes → viernes (4 días)
        //   martes después de fin de semana largo → viernes (4-5 días)
        function calcularDateFrom(targetDate) {
            const base = new Date(targetDate);
            base.setHours(0,0,0,0);
            // Retroceder hasta el viernes anterior desde targetDate, mínimo 3 días calendario
            let d = new Date(base);
            let calDays = 0;
            while (true) {
                d.setDate(d.getDate() - 1);
                calDays++;
                if (calDays >= 3 && d.getDay() === 5) break; // encontramos viernes, mín 3 días
                if (calDays >= 8) break; // tope de seguridad
            }
            return d;
        }

        async function cargarNoEntregados() {
            const myGen = ++loadGeneration;
            const content = document.getElementById('content');

            document.getElementById('statsSection').classList.add('hidden');
            document.getElementById('sortToggleRow').style.display = 'none';
            document.getElementById('sortSection').style.display = 'none';
            document.getElementById('btnMapa').classList.add('hidden');

            const hoy = new Date(); hoy.setHours(0,0,0,0);
            // Rango de entrega: últimos 7 días (fecha estimada de entrega, no de creación)
            const pad = n => String(n).padStart(2,'0');
            const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            const desde = new Date(hoy); desde.setDate(desde.getDate() - 7);
            const deliveryFrom = encodeURIComponent(`${fmt(desde)}T00:00:00.000-03:00`);
            const deliveryTo   = encodeURIComponent(`${fmt(hoy)}T23:59:59.000-03:00`);

            // Progreso compartido
            const prog = { done: 0, total: 0 };
            let rafPend = false;
            function notifyProg() {
                if (rafPend) return; rafPend = true;
                requestAnimationFrame(() => {
                    rafPend = false;
                    const fill = document.getElementById('neProgressFill');
                    const wrap = document.getElementById('neProgressWrap');
                    const txt  = document.getElementById('neProgressText');
                    if (!fill || !wrap || prog.total <= 0) return;
                    wrap.style.display = 'block';
                    const pct = Math.min(100, Math.round(prog.done / prog.total * 100));
                    fill.style.width = pct + '%';
                    if (txt) txt.textContent = `${pct}%`;
                });
            }

            content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>🚫 Buscando viajes sin entregar (7 días)...
                <div class="load-progress-wrap" id="neProgressWrap" style="display:none;">
                    <div class="load-progress-track">
                        <div class="load-progress-fill" id="neProgressFill"></div>
                        <div class="load-progress-pct" id="neProgressText">0%</div>
                    </div>
                    <div class="load-progress-text" id="neProgressSub"></div>
                </div></div>`;

            const shippingIdsVistos = new Set();
            const CONC = 35;

            // Pre-fetch tokens e IDs recibidos en paralelo
            const [tokens, recibidosIds] = await Promise.all([
                Promise.all(CUENTAS.map(c => obtenerTokenCuenta(c))),
                cargarRecibidosIds()
            ]);

            const cuentaResults = await Promise.all(CUENTAS.map(async (cuenta, ci) => {
                try {
                    const token = tokens[ci];
                    if (!token) return [];
                    const cuentaKey = cuenta.nombre.toLowerCase();
                    let sellerId = sessionStorage.getItem(`${cuentaKey}_user_id`);
                    if (!sellerId) {
                        const td = await fetch(`${cuenta.proxy}/get-token`).then(r=>r.json()).catch(()=>({}));
                        if (td.user_id) { sellerId = td.user_id; sessionStorage.setItem(`${cuentaKey}_user_id`, sellerId); }
                    }
                    if (!sellerId) return [];

                    // Query A: delivery date range (ML filtra server-side → mucho menos volumen)
                    // Query B: date_created últimos 10 días para capturar not_delivered que ya fallaron
                    //          (su estimated_delivery ya pasó hace más de 7 días en algún caso)
                    const filterA = `&shipping.estimated_delivery_time.from=${deliveryFrom}&shipping.estimated_delivery_time.to=${deliveryTo}&order.status=paid`;
                    const desde10 = new Date(hoy); desde10.setDate(desde10.getDate()-10);
                    const filterB = `&order.date_created.from=${encodeURIComponent(desde10.toISOString().split('.')[0]+'.000-00:00')}&order.date_created.to=${encodeURIComponent(new Date(hoy.getTime()+86400000).toISOString().split('.')[0]+'.000-00:00')}&order.status=paid`;

                    async function fetchPaged(filter) {
                        let orders = [];
                        const fd = await fetch(`${cuenta.proxy}/api/orders/search?seller=${sellerId}&offset=0&limit=50&sort=date_desc${filter}`,
                            { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).catch(()=>({results:[],paging:{}}));
                        orders.push(...(fd.results||[]));
                        const total = fd.paging?.total || 0;
                        if (total > 50) {
                            // 19 páginas extra = 1000 órdenes — todas en paralelo
                            const pages = Math.min(Math.ceil(total/50)-1, 19);
                            const extra = await Promise.all(Array.from({length:pages},(_,i)=>
                                fetch(`${cuenta.proxy}/api/orders/search?seller=${sellerId}&offset=${(i+1)*50}&limit=50&sort=date_desc${filter}`,
                                    {headers:{'Authorization':`Bearer ${token}`}}).then(r=>r.json()).catch(()=>({results:[]}))
                            ));
                            extra.forEach(d=>orders.push(...(d.results||[])));
                        }
                        return orders;
                    }

                    const filterC = `&shipping.estimated_delivery_time.from=${deliveryFrom}&shipping.estimated_delivery_time.to=${deliveryTo}&order.status=cancelled`;

                    // Las tres queries en paralelo
                    const [ordersA, ordersB, ordersC] = await Promise.all([fetchPaged(filterA), fetchPaged(filterB), fetchPaged(filterC)]);

                    // Deduplicar A+B (sin canceladas)
                    const seen = new Set();
                    const combined = [];
                    [...ordersA, ...ordersB].forEach(o => {
                        const sid = o.shipping?.id;
                        if (!sid || seen.has(sid) || o.status === 'cancelled') return;
                        seen.add(sid);
                        combined.push(o);
                    });
                    // Canceladas separadas
                    const canceladas = [];
                    ordersC.forEach(o => {
                        const sid = o.shipping?.id;
                        if (!sid || seen.has(sid)) return;
                        seen.add(sid);
                        o._canceladaDevolver = true;
                        canceladas.push(o);
                    });

                    console.log(`[${cuenta.nombre}] NE — A:${ordersA.length} B:${ordersB.length} → ${combined.length} únicos`);

                    prog.total += combined.length; notifyProg();

                    // Batch fetch shipments
                    const BSIZ = 20, BCONC = 8;
                    const sMap = new Map();
                    const bats = [];
                    for (let i = 0; i < combined.length; i += BSIZ) bats.push(combined.slice(i, i+BSIZ));
                    let bi = 0;
                    async function bw() {
                        while (bi < bats.length) {
                            const bat = bats[bi++];
                            const ids = bat.map(o => o.shipping.id);
                            await Promise.all(ids.map(id =>
                                fetch(`${cuenta.proxy}/api/shipments/${id}`, { headers: { 'Authorization': `Bearer ${token}` } })
                                    .then(r2 => r2.ok ? r2.json() : null).catch(()=>null)
                                    .then(s => { if (s?.id) sMap.set(s.id, s); })
                            ));
                            prog.done += bat.length; notifyProg();
                        }
                    }
                    await Promise.all(Array.from({ length: BCONC }, bw));

                    // Batch fetch canceladas también
                    if (canceladas.length > 0) {
                        prog.total += canceladas.length; notifyProg();
                        const batsC = [];
                        for (let i = 0; i < canceladas.length; i += BSIZ) batsC.push(canceladas.slice(i, i+BSIZ));

                            while (bci < batsC.length) {
                                const bat = batsC[bci++];
                                const ids = bat.map(o => o.shipping.id);

                                    fetch(`${cuenta.proxy}/api/shipments/${id}`, { headers: { 'Authorization': `Bearer ${token}` } })

                                        .then(s => { if (s?.id) sMap.set(s.id, s); })
                                ));
                                prog.done += bat.length; notifyProg();
                            }
                        }
                        await Promise.all(Array.from({ length: BCONC }, bwC));

                    canceladas.forEach(order => {

        async function cargarReprogramados() {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>🔄 Buscando reprogramados de los últimos 15 días...</div>`;
            
            // Ocultar secciones normales
            document.getElementById('statsSection').classList.add('hidden');
            document.getElementById('sortToggleRow').style.display = 'none';
            document.getElementById('sortSection').style.display = 'none';
            document.getElementById('btnMapa').classList.add('hidden');
            
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            
            const shippingIdsVistos = new Set();
            let todosReprogramados = [];

            for (const cuenta of CUENTAS) {
                try {
                    const token = await obtenerTokenCuenta(cuenta);
                    if (!token) continue;

                    const cuentaKey = cuenta.nombre.toLowerCase();
                    let sellerId = sessionStorage.getItem(`${cuentaKey}_user_id`);
                    if (!sellerId) {
                        const tokenResponse = await fetch(`${cuenta.proxy}/get-token`);
                        const tokenData = await tokenResponse.json();
                        if (tokenData.user_id) {
                            sellerId = tokenData.user_id;
                            sessionStorage.setItem(`${cuentaKey}_user_id`, sellerId);
                        }
                    }
                    if (!sellerId) continue;

                    // Rango: 15 días atrás hasta hoy
                    const dateFrom = new Date(hoy);
                    dateFrom.setDate(dateFrom.getDate() - 15);
                    const dateTo = new Date(hoy);
                    dateTo.setDate(dateTo.getDate() + 1);
                    dateTo.setHours(23, 59, 59, 0);
                    
                    const dateFromStr = dateFrom.toISOString().split('.')[0] + '.000-00:00';
                    const dateToStr = dateTo.toISOString().split('.')[0] + '.000-00:00';
                    const dateFilter = `&order.date_created.from=${encodeURIComponent(dateFromStr)}&order.date_created.to=${encodeURIComponent(dateToStr)}`;

                    // Paginación inteligente: ir de a una página, parar cuando no haya más
                    let allOrders = [];
                    let page = 0;
                    let hasMore = true;
                    
                    while (hasMore) {
                        content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>🔄 ${cuenta.nombre}: cargando página ${page + 1}... (${allOrders.length} órdenes encontradas)</div>`;
                        
                        const response = await fetch(`${cuenta.proxy}/api/orders/search?seller=${sellerId}&offset=${page * 50}&limit=50&sort=date_desc${dateFilter}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        const results = data.results || [];
                        allOrders.push(...results);
                        
                        // Parar si vino menos de 50 o llegamos al límite de la API
                        if (results.length < 50 || allOrders.length >= (data.paging?.total || 9999)) {
                            hasMore = false;
                        }
                        page++;
                        
                        // Seguridad: máximo 40 páginas (2000 órdenes)
                        if (page >= 40) hasMore = false;
                    }

                    content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>🔄 ${cuenta.nombre}: analizando ${allOrders.length} órdenes...</div>`;

                    // Procesar en lotes de 10 para no saturar
                    for (let i = 0; i < allOrders.length; i += 10) {
                        const batch = allOrders.slice(i, i + 10);
                        
                        content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>🔄 ${cuenta.nombre}: revisando envíos ${i + 1}-${Math.min(i + 10, allOrders.length)} de ${allOrders.length}...</div>`;
                        
                        const batchResults = await Promise.all(batch.map(async (order) => {
                            try {
                                const shippingId = order.shipping?.id;
                                if (!shippingId || shippingIdsVistos.has(shippingId)) return null;
                                shippingIdsVistos.add(shippingId);

                                const shipResponse = await fetch(`${cuenta.proxy}/api/shipments/${shippingId}`, {
                                    headers: { 'Authorization': `Bearer ${token}` }
                                });
                                const shipping = await shipResponse.json();
                                
                                if (shipping.logistic_type !== 'self_service') return null;
                                
                                const state = getOrderState(shipping);
                                if (state === 'reprogramado') {
                                    return {
                                        order,
                                        shipping,
                                        orders: [order],
                                        cuentaNombre: cuenta.nombre,
                                        cuentaColor: cuenta.color
                                    };
                                }
                                return null;
                            } catch (e) {
                                return null;
                            }
                        }));
                        
                        todosReprogramados.push(...batchResults.filter(r => r !== null));
                    }
                } catch (error) {
                    console.error(`Error buscando reprogramados de ${cuenta.nombre}:`, error);
                }
            }

            // Ordenar por fecha de entrega estimada (más viejo primero = más urgente)
            todosReprogramados.sort((a, b) => {
                const fechaA = a.shipping.shipping_option?.estimated_delivery_time?.date || 
                               a.shipping.shipping_option?.estimated_delivery_final?.date || '';
                const fechaB = b.shipping.shipping_option?.estimated_delivery_time?.date || 
                               b.shipping.shipping_option?.estimated_delivery_final?.date || '';
                return fechaA.localeCompare(fechaB);

            // Mostrar resultados
            document.getElementById('badgeFecha').textContent = `🔄 REPROGRAMADOS (15 días)`;
            document.getElementById('badgeCaba').textContent = `📦 Total: ${todosReprogramados.length}`;
            document.getElementById('badgeProvincia').textContent = '';
            // infoBadges siempre visible

            if (todosReprogramados.length === 0) {
                content.innerHTML = '<div class="no-results" style="padding:40px; text-align:center; font-size:18px;">✅ No hay envíos reprogramados en los últimos 15 días</div>';
                return;
            }

            const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            let html = `<div style="background:#FF9800; color:#000; padding:12px 20px; border-radius:10px; text-align:center; font-weight:bold; font-size:16px; margin-bottom:20px;">
                🔄 ${todosReprogramados.length} envío${todosReprogramados.length > 1 ? 's' : ''} reprogramado${todosReprogramados.length > 1 ? 's' : ''} en los últimos 15 días
            </div>`;

            todosReprogramados.forEach(({ shipping, orders: orderList, cuentaNombre, cuentaColor }) => {
                const detail = getReprogramadoDetail(shipping);
                const barrio = shipping.receiver_address?.neighborhood?.name || '';

                const direccionCompleta = `${calle} ${numero}, ${ciudad}, ${provincia}`;
                const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(direccionCompleta)}`;
                
                const comprador = orderList[0]?.buyer?.nickname || 'N/A';
                const orderId = orderList[0]?.id || '';
                const orderUrl = `https://www.mercadolibre.com.ar/ventas/${orderId}/detalle`;

                const fechaEntrega = shipping.shipping_option?.estimated_delivery_time?.date || 
                                    shipping.shipping_option?.estimated_delivery_final?.date;
                
                let diasAtraso = '';
                let fechaLabel = '';
                let urgenciaColor = '#FF9800';
                if (fechaEntrega) {
                    const entrega = new Date(fechaEntrega);
                    entrega.setHours(0, 0, 0, 0);
                    const diffMs = hoy.getTime() - entrega.getTime();
                    const diffDias = Math.round(diffMs / (1000 * 60 * 60 * 24));
                    
                    fechaLabel = `${dias[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth() + 1}`;
                    
                    if (diffDias > 0) {
                        diasAtraso = `hace ${diffDias} día${diffDias > 1 ? 's' : ''}`;
                        if (diffDias >= 5) urgenciaColor = '#f44336';

                        diasAtraso = 'HOY';

                        urgenciaColor = '#00d9ff';

                // Badge de cuenta
                const cuentaBadge = cuentaNombre === 'Mikra'

                    : '<span style="background:#FF6B00; color:white; padding:3px 10px; border-radius:10px; font-size:11px;">🟠 Chaya</span>';

                html += `
                    <div class="envio-card reprogramado" style="position:relative;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
