                    if (fechaEnt) {
                        const e = new Date(fechaEnt); e.setHours(0,0,0,0);
                        const d = Math.round((hoy - e) / 86400000);
                        fechaStr = `${diasN[e.getDay()]} ${e.getDate()}/${e.getMonth()+1}${d > 0 ? ` (${d}d)` : ''}`;
                    }
                    const valor = o.total_amount ? `$${Math.round(o.total_amount).toLocaleString('es-AR')}` : '';
                    const rec   = window._reclamosMap?.get(String(s.id));
                    const idTag = rec?.id ? ` ${rec.id}` : '';
                    const meta  = [fechaStr, t.cuentaNombre].filter(Boolean).join(' · ');
                    let txt = `${num}. *${zona}*${idTag}${valor ? ' · ' + valor : ''}\n`;
                    txt += `   📍 ${calle} ${numero}, ${ciudad}${meta ? ' · ' + meta : ''}\n`;
                    txt += `   🏷️ https://etiquetas-proxy.rafaelassir.workers.dev/?id=${s.id}&view=1\n\n`;
                    return txt;
                }

                // Helper compacto para entradas de _neDevolver (a devolver)
                function _buildDevolverTxt(e, num) {
                    const valor = e.valor ? `$${Math.round(e.valor).toLocaleString('es-AR')}` : '';
                    const fecha = e.gLabel ? `${e.gLabel}${e.gAtraso ? ' ' + e.gAtraso : ''}` : '';
                    const rec   = window._reclamosMap?.get(String(e.shippingId));
                    const idTag = rec?.id ? ` ${rec.id}` : '';
                    const meta  = [fecha, e.cuentaNombre].filter(Boolean).join(' · ');
                    let txt = `${num}. *${e.zona}*${idTag}${valor ? ' · ' + valor : ''}\n`;
                    txt += `   📍 ${e.calle} ${e.numero}, ${e.ciudad}${meta ? ' · ' + meta : ''}\n`;
                    txt += `   🏷️ https://etiquetas-proxy.rafaelassir.workers.dev/?id=${e.shippingId}&view=1\n\n`;
                    return txt;
                }

                // Helper: línea de resumen de atraso para un item
                function _resumenAtraso(t) {
                    const fechaEnt = t.shipping.shipping_option?.estimated_delivery_time?.date
                                   || t.shipping.shipping_option?.estimated_delivery_final?.date;
                    if (!fechaEnt) return '';
                    const entrega = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                    const diff = Math.round((hoy - entrega) / 86400000);
                    const lbl = `${diasN[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth()+1}`;
                    return diff > 0 ? `${lbl} (${diff}d)` : lbl;
                }

                // Compartir todos los no-entregados para reclamar
                window._compartirParaReclamar = function() {
                    const items = todos.filter(t => !t.shipping._canceladaDevolver);
                    if (!items.length) return;
                    const tot = items.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                    const totStr = tot > 0 ? ` · $${Math.round(tot).toLocaleString('es-AR')}` : '';
                    let txt = `🚚 *SIN ENTREGAR (${items.length})${totStr}*\n\n`;
                    items.forEach((t, i) => { txt += _buildItemTxt(t, i + 1); });
                    if (navigator.share) { navigator.share({ text: txt.trim() }).catch(()=>{}); }
                    else { window.open('https://wa.me/?text=' + encodeURIComponent(txt.trim()), '_blank'); }
                };

                // Compartir todo (a devolver primero, luego sin entregar)
                window._compartirTodo = function() {
                    const devolver = todos.filter(t => t.shipping._canceladaDevolver);
                    const enCamino = todos.filter(t => !t.shipping._canceladaDevolver);
                    const totalValor = todos.reduce((sum, t) => sum + (t.order?.total_amount || 0), 0);
                    const totStr = totalValor > 0 ? ` · $${Math.round(totalValor).toLocaleString('es-AR')}` : '';
                    let txt = `📦 *${todos.length} PAQUETES${totStr}*\n\n`;
                    if (devolver.length) {
                        txt += `⚠️ *A DEVOLVER (${devolver.length})*\n\n`;
                        devolver.forEach((t, i) => {
                            const e = window._neDevolver.find(x => x.shippingId == t.shipping.id);
                            txt += e ? _buildDevolverTxt(e, i + 1) : _buildItemTxt(t, i + 1);
                        });
                    }
                    if (enCamino.length) {
                        txt += `🚚 *SIN ENTREGAR (${enCamino.length})*\n\n`;
                        enCamino.forEach((t, i) => { txt += _buildItemTxt(t, i + 1); });
                    }
                    if (navigator.share) { navigator.share({ text: txt.trim() }).catch(()=>{}); }
                    else { window.open('https://wa.me/?text=' + encodeURIComponent(txt.trim()), '_blank'); }
                };

                // ── Modo selección ────────────────────────────────────────────
                window._neSeleccionados = new Set();
                window._modoSeleccion   = false;

                window._activarModoSeleccion = function() {
                    window._modoSeleccion = !window._modoSeleccion;
                    window._neSeleccionados.clear();
                    const btn = document.getElementById('btnSeleccionar');
                    if (btn) btn.textContent = window._modoSeleccion ? '✕ Cancelar' : '☑️ Seleccionar';
                    // Agregar/quitar overlay de selección en cada tarjeta
                    document.querySelectorAll('.ne-mini-card').forEach(card => {
                        const sid = card.dataset.sid;
                        if (!sid) return;
                        if (window._modoSeleccion) {
                            card.style.outline = '2px solid transparent';
                            card.onclick = (e) => { e.stopPropagation(); window._toggleSeleccion(sid, card); };
                        } else {
                            card.style.outline = '';
                            card.onclick = (e) => { if (!e.target.closest('button,a')) _neToggleCard(sid); };
                        }
                    });
                    _actualizarBarraSeleccion();
                };

                window._toggleSeleccion = function(sid, card) {
                    if (window._neSeleccionados.has(sid)) {
                        window._neSeleccionados.delete(sid);
                        card.style.outline = '2px solid transparent';
                        card.style.background = '';
                    } else {
                        window._neSeleccionados.add(sid);
                        card.style.outline = '2px solid #58a6ff';
                        card.style.background = '#0d1f30';
                    }
                    _actualizarBarraSeleccion();
                };

                function _actualizarBarraSeleccion() {
                    let barra = document.getElementById('barraSeleccion');
                    if (!window._modoSeleccion || window._neSeleccionados.size === 0) {
                        if (barra) barra.remove();
                        return;
                    }
                    const selItems = todos.filter(t => window._neSeleccionados.has(String(t.shipping.id)));
                    const totalVal = selItems.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                    const valorStr = totalVal > 0 ? ` · $${Math.round(totalVal).toLocaleString('es-AR')}` : '';
                    if (!barra) {
                        barra = document.createElement('div');
                        barra.id = 'barraSeleccion';
                        barra.style.cssText = 'position:fixed;bottom:70px;left:0;right:0;z-index:9000;display:flex;gap:10px;justify-content:center;padding:10px 16px;background:#0d1117;border-top:1px solid #30363d;';
                        document.body.appendChild(barra);
                    }
                    barra.innerHTML = `
                        <span style="color:#8b949e;font-size:13px;align-self:center;">${window._neSeleccionados.size} seleccionados${valorStr}</span>
                        <button onclick="window._compartirSeleccionados()" style="background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;flex:1;max-width:220px;">
                            📤 Compartir seleccionados
                        </button>`;
                };

                window._compartirSeleccionados = function() {
                    const selItems = todos.filter(t => window._neSeleccionados.has(String(t.shipping.id)));
                    if (!selItems.length) return;
                    const devolver = selItems.filter(t => t.shipping._canceladaDevolver);
                    const enCamino = selItems.filter(t => !t.shipping._canceladaDevolver);
                    const totalVal = selItems.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                    const totalValStr = totalVal > 0 ? ` · $${Math.round(totalVal).toLocaleString('es-AR')}` : '';
                    let txt = `📦 *${selItems.length} PAQUETES${totalValStr}*\n\n`;
                    if (devolver.length) {
                        txt += `⚠️ *A DEVOLVER (${devolver.length})*\n\n`;
                        devolver.forEach((t, i) => {
                            const e = window._neDevolver.find(x => x.shippingId == t.shipping.id);
                            txt += e ? _buildDevolverTxt(e, i + 1) : _buildItemTxt(t, i + 1);
                        });
                    }
                    if (enCamino.length) {
                        txt += `🚚 *SIN ENTREGAR (${enCamino.length})*\n\n`;
                        enCamino.forEach((t, i) => { txt += _buildItemTxt(t, i + 1); });
                    }
                    if (navigator.share) { navigator.share({ text: txt.trim() }).catch(()=>{}); }
                    else { window.open('https://wa.me/?text=' + encodeURIComponent(txt.trim()), '_blank'); }
                };

                // ── Archivar paquetes (ocultar del listado, guardado en localStorage) ──
                function _getArchivados() {
                    try {
                        return new Set(JSON.parse(localStorage.getItem('_neArchivados') || '[]'));
                    } catch(e) { return new Set(); }
                }
                function _saveArchivados(set) {
                    try { localStorage.setItem('_neArchivados', JSON.stringify([...set])); } catch(e) {}
                }

                window._archivarPaquete = function(sid, event) {
                    if (event) event.stopPropagation();
                    _mostrarPIN(
                        `🗃️ <strong>Archivar paquete</strong><br><span style="color:#8b949e;font-size:12px;">Este paquete dejará de aparecer para todos.</span>`,
                        async () => {
                            // 1. Guardar en GAS (actualizar o crear reclamo con estado=archivado)
                            const recExist = window._reclamosMap?.get(String(sid));
                            if (recExist) {
                                _gasReclamo({ action: 'update_reclamo', shippingId: sid, estado: 'archivado' }).catch(()=>{});
                            } else {
                                const item = (window._neTodos || []).find(t => String(t.shipping.id) === String(sid));
                                _gasReclamo({
                                    action:     'add_reclamo',
                                    shippingId: sid,
                                    orderId:    String(item?.order?.id || ''),
                                    comprador:  item?.order?.buyer?.nickname || '',
                                    zona:       item?.shipping?._zona || '',
                                    cuenta:     item?.cuentaNombre || '',
                                    tipo:       'archivado',
                                    valor:      Math.round(item?.order?.total_amount || 0),
                                    notas:      'archivado manualmente',
                                }).catch(()=>{});
                            }
                            // 2. Actualizar mapa local
                            if (window._reclamosMap) {
                                const rec = window._reclamosMap.get(String(sid)) || { shippingId: sid };
                                window._reclamosMap.set(String(sid), { ...rec, estado: 'archivado' });
                                _saveReclamosCache(window._reclamosMap);
                            }
                            // 3. También en localStorage local por si acaso
                            const set = _getArchivados();
                            set.add(String(sid));
                            _saveArchivados(set);
                            // 4. Ocultar la tarjeta con animación
                            const card = document.querySelector(`.ne-mini-card[data-sid="${sid}"]`);
                            if (card) {
                                card.style.transition = 'opacity .3s, max-height .4s';
                                card.style.opacity = '0';
                                card.style.overflow = 'hidden';
                                card.style.maxHeight = card.offsetHeight + 'px';
                                setTimeout(() => { card.style.maxHeight = '0'; card.style.marginBottom = '0'; }, 50);
                                setTimeout(() => card.remove(), 450);
                            }
                            _showNEToast('🗃️ Paquete archivado para todos');
                        }
                    );
                };

                window._desarchivarTodo = function() {
                    localStorage.removeItem('_neArchivados');
                    _showNEToast('↩️ Archivados restaurados');
                    renderNECards(window._neCurrentFilter || 'all');
                };

                // Marcar como ENTREGADO (llegó al cliente, no volvió a nosotros).
                // Pide PIN owner. Se resuelve sin descontar y se oculta para todos.
                window._marcarEntregado = function(sid, event) {
                    if (event) event.stopPropagation();
                    _mostrarPIN(`<b style="color:#86efac;">📬 Marcar ENTREGADO</b><br><small style="color:#8b949e;">Llegó al cliente · se archiva sin descontar</small>`, ok => {
                        if (!ok) return;
                        const rec = window._reclamosMap?.get(String(sid));
                        if (rec) { rec.estado = 'entregado'; _saveReclamosCache(window._reclamosMap); }
                        _gasReclamo({ action: 'update_reclamo', shippingId: String(sid), estado: 'entregado' })
                            .then(d => { if (d?.ok) _showNEToast('📬 Marcado como entregado'); });
                        const card = document.querySelector(`.ne-mini-card[data-sid="${sid}"]`);
                        if (card) {
                            card.style.transition = 'opacity .3s, max-height .4s';
                            card.style.opacity = '0';
                            card.style.maxHeight = card.offsetHeight + 'px';
                            card.style.overflow = 'hidden';
                            setTimeout(() => { card.style.maxHeight = '0'; card.style.marginBottom = '0'; }, 50);
                            setTimeout(() => card.remove(), 450);
                        }
                    });
                };

                // Marcar reclamo como descontado (pide PIN owner — afecta la cuenta corriente)
                window._marcarDescontado = function(sid, event) {
                    if (event) event.stopPropagation();
                    const btn = event?.currentTarget || event?.target;
                    _mostrarPIN(`<b style="color:#58a6ff;">✅ Marcar DESCONTADO</b><br><small style="color:#8b949e;">Se descontó de la cuenta corriente</small>`, ok => {
                        if (!ok) return;
                        if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
                        _gasReclamo({ action: 'update_reclamo', shippingId: String(sid), estado: 'descontado' })
                            .then(d => {
                                if (d?.ok) {
                                    const rec = window._reclamosMap?.get(String(sid));
                                    if (rec) rec.estado = 'descontado';
                                    const valEl = document.getElementById('recval-' + sid);
                                    if (valEl) { valEl.style.color = '#555'; valEl.style.textDecoration = 'line-through'; if (!valEl.textContent.includes('✅')) valEl.textContent += ' ✅'; }
                                    _showNEToast('✅ Marcado como descontado');
                                    if (btn) { btn.textContent = '✅ Descontado'; btn.style.background = '#0d2233'; btn.style.color = '#8b949e'; btn.style.borderColor = '#30363d'; }
                                } else {
                                    if (btn) { btn.textContent = '✅ Descontado'; btn.disabled = false; }
                                    _showNEToast('⚠️ Error al guardar');
                                }
                            });
                    });
                };

                // Copiar valor al portapapeles en formato Excel
                // Resultado: -27959  [TAB][TAB]  3/6  [TAB]  Paquete perdido · #001
                window._copiarValorExcel = function(valorNeg, fecha, sid) {
                    const rec  = window._reclamosMap?.get(String(sid));
                    const id   = rec?.id || '';
                    const desc = 'Paquete' + (id ? ' ' + id : '');
                    const texto = valorNeg + '\t\t' + fecha + '\t' + desc;
                    const showOk = () => {
                        const t = document.createElement('div');
                        t.textContent = '✅ Copiado al Excel';
                        t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#238636;color:white;padding:10px 22px;border-radius:10px;font-size:15px;font-weight:700;z-index:99999;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.5);';
                        document.body.appendChild(t);
                        setTimeout(() => t.remove(), 1600);
                    };
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(texto).then(showOk).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = texto; document.body.appendChild(ta);
                            ta.select(); document.execCommand('copy'); ta.remove(); showOk();
                        });
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = texto; document.body.appendChild(ta);
                        ta.select(); document.execCommand('copy'); ta.remove(); showOk();
                    }
                };

                // ── Buscador de reclamos ───────────────────────────────────
                window._abrirBuscadorReclamos = function() {
                    // Si ya existe el modal, solo mostrarlo
                    let modal = document.getElementById('modalBuscadorReclamos');
                    if (modal) { modal.style.display = 'flex'; document.getElementById('inputBuscadorReclamos').focus(); return; }
                    modal = document.createElement('div');
                    modal.id = 'modalBuscadorReclamos';
                    modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:stretch;padding:12px;gap:10px;overflow:hidden;';
                    modal.innerHTML = `
                        <div style="display:flex;gap:8px;align-items:center;">
                            <input id="inputBuscadorReclamos" placeholder="Buscar por #ID, comprador, zona, orden..."
                                style="flex:1;background:#161b22;border:1.5px solid #30363d;color:#e6edf3;padding:10px 14px;border-radius:10px;font-size:14px;outline:none;"
                                oninput="window._buscarReclamos(this.value)" />
                            <button onclick="document.getElementById('modalBuscadorReclamos').style.display='none'"
                                style="background:#21262d;color:#e6edf3;border:1px solid #30363d;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap;">✕ Cerrar</button>
                        </div>
                        <div id="resultadosBuscador" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
                            <p style="color:#8b949e;text-align:center;margin-top:30px;">⏳ Cargando...</p>
                        </div>`;
                    document.body.appendChild(modal);
                    document.getElementById('inputBuscadorReclamos').focus();
                    // Mostrar TODOS de entrada (ordenados de mayor a menor #ID)
                    window._buscarReclamos('');
                };

                window._buscarReclamos = function(q) {
                    const cont = document.getElementById('resultadosBuscador');
                    if (!cont) return;
                    const trim = (q || '').trim();
                    const ql = trim.toLowerCase();
                    const token = (window._buscadorToken = (window._buscadorToken || 0) + 1);
                    const matchLocal = r => !ql ||
                        r.id?.toLowerCase().includes(ql) || r.comprador?.toLowerCase().includes(ql) ||
                        r.zona?.toLowerCase().includes(ql) || String(r.orderId).includes(ql) ||
                        String(r.shippingId).includes(ql);

                    // 1) Instantáneo desde memoria
                    const mapa = new Map();
                    window._reclamosMap?.forEach(r => { if (matchLocal(r)) mapa.set(String(r.shippingId), r); });
                    if (mapa.size) _renderResultadosReclamos([...mapa.values()]);
                    else cont.innerHTML = '<p style="color:#8b949e;text-align:center;margin-top:30px;">⏳ Buscando...</p>';

                    // 2) GAS — unión (nunca muestra menos). Vacío = traer TODOS.
                    const req = ql
                        ? _gasReclamo({ action: 'search_reclamos', q: trim })
                        : _gasReclamo({ action: 'get_reclamos' });
                    req.then(d => {
                            if (token !== window._buscadorToken) return;
                            (d?.records || []).forEach(r => mapa.set(String(r.shippingId), r));
                            if (mapa.size) _renderResultadosReclamos([...mapa.values()]);
                            else cont.innerHTML = '<p style="color:#8b949e;text-align:center;margin-top:30px;">Sin resultados</p>';
                        })
                        .catch(() => { if (token === window._buscadorToken && !mapa.size) cont.innerHTML = '<p style="color:#f85149;text-align:center;margin-top:30px;">Error de conexión</p>'; });
                };

                function _renderResultadosReclamos(records) {
                    const cont = document.getElementById('resultadosBuscador');
                    if (!cont) return;
                    const estadoMeta = {
                        pendiente:   { col: '#e3b341', lbl: 'PENDIENTE' },
                        descontado:  { col: '#58a6ff', lbl: 'DESCONTADO' },
                        en_deposito: { col: '#ffa040', lbl: 'EN DEPÓSITO' },
                        recibido:    { col: '#3fb950', lbl: 'RECIBIDO' },
                        entregado:   { col: '#86efac', lbl: 'ENTREGADO' },
                        reclamado:   { col: '#f85149', lbl: 'RECLAMADO' },
                        archivado:   { col: '#8b949e', lbl: 'ARCHIVADO' },
                    };
                    const RESUELTOS = new Set(['recibido', 'archivado', 'entregado']);
                    // Orden: por #ID de mayor a menor (los más nuevos arriba)
                    const numId = r => parseInt(String(r.id || '').replace(/\D/g, ''), 10) || 0;
                    const ordenados = [...records].sort((a, b) => numId(b) - numId(a));
                    const activos = ordenados.filter(r => !RESUELTOS.has(r.estado)).length;

                    const header = `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;position:sticky;top:0;background:rgba(0,0,0,.85);z-index:1;">
                        <span style="color:#8b949e;font-size:12px;">${ordenados.length} resultado${ordenados.length!==1?'s':''}${activos?` · <b style="color:#e3b341;">${activos} sin resolver</b>`:''}</span>
                    </div>`;

                    cont.innerHTML = header + ordenados.map(r => {
                        const m = estadoMeta[r.estado] || { col: '#8b949e', lbl: (r.estado||'—').toUpperCase() };
                        const valStr = r.valor > 0 ? `$${Math.round(r.valor).toLocaleString('es-AR')}` : '';
                        const tachado = (r.estado === 'descontado' || r.estado === 'en_deposito');
                        const tipoLbl = r.tipo === 'driver_devolver'
                            ? '<span style="color:#f85149;font-size:11px;">⚠️ A devolver</span>'
                            : r.tipo === 'demorado' ? '<span style="color:#e3b341;font-size:11px;">⏱️ Demorado</span>' : '';
                        const resuelto = RESUELTOS.has(r.estado);
                        const botones = resuelto
                            ? `<button onclick="window._cambiarEstadoReclamo('${r.shippingId}','pendiente',this)" style="background:#21262d;color:#e3b341;border:1px solid #e3b341;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;">↩️ Reabrir</button>
                               <button onclick="verEtiqueta('${r.shippingId}',event)" style="background:#1a2a4a;color:#58a6ff;border:1px solid #1E88E5;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;">🏷️ Etiqueta</button>`
                            : `<button onclick="window._cambiarEstadoReclamo('${r.shippingId}','descontado',this)" style="background:#1a2a3a;color:#58a6ff;border:1.5px solid #58a6ff;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;">✅ Descontado</button>
                               <button onclick="window._cambiarEstadoReclamo('${r.shippingId}','recibido',this)" style="background:#1a3d16;color:#4CAF50;border:1.5px solid #4CAF50;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;">📥 Recibido</button>
                               <button onclick="verEtiqueta('${r.shippingId}',event)" style="background:#1a2a4a;color:#58a6ff;border:1px solid #1E88E5;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;">🏷️</button>
                               <button onclick="window._cambiarEstadoReclamo('${r.shippingId}','archivado',this)" style="background:#1a1a1a;color:#8b949e;border:1px solid #484f58;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;">🗃️</button>`;
                        return `<div style="background:#161b22;border:1px solid #30363d;border-left:3px solid ${m.col};border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;${resuelto?'opacity:.65;':''}">
                            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                                <span style="background:#1f3a1f;color:#3fb950;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;font-family:monospace;">${r.id}</span>
                                <span style="color:${m.col};font-size:11px;font-weight:700;">${m.lbl}</span>
                                ${valStr ? `<span style="color:${tachado?'#555':'#3fb950'};font-size:12px;font-weight:700;${tachado?'text-decoration:line-through;':''}">${valStr}</span>` : ''}
                                <span style="color:#8b949e;font-size:11px;margin-left:auto;">${r.fechaAlta||''}</span>
                            </div>
                            <div style="color:#e6edf3;font-size:13px;font-weight:700;">📍 ${r.zona || '—'}</div>
                            <div style="color:#8b949e;font-size:11px;">${r.cuenta || '—'}${r.orderId?` · <span style="font-family:monospace;">#${r.orderId}</span>`:''}</div>
                            ${tipoLbl}
                            ${r.fechaRecibido ? `<div style="color:#3fb950;font-size:11px;">📥 ${r.fechaRecibido}</div>` : ''}
                            <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;">${botones}</div>
                        </div>`;
                    }).join('');
                }

                window._cambiarEstadoReclamo = function(sid, estado, btn) {
                    // Acciones que cambian plata/estado para todos → piden PIN owner.
                    // 'pendiente' (reabrir) no pide.
                    const sensible = (estado !== 'pendiente');
                    const ejecutar = () => {
                        if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
                        _gasReclamo({ action: 'update_reclamo', shippingId: String(sid), estado })
                            .then(d => {
                                if (d?.ok) {
                                    _showNEToast(`✅ Marcado como ${estado}`);
                                    const rec = window._reclamosMap?.get(String(sid));
                                    if (rec) { rec.estado = estado; _saveReclamosCache(window._reclamosMap); }
                                    if (estado === 'archivado') { const a = _getArchivados(); a.add(String(sid)); _saveArchivados(a); }
                                    const q = document.getElementById('inputBuscadorReclamos')?.value || '';
                                    window._buscarReclamos(q);
                                } else {
                                    if (btn) { btn.disabled = false; btn.textContent = estado; }
                                    _showNEToast('⚠️ Error al guardar');
                                }
                            });
                    };
                    if (sensible) {
                        const accionLbl = { recibido:'📥 Marcar RECIBIDO', archivado:'🗃️ Archivar', descontado:'✅ Marcar DESCONTADO', entregado:'📬 Marcar ENTREGADO', reclamado:'🚨 Marcar RECLAMADO' };
                        _mostrarPIN(`<b>${accionLbl[estado] || estado}</b><br><small style="color:#8b949e;">Ingresá tu código</small>`, ok => { if (ok) ejecutar(); });
                    } else {
                        ejecutar();
                    }
                };

                // ── Marcar en depósito (código de logística u owner) ───
                window._marcarEnDeposito = function(sid, event) {
                    if (event) event.stopPropagation();
                    _mostrarPIN(
                        `<b style="color:#ffa040;">📦 Marcar en depósito</b><br><small style="color:#8b949e;">Ingresá tu código</small>`,
                        function(ok) {
                            if (!ok) return;
                            const rec = window._reclamosMap?.get(String(sid));
                            if (rec) { rec.estado = 'en_deposito'; window._reclamosMap.set(String(sid), rec); }
                            // Feedback visual inmediato
                            const card = document.querySelector(`.ne-mini-card[data-sid="${sid}"]`);
                            if (card) {
                                card.classList.add('ne-mini-deposito');
                                card.classList.remove('ne-mini-cancelada');
                                card.style.borderLeftColor = '#ffa040';
                                const icon = card.querySelector('.ne-devolver-icon');
                                if (icon) icon.textContent = '📦';
                            }
                            _gasReclamo({ action: 'update_reclamo', shippingId: String(sid), estado: 'en_deposito' })
                                .then(d => {
                                    if (d?.ok) {
                                        _showNEToast('📦 En depósito guardado');
                                        if (window.renderNECards) window.renderNECards(window._neCurrentFilter || 'all');
                                    } else {
                                        _showNEToast('⚠️ Error al guardar');
                                    }
                                });
                        },
                        [_PIN_LOGISTICA, _PIN_OWNER]
                    );
                };

                // Compartir individual item en-camino (por shipping ID)
                window._compartirItemNE = function(obj, event, _unused) {
                    if (event) event.stopPropagation();
                    const sid = obj?.sid || obj;
                    const item = todos.find(t => String(t.shipping.id) === String(sid));
                    if (!item) return;
                    const txt = _buildItemTxt(item, 1).trimEnd();
                    const header = item.shipping._canceladaDevolver
                        ? `⚠️ *PAQUETE A DEVOLVER*\n\n`
                        : `🚚 *PAQUETE SIN ENTREGAR*\n\n`;
                    const full = header + txt;
                    if (navigator.share) { navigator.share({ text: full }).catch(()=>{}); }
                    else { window.open('https://wa.me/?text=' + encodeURIComponent(full), '_blank'); }
                };

                let html = '';
                if (filterKey === 'deposito') {
                    window._neDevolver = [];
                    const _esEnDep = sid => window._reclamosMap?.get(String(sid))?.estado === 'en_deposito';
                    const depVis = todosVis.filter(t => t.shipping._canceladaDevolver && _esEnDep(t.shipping.id));
                    if (!depVis.length) {
                        html += `<div class="no-results" style="padding:30px;text-align:center;">Sin paquetes en depósito</div>`;
                    } else {
                        const totalDep2 = depVis.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                        html += `<div style="background:#130e00;border:1px solid #5a3a00;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                            <span style="color:#ffa040;font-size:14px;font-weight:700;">📦 ${depVis.length} paquete${depVis.length!==1?'s':''} en depósito</span>
                            ${totalDep2 > 0 ? `<span style="color:#ffa040;font-size:13px;font-weight:700;">$${Math.round(totalDep2).toLocaleString('es-AR')}</span>` : ''}
                        </div>`;
                        depVis.forEach(item => {
                            const fechaEnt = item.shipping.shipping_option?.estimated_delivery_time?.date
                                           || item.shipping.shipping_option?.estimated_delivery_final?.date;
                            let gLabel = '', gAtraso = '';
                            if (fechaEnt) {
                                const entrega = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                                const diffDias = Math.round((hoy - entrega) / 86400000);
                                gLabel = `${diasN[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth()+1}`;
                                gAtraso = diffDias > 0 ? `hace ${diffDias}d` : '';
                            }
                            html += buildCard(item, gLabel, gAtraso, '#ffa040');
                        });
                    }
                } else if (filterKey === 'canceladas') {
                    // Limpiar lista para regenerar con índices correctos
                    window._neDevolver = [];
                    const cancelVis = todosVis.filter(t => t.shipping._canceladaDevolver);
                    html += `<div style="text-align:right;margin-bottom:12px;">
                        <button onclick="window._compartirTodosDevolver()" style="background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">
                            📤 Compartir todos (${cancelVis.length})
                        </button>
                    </div>`;
                    cancelVis.forEach(item => {
                        const fechaEnt = item.shipping.shipping_option?.estimated_delivery_time?.date
                                       || item.shipping.shipping_option?.estimated_delivery_final?.date;
                        let gLabel = '', gAtraso = '', gColor = '#f85149';
                        if (fechaEnt) {
                            const entrega = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                            const diffDias = Math.round((hoy - entrega) / 86400000);
                            gLabel = `${diasN[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth()+1}`;
                            gAtraso = diffDias > 0 ? `hace ${diffDias}d` : diffDias === 0 ? 'HOY' : `en ${Math.abs(diffDias)}d`;
                        }
                        html += buildCard(item, gLabel, gAtraso, gColor);
                    });
                } else if (filterKey === 'en-camino') {
                    // Solo los en camino sin entregar (excluye canceladas)
                    window._neDevolver = [];
                    const enCaminoItems = todosVis.filter(t => !t.shipping._canceladaDevolver);
                    html += `<div style="text-align:right;margin-bottom:12px;">
                        <button onclick="window._compartirParaReclamar()" style="background:linear-gradient(135deg,#FF6B00,#e85d04);color:white;border:none;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">
                            📋 Compartir para reclamar (${enCaminoItems.length})
                        </button>
                    </div>`;
                    enCaminoItems.forEach(item => {
                        const fechaEnt = item.shipping.shipping_option?.estimated_delivery_time?.date
                                       || item.shipping.shipping_option?.estimated_delivery_final?.date;
                        let gLabel = '', gAtraso = '', gColor = '#484f58';
                        if (fechaEnt) {
                            const entrega = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                            const diffDias = Math.round((hoy - entrega) / 86400000);
                            gLabel = `${diasN[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth()+1}`;
                            gAtraso = diffDias > 0 ? `hace ${diffDias}d` : diffDias === 0 ? 'HOY' : `en ${Math.abs(diffDias)}d`;
                            gColor = diffDias >= 5 ? '#f44336' : diffDias >= 3 ? '#FF6B00' : '#FF9800';
                        }
                        html += buildCard(item, gLabel, gAtraso, gColor);
                    });
                } else {
                    window._neDevolver = [];

                    // Helper para separar según estado en reclamos
                    const _esEnDeposito = sid => window._reclamosMap?.get(String(sid))?.estado === 'en_deposito';

                    if (filterKey === 'all' && todosVis.length > 0) {
                        const accBtn = `flex:1;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;white-space:nowrap;`;
                        html += `<div style="display:flex;gap:7px;margin-bottom:12px;">
                            <button onclick="window._compartirTodo()" style="${accBtn}background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;">📤 Compartir</button>
                            <button onclick="window._activarModoSeleccion()" id="btnSeleccionar" style="${accBtn}background:#16242e;color:#58a6ff;border:1px solid #2b5068;">☑️ Elegir</button>
                            <button onclick="window._abrirBuscadorReclamos()" style="${accBtn}background:#16241a;color:#3fb950;border:1px solid #275232;">🔍 Buscar</button>
                        </div>`;
                    }

                    // ── SECCIÓN 1: ⚠️ DRIVER DEBE DEVOLVER (aún no llegaron al depósito) ──
                    const aDevolver = todosVis.filter(t => t.shipping._canceladaDevolver && !_esEnDeposito(t.shipping.id));
                    if (aDevolver.length) {
                        const totalADev = aDevolver.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                        const totalStr  = totalADev > 0 ? `$${Math.round(totalADev).toLocaleString('es-AR')}` : '';
                        let cardsDev = '';
                        aDevolver.forEach(item => {
                            const fechaEnt = item.shipping.shipping_option?.estimated_delivery_time?.date
                                           || item.shipping.shipping_option?.estimated_delivery_final?.date;
                            let gLabel = '', gAtraso = '';
                            if (fechaEnt) {
                                const entrega = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                                const diffDias = Math.round((hoy - entrega) / 86400000);
                                gLabel = `${diasN[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth()+1}`;
                                gAtraso = diffDias > 0 ? `hace ${diffDias}d` : diffDias === 0 ? 'HOY' : `en ${Math.abs(diffDias)}d`;
                            }
                            cardsDev += buildCard(item, gLabel, gAtraso, '#f85149');
                        });
                        html += `<div class="ne-sec ne-sec-devolver" onclick="window._toggleSec('devolver')" style="cursor:pointer;">
                            <span class="ne-sec-chev" id="secchev-devolver" style="transform:rotate(90deg);">›</span>⚠️ A DEVOLVER · ${aDevolver.length}<span class="ne-sec-count">${totalStr}</span></div>
                        <div class="ne-sec-body" id="secbody-devolver">${cardsDev}</div>`;
                    }

                    // ── SECCIÓN 2: 📦 EN DEPÓSITO ────────────────────────────
                    const enDeposito = todosVis.filter(t => t.shipping._canceladaDevolver && _esEnDeposito(t.shipping.id));
                    if (enDeposito.length) {
                        const totalDep = enDeposito.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                        const totalDepStr = totalDep > 0 ? `$${Math.round(totalDep).toLocaleString('es-AR')}` : '';
                        let cardsDep = '';
                        enDeposito.forEach(item => {
                            const fechaEnt = item.shipping.shipping_option?.estimated_delivery_time?.date
                                           || item.shipping.shipping_option?.estimated_delivery_final?.date;
                            let gLabel = '', gAtraso = '';
                            if (fechaEnt) {
                                const entrega = new Date(fechaEnt); entrega.setHours(0,0,0,0);
                                const diffDias = Math.round((hoy - entrega) / 86400000);
                                gLabel = `${diasN[entrega.getDay()]} ${entrega.getDate()}/${entrega.getMonth()+1}`;
                                gAtraso = diffDias > 0 ? `hace ${diffDias}d` : diffDias === 0 ? 'HOY' : '';
                            }
                            cardsDep += buildCard(item, gLabel, gAtraso, '#ffa040');
                        });
                        html += `<div class="ne-sec ne-sec-deposito" onclick="window._toggleSec('deposito')" style="cursor:pointer;">
                            <span class="ne-sec-chev" id="secchev-deposito" style="transform:rotate(90deg);">›</span>📦 EN DEPÓSITO · ${enDeposito.length}<span class="ne-sec-count">${totalDepStr}</span></div>
                        <div class="ne-sec-body" id="secbody-deposito">${cardsDep}</div>`;
                    }

                    // ── SECCIÓN 3: 🔄 SIN ENTREGAR agrupados por fecha ────────
                    const hayCamino = todosVis.some(t => !t.shipping._canceladaDevolver);
                    if (hayCamino) {
                        const topMargin = (aDevolver.length || enDeposito.length) ? 'margin-top:16px;' : '';
                        const totalCam = todosVis.filter(t => !t.shipping._canceladaDevolver)
                            .reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                        const totalCamStr = totalCam > 0 ? ` · $${Math.round(totalCam).toLocaleString('es-AR')}` : '';
                        const countCam = todosVis.filter(t => !t.shipping._canceladaDevolver).length;
                        if (aDevolver.length || enDeposito.length) {
                            const totalCamClean = totalCam > 0 ? `$${Math.round(totalCam).toLocaleString('es-AR')}` : '';
                            html += `<div class="ne-sec ne-sec-entregar">🔄 SIN ENTREGAR · ${countCam}<span class="ne-sec-count">${totalCamClean}</span></div>`;
                        }
                        groups.forEach(({ label, atraso, color, items }, gKey) => {
                            if (filterKey !== 'all' && gKey !== filterKey) return;
                            const visItems = (acctFilt === 'all' ? items : items.filter(t => t.cuentaNombre === acctFilt))
                                .filter(t => !t.shipping._canceladaDevolver);
                            if (!visItems.length) return;
                            const diaTotal = visItems.reduce((s, t) => s + (t.order?.total_amount || 0), 0);
                            const diaTotalStr = diaTotal > 0 ? `$${Math.round(diaTotal).toLocaleString('es-AR')}` : '';
                            // Abrir el cajón sólo si se filtró por ese día puntual; en "Todos" → cerrado
                            const abierto = filterKey === gKey;
                            const txtCol  = color === '#FFE600' ? '#000' : '#fff';
                            let cardsHtml = '';
                            visItems.forEach(item => cardsHtml += buildCard(item, label, atraso, color));
                            html += `<div class="ne-dia-drawer">
                                <button class="ne-dia-hdr" onclick="window._toggleDia('${gKey}')" style="border-left:4px solid ${color};">
                                    <span class="ne-dia-chev" id="diachev-${gKey}" style="${abierto?'transform:rotate(90deg);':''}">›</span>
                                    <span class="ne-dia-label">📅 ${label}</span>
                                    ${atraso ? `<span class="ne-dia-atraso" style="background:${color};color:${txtCol};">${atraso}</span>` : ''}
                                    <span class="ne-dia-spacer"></span>
                                    ${diaTotalStr ? `<span class="ne-dia-val">${diaTotalStr}</span>` : ''}
                                    <span class="ne-dia-count">${visItems.length}</span>
                                </button>
                                <div class="ne-dia-body" id="nedia-${gKey}" style="display:${abierto?'block':'none'};">
                                    ${cardsHtml}
                                </div>
                            </div>`;
                        });
                    }
                }

                if (!html) html = `<div class="no-results" style="padding:30px;text-align:center;">Sin envíos para ese filtro</div>`;
                container.innerHTML = html;
            }

            // ── Armar botones de filtro por día ───────────────────────────
            const btnStyle = `border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;min-height:34px;touch-action:manipulation;`;
            const activarBtn = `document.querySelectorAll('.ne-day-btn').forEach(b=>{b.style.outline='none';b.style.opacity='0.6'});this.style.outline='2px solid white';this.style.opacity='1';`;

            let btnHtml = `<button class="ne-day-btn" data-key="all"
                style="${btnStyle}background:#21262d;color:#e6edf3;"
                onclick="${activarBtn}renderNECards('all')">
                Todos (${todos.length})
            </button>`;

            groups.forEach(({ label, atraso, color, items }, gKey) => {
                const nonCancelled = items.filter(t => !t.shipping._canceladaDevolver);
                if (nonCancelled.length === 0) return; // no mostrar días vacíos
                const txtColor = color === '#FFE600' ? '#000' : 'white';
                btnHtml += `<button class="ne-day-btn" data-key="${gKey}"
                    style="${btnStyle}background:${color};color:${txtColor};opacity:0.6;"
                    onclick="${activarBtn}renderNECards('${gKey}')">
                    ${label}${atraso ? ' · '+atraso : ''} (${nonCancelled.length})
                </button>`;
            });

            if (canceladaCount > 0) {
                btnHtml += `<button class="ne-day-btn" data-key="canceladas"
                    style="${btnStyle}background:#f85149;color:white;opacity:0.6;"
                    onclick="${activarBtn}renderNECards('canceladas')">
                    ⚠️ A devolver (${canceladaCount})
                </button>`;
            }
            if (enDepositoCount > 0) {
                btnHtml += `<button class="ne-day-btn" data-key="deposito"
                    style="${btnStyle}background:#e65100;color:#ffd0a0;opacity:0.6;"
                    onclick="${activarBtn}renderNECards('deposito')">
                    📦 Depósito (${enDepositoCount})
                </button>`;
            }

            // Construir el contenedor raíz
            const statBtn = `border:none;cursor:pointer;flex:1 1 0;min-width:0;padding:9px 6px;border-radius:11px;text-align:center;font-family:inherit;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;`;
            const statNum = `font-size:19px;font-weight:800;`;
            const statLbl = `font-size:10px;font-weight:600;opacity:.92;`;
            let html = `
            <div style="display:flex;gap:7px;margin-bottom:12px;align-items:stretch;">
                ${canceladaCount > 0 ? `<button id="neBannerDevolver" style="${statBtn}background:linear-gradient(160deg,#c62828,#7b1a1a);color:#fff;" onclick="renderNECards('all')"><span style="${statNum}">⚠️ ${canceladaCount}</span><span style="${statLbl}">a devolver</span></button>` : ''}
                ${enDepositoCount > 0 ? `<button id="neBannerDeposito" style="${statBtn}background:linear-gradient(160deg,#e65100,#3a2200);color:#ffa040;border:1px solid #ffa040;" onclick="renderNECards('deposito')"><span style="${statNum}">📦 ${enDepositoCount}</span><span style="${statLbl}">depósito</span></button>` : ''}
                ${enCaminoCount > 0 ? `<button id="neBannerEnCamino" style="${statBtn}background:linear-gradient(160deg,#00b8d4,#0097a7);color:#04222a;" onclick="renderNECards('en-camino')"><span style="${statNum}">🔄 ${enCaminoCount}</span><span style="${statLbl}">sin entregar</span></button>` : ''}
                ${fallidoCount  > 0 ? `<button style="${statBtn}background:linear-gradient(160deg,#f85149,#da3633);color:#fff;" onclick="renderNECards('en-camino')"><span style="${statNum}">🚫 ${fallidoCount}</span><span style="${statLbl}">fallido${fallidoCount!==1?'s':''}</span></button>` : ''}
                <button onclick="abrirEscaner()" style="${statBtn}background:linear-gradient(160deg,#2d5a27,#1a3d16);color:#81C784;border:1px solid #4CAF50;flex:0 0 60px;"><span style="${statNum}">📷</span><span style="${statLbl}">Escanear</span></button>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:10px;background:#161b22;border:1px solid #21262d;border-radius:12px;">
                ${btnHtml}
            </div>
            <div id="neCards"></div>
            <div style="text-align:center;margin-top:16px;">
                <button onclick="cargarFlexHoy()" style="background:#3483FA;padding:12px 30px;font-size:15px;">🔙 Volver a HOY</button>
            </div>`;

            // ── Indicador de frescura de datos (caché vs frescos) ──────────
            if (fromCache) {
                const edad = cacheAgeMin || 0;
                const edadTxt = edad < 1 ? 'recién' : `hace ${edad} min`;
                html = `<div id="neFreshBadge" style="background:#2a2410;border:1px solid #7a6020;border-radius:10px;padding:8px 14px;margin-bottom:10px;font-size:12px;color:#e3b341;display:flex;align-items:center;gap:8px;font-weight:600;">
                    <div class="loading-spinner" style="width:13px;height:13px;border-width:2px;border-color:#e3b341 transparent #e3b341 transparent;"></div>
                    🟡 Mostrando caché (${edadTxt}) · actualizando con Mercado Libre…
                </div>` + html;
            } else {
                html = `<div id="neFreshBadge" style="background:#0f2a14;border:1px solid #2e7d32;border-radius:10px;padding:8px 14px;margin-bottom:10px;font-size:12px;color:#81C784;display:flex;align-items:center;gap:8px;font-weight:600;transition:opacity .5s;">
                    🟢 Datos frescos · actualizado ${new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
                </div>` + html;
            }

            content.innerHTML = html;

            // Si son datos frescos, atenuar el cartel verde a los 4s (deja de molestar)
            if (!fromCache) {
